<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="진로 연계 탐구주제 선택부터 보고서 초안, 자료 탐구, 완성 보고서, 자기평가서까지 이어지는 학생용 워크북">
  <title>탐구보고서 작성 워크북</title>
  <style>:root {
  --navy: #192238;
  --navy-2: #24314d;
  --paper: #f3efe7;
  --panel: #fffdf9;
  --ink: #172039;
  --muted: #697184;
  --line: #ddd6ca;
  --orange: #b95139;
  --orange-soft: #fff0ea;
  --gold: #e8c84e;
  --teal: #177c72;
  --shadow: 0 18px 54px rgba(24, 32, 52, .12);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(rgba(25,34,56,.028) 1px, transparent 1px),
    var(--paper);
  background-size: 100% 32px;
  font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { word-break: keep-all; text-wrap: pretty; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid #78a5ff;
  outline-offset: 3px;
}
a { color: inherit; }
[hidden] { display: none !important; }

.topbar {
  position: sticky;
  z-index: 40;
  top: 0;
  display: flex;
  align-items: center;
  gap: 20px;
  min-height: 64px;
  padding: 8px 20px;
  color: white;
  background: rgba(25,34,56,.98);
  box-shadow: 0 10px 28px rgba(14,20,35,.18);
}
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.brand-home { padding: 0; color: inherit; text-align: left; background: transparent; border: 0; cursor: pointer; }
.brand-home:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.brand-home:focus-visible { border-radius: 8px; }
.brand-badge {
  padding: 7px 10px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .12em;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 999px;
}
.brand strong { font-size: 14px; white-space: nowrap; }
.step-nav {
  display: flex;
  flex: 1;
  justify-content: flex-end;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.step-button {
  flex: 0 0 auto;
  padding: 11px 13px;
  color: #cbd3e0;
  font-size: 12px;
  font-weight: 850;
  background: transparent;
  border: 0;
  border-radius: 9px;
  white-space: nowrap;
}
.step-button:hover { color: white; background: rgba(255,255,255,.08); }
.step-button.active { color: white; background: var(--orange); }
.step-button.sample { color: var(--gold); }
.step-button.sample.active { color: var(--navy); background: var(--gold); }
.save-cluster { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.save-status { color: #cbd3e0; font-size: 10px; white-space: nowrap; }
.plain-action {
  padding: 8px 10px;
  color: white;
  font-size: 11px;
  font-weight: 800;
  background: transparent;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 8px;
}

.page-shell { width: min(1280px, calc(100% - 30px)); margin: 0 auto; padding: 48px 0 90px; }
.scroll-anchor { scroll-margin-top: 86px; }
.hero {
  position: relative;
  overflow: hidden;
  min-height: 240px;
  margin-bottom: 32px;
  padding: 50px 54px;
  color: white;
  background:
    radial-gradient(circle at 90% 10%, rgba(232,200,78,.2), transparent 28%),
    radial-gradient(circle at 8% 110%, rgba(23,124,114,.28), transparent 34%),
    var(--navy);
  border-radius: 28px;
  box-shadow: var(--shadow);
}
.hero::after {
  position: absolute;
  width: 410px;
  height: 410px;
  right: -130px;
  top: -240px;
  content: "";
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 50%;
}
.eyebrow { margin: 0 0 14px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .16em; }
.hero h1 { max-width: none; margin: 0; font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(34px, 5vw, 58px); font-weight: 600; line-height: 1.16; letter-spacing: -.05em; word-break: keep-all; text-wrap: pretty; }
.hero p:not(.eyebrow) { max-width: none; margin: 20px 0 0; color: #d2dae7; font-size: 16px; line-height: 1.85; word-break: keep-all; text-wrap: pretty; }
.hero .highlight { color: var(--gold); }

.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 38px 0 16px; }
.section-head > div { min-width: 0; width: 100%; }
.section-head h2, .section-head h3 { margin: 0; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.035em; word-break: keep-all; text-wrap: pretty; }
.section-head p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; word-break: keep-all; text-wrap: pretty; }
.topic-meta span {
  display: inline-flex;
  align-items: center;
  padding: 6px 9px;
  color: #7a5b24;
  font-size: 11px;
  font-weight: 850;
  background: #fff9da;
  border: 1px solid #eadc93;
  border-radius: 999px;
}

.choice-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.choice-button {
  min-height: 48px;
  padding: 9px 10px;
  color: var(--ink);
  font-size: 12px;
  font-weight: 900;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 3px 9px rgba(25,34,56,.035);
}
.choice-button:hover { transform: translateY(-2px); border-color: var(--orange); }
.choice-button.active { color: white; background: var(--orange); border-color: var(--orange); }
.major-row, .difficulty-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; }
.major-button, .difficulty-button {
  flex: 0 0 auto;
  padding: 10px 14px;
  color: #596478;
  font-size: 12px;
  font-weight: 850;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.major-button.active, .difficulty-button.active { color: white; background: var(--navy-2); border-color: var(--navy-2); }
.difficulty-button.easy.active { background: var(--teal); border-color: var(--teal); }
.difficulty-button.normal.active { background: #a56325; border-color: #a56325; }
.difficulty-button.challenge.active { background: var(--orange); border-color: var(--orange); }

.topic-list { display: grid; gap: 13px; }
.topic-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 22px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  box-shadow: 0 8px 22px rgba(25,34,56,.06);
}
.topic-card:hover { border-color: #d7a493; box-shadow: 0 14px 30px rgba(25,34,56,.1); }

.topic-card.expanded { row-gap: 12px; border-color: #d7a493; }
.topic-card.expanded .topic-card-actions { align-self: end; }
.topic-card-actions { display: grid; gap: 8px; justify-items: stretch; align-self: end; }
.topic-detail-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 22px;
  min-width: 190px;
  width: 100%;
  padding: 9px 10px 9px 16px;
  color: var(--ink);
  font-size: 14px;
  font-weight: 900;
  text-align: left;
  background: white;
  border: 1px solid #d9d1c4;
  border-radius: 12px;
  box-shadow: none;
}
.topic-detail-toggle:hover { color: var(--orange); border-color: #d7a493; background: #fffaf7; }
.topic-detail-toggle b {
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  color: white;
  font-size: 22px;
  line-height: 1;
  background: var(--orange);
  border-radius: 9px;
}
.method-tags { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; margin: 0; }
.method-tag {
  padding: 6px 9px;
  color: #944731;
  font-size: 11px;
  font-weight: 850;
  background: #fff3ed;
  border: 1px solid #efd0c5;
  border-radius: 999px;
}
.method-detail-panel { grid-column: 1 / -1; padding-top: 14px; border-top: 1px solid var(--line); }
.method-detail-head { margin-bottom: 11px; }
.method-detail-head h4 { margin: 0; font-size: 18px; }
.method-detail-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.method-choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.method-choice {
  position: relative;
  min-height: 180px;
  padding: 16px 16px 42px;
  color: var(--ink);
  text-align: left;
  background: #ffffff;
  border: 2px solid #ded7cc;
  border-radius: 15px;
  box-shadow: 0 5px 14px rgba(25,34,56,.06);
}
.method-choice:hover { transform: translateY(-2px); border-color: #d7a493; box-shadow: 0 9px 20px rgba(25,34,56,.1); }
.method-choice.selected { background: #fffaf7; border-color: var(--orange); box-shadow: 0 8px 18px rgba(191,75,45,.12); }
.method-kind { color: var(--orange); font-size: 11px; font-weight: 950; }
.method-choice h5 { margin: 9px 0 6px; font-size: 16px; line-height: 1.4; }
.method-choice p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.58; word-break: keep-all; }
.method-check {
  position: absolute;
  right: 16px;
  bottom: 15px;
  width: 22px;
  height: 22px;
  border: 2px solid #c8c2b7;
  border-radius: 50%;
}
.method-choice.selected .method-check { border: 7px solid var(--orange); }
.method-start-row { display: flex; align-items: center; justify-content: flex-end; gap: 14px; margin-top: 12px; }
.method-selection-message { margin-right: auto; color: #8e472f; font-size: 12px; font-weight: 800; }
.selected-method-note { margin: 7px 0 0; color: #705a2a; font-size: 12px; line-height: 1.55; }
.method-process-card { margin: 0 0 22px; padding: 22px; background: #eef8f6; border: 1px solid #c9e3de; border-radius: 18px; }
.method-process-card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.method-process-card h3 { margin: 4px 0 0; font-size: 21px; }
.method-process-card header p { margin: 8px 0 0; color: #4f6866; font-size: 13px; line-height: 1.7; }
.method-process-badge { flex: 0 0 auto; padding: 7px 10px; color: white; font-size: 11px; font-weight: 900; background: var(--teal); border-radius: 999px; }
.method-process-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px; margin: 16px 0 0; padding: 0; list-style: none; }
.method-process-steps li { padding: 12px; background: white; border: 1px solid #d7e8e5; border-radius: 11px; }
.method-process-steps b { display: block; margin-bottom: 5px; color: #1f5962; font-size: 12px; }
.method-process-steps span { color: #667573; font-size: 11px; line-height: 1.55; }
@media (max-width: 900px) {
  .method-choice-grid, .method-process-steps { grid-template-columns: 1fr; }
  .method-choice { min-height: 0; }
  .method-start-row { align-items: stretch; flex-direction: column; }
  .method-selection-message { margin-right: 0; }
  .topic-card-actions { justify-items: stretch; }
  .topic-detail-toggle { width: 100%; }
}

.topic-copy h3 { margin: 0; font-size: 18px; line-height: 1.6; word-break: keep-all; text-wrap: pretty; }
.topic-copy p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
.topic-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.topic-meta span { color: #5b6475; background: #f6f3ed; border-color: #e2dcd1; }
.custom-topic-callout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 28px;
  align-items: center;
  margin-top: 30px;
  padding: 28px 30px;
  color: white;
  background:
    radial-gradient(circle at 95% 10%, rgba(232,200,78,.18), transparent 34%),
    var(--navy);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  box-shadow: var(--shadow);
}
.custom-topic-kicker { margin: 0 0 7px; color: var(--gold); font-size: 11px; font-weight: 950; letter-spacing: .06em; }
.custom-topic-copy h2 { margin: 0; color: white; font-size: clamp(22px, 2.8vw, 30px); letter-spacing: -.035em; word-break: keep-all; text-wrap: pretty; }
.custom-topic-copy > p:not(.custom-topic-kicker) { max-width: none; margin: 10px 0 0; color: #d3dbea; font-size: 13px; line-height: 1.75; word-break: keep-all; text-wrap: pretty; }
.custom-topic-copy small { display: block; margin-top: 10px; color: #aeb9ca; font-size: 11px; line-height: 1.65; }
.custom-topic-actions { display: grid; gap: 9px; min-width: 184px; }
.external-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
.custom-topic-callout .secondary-button { color: white; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.28); }
.primary-button, .secondary-button, .download-button, .generate-button {
  padding: 12px 16px;
  color: white;
  font-size: 12px;
  font-weight: 900;
  background: var(--orange);
  border: 0;
  border-radius: 11px;
  box-shadow: 0 8px 18px rgba(185,81,57,.2);
  white-space: nowrap;
}
.secondary-button { color: var(--ink); background: white; border: 1px solid var(--line); box-shadow: none; }
.download-button { background: var(--navy); }
.generate-button { background: var(--teal); }

.selected-banner {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
  margin-bottom: 22px;
  padding: 20px 22px;
  background: #fff8e6;
  border: 1px solid #e7d49b;
  border-radius: 16px;
}
.selected-banner small { color: #936d24; font-weight: 900; }
.selected-banner strong { display: block; margin-top: 5px; font-size: 17px; line-height: 1.55; word-break: keep-all; text-wrap: pretty; }

.form-card, .content-card, .source-card, .summary-card {
  margin-top: 16px;
  padding: 24px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 9px 25px rgba(25,34,56,.055);
}
.form-card-number { display: inline; color: var(--ink); font-size: 22px; font-weight: 950; letter-spacing: -.025em; }
.form-card h3, .content-card h3, .source-card h3, .summary-card h3 { display: inline; margin: 0 0 0 6px; font-size: 22px; letter-spacing: -.025em; }
.form-card-number + h3 + .guide { margin-top: 10px; }
.source-card .form-card-number, .source-card h3 { font-size: 17px; }
.mindmap-launch .form-card-number { color: var(--gold); font-size: 23px; }
.mindmap-launch .form-card-number + h3 { display: inline; margin-left: 6px; }
.guide { margin: 9px 0 14px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.field-label { display: block; margin: 14px 0 7px; color: #404b60; font-size: 13px; font-weight: 900; }
input, textarea {
  width: 100%;
  padding: 13px 14px;
  color: var(--ink);
  background: white;
  border: 1px solid #d8d1c5;
  border-radius: 11px;
}
textarea { min-height: 118px; line-height: 1.75; resize: vertical; }
input::placeholder, textarea::placeholder { color: #9aa1ad; }
.field-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

.examples { margin: 12px 0 14px; border: 1px solid #e2d9ca; border-radius: 13px; background: #faf7f1; }
.examples summary { padding: 12px 14px; color: #8e472f; font-size: 12px; font-weight: 900; list-style: none; cursor: pointer; }
.examples summary::-webkit-details-marker { display: none; }
.examples summary::after { float: right; content: "＋"; }
.examples[open] summary::after { content: "－"; }
.example-list { display: grid; gap: 8px; padding: 0 12px 12px; }
.example-card {
  width: 100%;
  padding: 13px 14px;
  color: #465066;
  font-size: 13px;
  line-height: 1.7;
  text-align: left;
  white-space: pre-wrap;
  background: white;
  border: 1px solid #e0d8cc;
  border-radius: 10px;
}
.example-card:hover { color: var(--ink); border-color: var(--orange); background: #fffaf7; }
.example-card b { display: block; margin-bottom: 4px; color: var(--orange); font-size: 10px; }
.input-note { margin: 7px 0 0; color: #8c6a29; font-size: 11px; }

.keyword-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.keyword-chip {
  padding: 9px 11px;
  color: #245e59;
  font-size: 12px;
  font-weight: 800;
  background: #eef9f7;
  border: 1px solid #cbe5e1;
  border-radius: 999px;
}
.keyword-chip:hover { background: #dff2ef; }
.source-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.content-card + .source-grid,
.content-card + .reference-grid { margin-top: 14px; }
.source-card { margin: 0; }
.source-card h3 { font-size: 17px; }
.source-card p, .source-card li { color: var(--muted); font-size: 13px; line-height: 1.7; }
.source-links { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.source-links a { padding: 7px 9px; color: #255f59; font-size: 11px; font-weight: 850; text-decoration: none; background: #edf8f6; border-radius: 8px; }
.check-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
.check-list li { padding: 10px 12px; color: #515c70; font-size: 13px; background: #f7f4ee; border-radius: 9px; }
.check-list li::before { margin-right: 6px; color: var(--teal); content: "✓"; font-weight: 950; }
.reference-grid { display: grid; gap: 12px; }
.reference-card { padding: 18px; background: #fbf9f5; border: 1px solid #e2dbd0; border-radius: 14px; }
.reference-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 10px; }
.reference-card h4 { margin: 0; }
.reference-delete-button {
  flex: 0 0 auto;
  padding: 7px 10px;
  color: #9a4632;
  font-size: 11px;
  font-weight: 900;
  background: #fff7f3;
  border: 1px solid #e7b9aa;
  border-radius: 8px;
}
.reference-delete-button:hover { color: white; background: var(--orange); border-color: var(--orange); }
.reference-add-row { display: flex; justify-content: center; margin: 14px 0 24px; }
.reference-add-row .secondary-button { min-width: 170px; border-style: dashed; }
.reference-fields { display: grid; grid-template-columns: 1.4fr .9fr .45fr; gap: 9px; }
.clip-help { margin: 5px 0 8px; color: var(--muted); font-size: 11px; line-height: 1.7; }
.source-clip {
  min-height: 150px;
  padding: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  background: white;
  border: 1px solid #d8d1c5;
  border-radius: 11px;
  overflow-wrap: anywhere;
}
.source-clip:empty::before { color: #9aa1ad; content: attr(data-placeholder); pointer-events: none; }
.source-clip img { display: block; max-width: 100%; height: auto; margin: 12px auto; border: 1px solid #ddd6ca; border-radius: 8px; }
.photo-upload-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.photo-upload-button { cursor: pointer; }
.photo-upload-note { color: var(--muted); font-size: 11px; line-height: 1.6; }
.analysis-photo-area { margin-top: 16px; padding-top: 15px; border-top: 1px dashed #d8d1c5; }
.analysis-photo-area-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.analysis-photo-area-head b { display: block; color: #38445a; font-size: 12px; }
.analysis-photo-area-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.analysis-photo-area .photo-upload-row { margin: 0; }
.analysis-photo-area .photo-empty { margin-top: 12px; padding: 14px; }
.analysis-photo-report { margin-top: 15px; padding-top: 14px; border-top: 1px dashed #d8d1c5; }
.analysis-photo-report > b { display: block; margin-bottom: 5px; color: #38445a; font-size: 12px; }
.analysis-photo-report > p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.research-photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.research-photo-card { min-width: 0; padding: 14px; background: #fbf9f5; border: 1px solid #e2dbd0; border-radius: 13px; }
.research-photo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.research-photo-head b { font-size: 13px; }
.research-photo-card img { display: block; width: 100%; height: 240px; object-fit: contain; background: white; border: 1px solid #ded7cb; border-radius: 10px; }
.research-photo-card label { display: block; margin-top: 10px; }
.research-photo-card textarea { min-height: 82px; }
.photo-empty { padding: 24px; color: var(--muted); font-size: 12px; text-align: center; background: #faf8f3; border: 1px dashed #d8d1c5; border-radius: 11px; }
.reading-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }

  <script>const STORAGE_KEY = "isaem-inquiry-workbook-v5";
const app = document.querySelector("#app");
let saveTimer = null;
let toastTimer = null;
let resumeVisible = false;
let resumeTargetView = "topics";

function defaultState() {
  const firstCategory = TOPIC_DATA[0];
  return {
    view: "topics",
    categoryId: firstCategory.id,
    majorId: firstCategory.majors[0].id,
    difficulty: "easy",
    expandedTopicId: null,
    selectedMethods: {},
    methodIndex: null,
    topicId: null,
    customTopicMode: true,
    referenceCount: 3,
    analysisExtraCount: 0,
    analysisManualOutline: null,
    researchPhotos: [],
    summaryDraftInitialized: false,
    fields: {},
    selfOutputCustomized: false,
    selfOutputNeedsSync: false,
    savedAt: null,
  };
}

let state = defaultState();

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value).replaceAll("\n", "&#10;");
}

function cleanQuestion(value) {
  return String(value ?? "")
    .replace(/^(기본 자료 비교|연구 조건 비교|연구 한계 분석):\s*/, "")
    .trim();
}

function activeCategory() {
  return TOPIC_DATA.find((item) => item.id === state.categoryId) ?? TOPIC_DATA[0];
}

function activeMajor() {
  const category = activeCategory();
  return category.majors.find((item) => item.id === state.majorId) ?? category.majors[0];
}

function activeTopic() {
  for (const category of TOPIC_DATA) {
    for (const major of category.majors) {
      const topic = major.topics.find((item) => item.id === state.topicId);
      if (topic) {
        topic.majorLabel = major.label;
        const methodIndex = Number.isInteger(Number(state.methodIndex)) ? Number(state.methodIndex) : 0;
        const method = topic.methods?.[methodIndex] ?? topic.methods?.[0] ?? null;
        return { category, major, topic, method, methodIndex };
      }
    }
  }
  return null;
}

function selectedMethodForTopic(topic) {
  if (!topic?.methods?.length) return null;
  const selected = activeTopic();
  if (selected?.topic.id === topic.id && selected.method) return selected.method;
  const savedIndex = Number(state.selectedMethods?.[topic.id]);
  return Number.isInteger(savedIndex) && topic.methods[savedIndex]
    ? topic.methods[savedIndex]
    : topic.methods[0];
}

function methodTypeId(method) {
  const signature = `${method?.kind ?? ""} ${method?.title ?? ""}`;
  if (/데이터|공공|회귀|이미지 분석|영상 분석|규격 데이터|빈도|비율/.test(signature)) return "data";
  if (/논문|사례|자료 검색|자료 비교|자료 분석|내용 분석|텍스트|문헌|표준|규격|이론/.test(signature)) return "literature";
  if (/시뮬레이션|코딩|수학 모형|회귀 모형|모델|모형 비교/.test(signature)) return "model";
  if (/객관식|시각탐색|인식 실험|검사/.test(signature)) return "objective";
  return "experiment";
}

function methodProfile(method) {
  const type = methodTypeId(method);
  if (type === "data") return {
    type: "데이터 분석형 탐구",

function workflowSelection() {
  const selected = activeTopic();
  if (selected) return selected;
  if (!hasCustomTopicDraft()) return null;

  const title = String(state.fields["draft-topic"] ?? "").trim() || "직접 작성한 탐구 주제";
  const questionRaw = String(state.fields.final02 ?? state.fields["draft-question-hypothesis"] ?? "").trim();
  const question = questionRaw
    .split(/\n+/)
    .map((line) => line.replace(/^(핵심\s*질문|질문)\s*[:：]\s*/i, "").trim())
    .find((line) => line.includes("?") || line.includes("？"))
    || questionRaw.split(/\n+/).map((line) => line.trim()).find(Boolean)
    || title;

  const topic = {
    id: "custom-topic",
    question: title,
    coreQuestion: question,
    hypothesis: "",
    course: "관련 교과 · 핵심 개념",
    careers: "관심 분야",

function saveNow(silent = true) {
  try {
    state.savedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const label = document.querySelector("#save-status");
    if (label) label.textContent = `이 브라우저에 임시 저장됨 · ${formatTime(state.savedAt)}`;
    if (!silent) showToast("현재 기기의 브라우저에 작성 내용을 저장했습니다.");
    return true;
  } catch {
    if (!silent) showToast("브라우저 저장공간을 사용할 수 없습니다.");
    return false;
  }
}

function scheduleSave() {
  window.clearTimeout(saveTimer);
  const label = document.querySelector("#save-status");
  if (label) label.textContent = "작성 중…";
  saveTimer = window.setTimeout(() => saveNow(true), 450);
}

function formatTime(value) {
  if (!value) return "아직 저장되지 않음";
  const date = new Date(value);
  return new Intl.DateTimeFormat("ko-KR", { hour: "2-digit", minute: "2-digit" }).format(date);
}

function formatDateTime(value) {
  if (!value) return "저장 시각 없음";
  return new Intl.DateTimeFormat("ko-KR", {
    year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit",
  }).format(new Date(value));
}

function showToast(message) {
  let toast = document.querySelector("#toast");
  if (!toast) {
    toast = document.createElement("div");
    toast.id = "toast";
    toast.className = "toast";
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.hidden = false;
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => { toast.hidden = true; }, 2400);
}

function render(scrollTarget = null) {
  let content = "";
  if (state.view === "topics") content = renderTopics();
  if (state.view === "draft") content = renderDraft();
  if (state.view === "explore") content = renderExplore();
  if (state.view === "report") content = renderReport();
  if (state.view === "self") content = renderSelfEvaluation();
  if (state.view === "sample") content = renderSample();
  app.innerHTML = `${headerHTML()}${content}${resumeVisible ? resumeModal() : ""}`;
  app.querySelectorAll(".sample-summary-vertical article > b").forEach((node) => {
    node.textContent = String(node.textContent ?? "").replace(/^0(?=\d)/, "");
  });
  updateSelfCount();
  updateSelfSyncNote();
  window.requestAnimationFrame(() => {
    if (!scrollTarget) {
      window.scrollTo({ top: 0, behavior: "auto" });
      return;
    }
    window.requestAnimationFrame(() => {
      const target = document.querySelector(scrollTarget);
      if (!target) return;
      const topbarHeight = document.querySelector(".topbar")?.getBoundingClientRect().height ?? 0;
      const targetTop = window.scrollY + target.getBoundingClientRect().top - topbarHeight - 12;
      window.scrollTo({ top: Math.max(0, targetTop), behavior: "smooth" });
    });
  });
}

function topicOutline(topic) {
  const method = selectedMethodForTopic(topic);
  const type = methodTypeId(method);
  const core = cleanQuestion(topic.coreQuestion).replace(/[?？]+$/g, "");
  const concept = topic.concepts[0] ?? "핵심 개념";
  if (type === "data") return ["5-1. 데이터 출처·대상·기간과 변수", "5-2. 결측값·중복값·이상값 정제 과정", "5-3. 집단별 대표값과 그래프 분석", "5-4. 변수 사이의 관계와 가설 판단", "5-5. 데이터 범위와 인과 해석의 한계", `5-6. ${core}에 대한 종합 결론`].join("\n");
  if (type === "model") return ["5-1. 모형의 가정과 입력·출력변수", "5-2. 입력 조건별 실행 결과", "5-3. 출력값·변화량·오차 비교", "5-4. 실제 자료와 모형 결과의 일치 여부", "5-5. 모형의 적용 범위와 한계", `5-6. ${core}에 대한 종합 결론`].join("\n");
  if (type === "literature") return ["5-1. 분석에 사용한 자료의 대상·조건", `5-2. ${concept} 관련 핵심 근거 비교`, "5-3. 자료별 공통점과 차이점", "5-4. 결과가 달라진 조건과 이유", "5-5. 예상·가설 판단", `5-6. ${core}에 대한 종합 해석과 한계`].join("\n");
  if (type === "objective") return ["5-1. 과제·문항과 비교 조건", "5-2. 조건별 시행 수·정답률·반응시간", "5-3. 오류 수와 결과의 변동 폭", "5-4. 순서 효과와 개인차", "5-5. 가설 판단과 일반화의 한계", `5-6. ${core}에 대한 종합 결론`].join("\n");
  return ["5-1. 실험·제작 조건과 측정 기준", "5-2. 조건별 반복 측정 결과", "5-3. 평균·변동 폭과 그래프 비교", "5-4. 예상·가설 판단", "5-5. 오차 원인과 검증의 한계", `5-6. ${core}에 대한 종합 결론`].join("\n");
}

function sanitizeClipHTML(value) {
  const template = document.createElement("template");
  template.innerHTML = String(value ?? "");
  const allowed = new Set(["BR", "DIV", "P", "UL", "OL", "LI", "B", "STRONG", "EM", "IMG"]);
  [...template.content.querySelectorAll("*")].forEach((node) => {
    if (!allowed.has(node.tagName)) {
      node.replaceWith(document.createTextNode(node.textContent ?? ""));
      return;
    }
    [...node.attributes].forEach((attribute) => {
      if (node.tagName === "IMG" && ["src", "alt"].includes(attribute.name)) return;
      node.removeAttribute(attribute.name);
    });
    if (node.tagName === "IMG" && !String(node.getAttribute("src") ?? "").startsWith("data:image/")) node.remove();
  });
  return template.innerHTML;
}

function parseOutline() {
  const raw = String(state.fields["draft-outline"] ?? "");
  return raw.split(/\n+/).map((line) => line.trim()).filter(Boolean).slice(0, 12);
}

function reportOutline(topic) {
  if (Array.isArray(state.analysisManualOutline) && state.analysisManualOutline.length) {
    return state.analysisManualOutline
      .map((item) => String(item ?? "").trim())
      .filter(Boolean)
      .slice(0, 12);
  }

  const written = parseOutline();
  let outline;

  if (written.length) {
    outline = [...written];
  } else if (topic?.id === "custom-topic") {
    outline = ["5-1. 분석 내용 1", "5-2. 분석 내용 2", "5-3. 분석 내용 3"];
  } else {
    outline = topicOutline(topic).split("\n");
  }

  const extraCount = Math.max(0, Number(state.analysisExtraCount) || 0);
  for (let index = 0; index < extraCount; index += 1) {
    outline.push(`5-${outline.length + 1}. 새 소제목`);
  }
  return outline;
}

function renumberAnalysisTitle(title, index) {
  const value = String(title ?? "").trim();
  if (!value) return `5-${index + 1}. 분석 내용 ${index + 1}`;

  // 기존에 5-1., 5-2.처럼 번호가 붙어 있던 제목만 새 순서에 맞게 번호를 다시 매깁니다.
  if (/^\s*5\s*[-–—.]\s*\d+/i.test(value)) {
    const clean = stripAnalysisNumber(value).trim();
    return `5-${index + 1}. ${clean || `분석 내용 ${index + 1}`}`;
  }
  return value;
}

function referencesText() {
  const rows = [];
  const referenceCount = Math.max(1, Number(state.referenceCount) || 3);
  for (let index = 1; index <= referenceCount; index += 1) {
    const title = String(state.fields[`ref${index}-title`] ?? "").trim();
    if (!title) continue;
    const author = String(state.fields[`ref${index}-author`] ?? "").trim();
    const year = String(state.fields[`ref${index}-year`] ?? "").trim();
    const url = String(state.fields[`ref${index}-url`] ?? "").trim().replace(/[?&]utm_source=[^&\s]+/g, "");
    rows.push(`${author ? `${author}. ` : ""}${title}${year ? ` (${year})` : ""}${url ? `\n${url}` : ""}`);
  }
  return rows.join("\n\n");
}

function syncReportFromPrevious(force = false) {
  // 이전 버전에서 작성한 초안 내용이 남아 있는 경우에만 새 보고서 초안 항목으로 한 번 옮깁니다.
  const legacyPairs = [
    ["final01", "draft-motivation-purpose"],
    ["final02", "draft-question-hypothesis"],
    ["final04", "draft-method"],
  ];
  legacyPairs.forEach(([target, source]) => {
    const current = String(state.fields[target] ?? "");
    const next = String(state.fields[source] ?? "");
    if (!current.trim() && next.trim()) {
      state.fields[target] = next;
    }
  });
  const legacyOrganizingNotes = String(state.fields["source-organizing-notes"] ?? "").trim();
  if (legacyOrganizingNotes && !String(state.fields["analysis-content-0"] ?? "").trim()) {
    state.fields["analysis-content-0"] = legacyOrganizingNotes;
  }
  const refs = referencesText();
  const previousRefs = String(state.fields["_imported-final08"] ?? "");
  const currentRefs = String(state.fields.final08 ?? "");
  if (force || !currentRefs.trim() || currentRefs === previousRefs) {
    state.fields.final08 = refs;
    state.fields["_imported-final08"] = refs;
  }
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  outline.forEach((title, index) => {
    const target = `analysis-title-${index}`;
    const marker = `_imported-${target}`;
    const previousImport = String(state.fields[marker] ?? "");
    const current = String(state.fields[target] ?? "");
    if (force || !current.trim() || current === previousImport) {
      state.fields[target] = title;
      state.fields[marker] = title;
    }
  });
  saveNow(true);
}

function finalExamples(topic) {
  const q = cleanQuestion(topic.coreQuestion).replace(/[?？]+$/g, "");
  const concepts = topic.concepts.length ? topic.concepts : ["핵심 개념", "작동 원리"];
  const method = selectedMethodForTopic(topic);
  const profile = methodProfile(method);
  const processText = profile.steps.map(([title, detail], index) => `${index + 1}. ${title}: ${detail}`).join(" → ");
  return {
    final03: [`이론 조사 목록\n1. ${concepts[0]}의 정확한 정의와 측정 기준\n2. ${concepts[1] ?? "관련 원리"}가 결과에 영향을 주는 과정\n3. 두 개념 사이의 관계\n4. 이 원리가 ${q}에 적용되는 방식`, `교과 개념의 정의 → 작동 원리 → 선택한 ${profile.type}에서의 적용 → 결과 해석에 필요한 이유 순으로 정리한다.`],
    final04: [method?.detail ?? profile.planGuide, processText, `실제 탐구에서는 ${profile.planGuide} ${profile.resultGuide}`],
    final06: [`탐구 결과를 종합하면 ${q}에 대해 ___라고 답할 수 있다. 가장 중요한 근거는 ___이며, 예상·가설은 지지/일부 지지/지지되지 않았다.`, `결론은 이번 탐구에서 설정한 대상·조건·범위 안에서만 제시하였다. 반복 횟수, 자료 범위, 측정 오차 또는 모형의 가정 때문에 모든 상황에 일반화하기 어렵다.`, `예상과 다른 결과도 제외하지 않고 그 원인을 분석하였다. 오차와 한계를 고려하면 가설은 ___로 수정할 필요가 있다.`],
    final07: ["바꾼 조건의 범위와 반복 횟수를 늘려 같은 경향이 나타나는지 확인하고자 한다.", "이번에 같게 유지한 조건 중 하나를 새 변수로 바꾸어 결과 차이를 확인하고자 한다.", `다른 탐구 방법으로 같은 질문을 다시 확인하여 ${profile.type}에서 얻은 결론과 비교하고자 한다.`],
  };
}

function stripAnalysisNumber(value) {
  return String(value ?? "").replace(/^\s*5\s*[-–—.]\s*\d+\s*[.)·:：-]?\s*/, "");
}

function analysisExamples(topic, title) {
  const cleanTitle = stripAnalysisNumber(title);
  const method = selectedMethodForTopic(topic);
  const profile = methodProfile(method);
  return [
    `${cleanTitle}에 해당하는 조건·자료와 측정 기준을 먼저 밝힌 뒤, 직접 기록한 수치·사례·실행 결과를 표나 그래프와 함께 제시한다.`,
    `조건별 결과의 공통점과 차이점을 비교하고, 예상과 다른 결과는 반복 편차·자료 범위·측정 조건·모형의 가정을 근거로 해석한다.`,
    `이 결과는 ${cleanQuestion(topic.coreQuestion).replace(/[?？]+$/g, "")}에 관한 예상·가설을 지지/일부 지지/지지하지 않지만, ${profile.type}의 범위와 한계를 고려해야 한다.`,
  ];
}

function renderReport() {
  const selected = workflowSelection() ?? {
    custom: true,
    category: { id: "custom", label: "직접 입력" },
    major: { id: "custom", label: "직접 정한 주제" },
    topic: {
      id: "custom-topic",
      question: String(state.fields["draft-topic"] ?? "").trim() || "직접 작성한 탐구 주제",
      coreQuestion: String(state.fields["draft-question-hypothesis"] ?? "").trim() || String(state.fields["draft-topic"] ?? "").trim() || "탐구 질문",
      hypothesis: "",
      course: "관련 교과 · 핵심 개념",
      careers: "관심 분야",
      sourceHint: "학술논문·공공기관 자료·전문기관 보고서",
      levelGuide: "자료의 연구 대상·조건·측정 기준·핵심 결과를 같은 기준으로 확인합니다.",
      concepts: ["핵심 개념","탐구 조건","자료 분석"],
      keywords: [],
      comparison: ["연구 대상과 조건","측정·비교 기준","핵심 결과","자료별 차이","자료의 한계"],
      majorLabel: "직접 정한 주제",
    },
  };
  if (!state.topicId) state.customTopicMode = true;
  syncReportFromPrevious(false);

  const isCustom = Boolean(selected.custom);
  const outline = reportOutline(selected.topic);
  const examples = isCustom
    ? { final03: [], final04: [], final06: [], final07: [] }

function summarySentenceList(value) {
  const text = String(value ?? "")
    .replace(/<[^>]*>/g, " ")
    .replace(/&nbsp;/gi, " ")
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
  if (!text) return [];

  // 학생이 작성한 문장을 그대로 활용하기 위해 문장 경계만 나눈다.
  // 마침표·물음표·느낌표 뒤 또는 줄바꿈을 문장 경계로 본다.
  const protectedText = text
    .replace(/(\d)\.(\d)/g, "$1__DECIMAL__$2")
    .replace(/([A-Za-z])\.([A-Za-z])/g, "$1__DOT__$2");
  return protectedText
    .split(/(?<=[.!?。！？])\s+|\n+/)
    .map((sentence) => sentence
      .replace(/__DECIMAL__/g, ".")
      .replace(/__DOT__/g, ".")
      .replace(/\s+/g, " ")
      .trim())
    .filter((sentence) => sentence.length >= 12);
}

function summarySentenceScore(sentence, index, total, keywords = []) {
  const s = String(sentence ?? "");
  let score = 0;
  if (index === 0) score += 2.4;
  if (index === total - 1) score += 1.0;
  if (/\d|%|배|증가|감소|높|낮|차이|비교|비례|반비례|관계|경향|결과|확인|나타|영향|원인|때문|따라/.test(s)) score += 2.2;
  if (/따라서|종합|결론|판단|가설|예상|의미|해석|시사|알 수|확인할 수/.test(s)) score += 2.6;
  if (/한계|제한|어렵|부족|주의|추가|보완|후속/.test(s)) score += 1.8;
  keywords.forEach((keyword) => {
    if (keyword && s.includes(keyword)) score += 1.3;
  });
  // 지나치게 짧은 문장이나 매우 긴 문장은 핵심문장 후보에서 약간 낮춘다.
  if (s.length < 28) score -= 1.0;
  if (s.length > 220) score -= 0.8;
  return score;
}

function selectCoreSentences(value, options = {}) {
  const {
    maxChars = 220,
    maxSentences = 2,
    keywords = [],
    preferFirst = true,
    filter = null,
  } = options;
  let sentences = summarySentenceList(value);
  if (typeof filter === "function") {
    const filtered = sentences.filter(filter);
    if (filtered.length) sentences = filtered;
  }
  if (!sentences.length) return "아직 작성되지 않았습니다.";

  const ranked = sentences.map((sentence, index) => ({
    sentence,
    index,
    score: summarySentenceScore(sentence, index, sentences.length, keywords),
  }));
  if (preferFirst && ranked.length) ranked[0].score += 1.2;
  ranked.sort((a, b) => b.score - a.score || a.index - b.index);

  const selected = [];
  let used = 0;
  for (const item of ranked) {
    if (selected.length >= maxSentences) break;
    const add = item.sentence.length + (selected.length ? 1 : 0);
    if (selected.length && used + add > maxChars) continue;
    // 첫 핵심문장이 예산보다 조금 길더라도 문장 중간을 자르지 않고 그대로 둔다.
    if (!selected.length && item.sentence.length > maxChars * 1.35 && ranked.length > 1) continue;
    selected.push(item);
    used += add;
  }
  if (!selected.length) selected.push(ranked[0]);
  selected.sort((a, b) => a.index - b.index);
  return selected.map((item) => item.sentence).join(" ");
}

function analysisSummaryItems(maxChars = 520) {
  const selected = workflowSelection();
  const outline = selected ? reportOutline(selected.topic) : parseOutline();
  const candidates = [];

  outline.forEach((title, index) => {
    const actualTitle = String(state.fields[`analysis-title-${index}`] ?? title).trim();
    const content = stripAnalysisNumber(state.fields[`analysis-content-${index}`]).trim();
    if (!content) return;
    const sentences = summarySentenceList(content);
    if (!sentences.length) return;

    const titleBoost = /종합|해석|결론|가설|예상|판단|핵심 결과|결과 비교|공통점|차이점|원인/.test(actualTitle) ? 2.3
      : /적용|의미/.test(actualTitle) ? 0.8
      : /특징|자료/.test(actualTitle) ? 0.2 : 1.0;
    sentences.forEach((sentence, sentenceIndex) => {
      candidates.push({
        title: actualTitle,
        sentence,
        blockIndex: index,
        sentenceIndex,
        score: summarySentenceScore(sentence, sentenceIndex, sentences.length, ["결과", "비교", "영향", "관계", "가설", "종합"]) + titleBoost,
      });
    });
  });

  if (!candidates.length) return [];
  candidates.sort((a, b) => b.score - a.score || a.blockIndex - b.blockIndex || a.sentenceIndex - b.sentenceIndex);

  const picked = [];
  const usedBlocks = new Set();
  let usedChars = 0;

  // 먼저 서로 다른 소제목에서 핵심문장을 골라 결과 전체가 한쪽에 치우치지 않게 한다.
  for (const item of candidates) {
    if (picked.length >= 5) break;
    if (usedBlocks.has(item.blockIndex)) continue;
    const line = `${item.title} — ${item.sentence}`;
    if (picked.length && usedChars + line.length > maxChars) continue;
    picked.push(item);
    usedBlocks.add(item.blockIndex);
    usedChars += line.length;
  }

  // 분량이 남으면 가장 중요한 문장을 한두 개 보충한다.
  for (const item of candidates) {
    if (picked.length >= 6) break;
    if (picked.includes(item)) continue;
    const line = `${item.title} — ${item.sentence}`;
    if (usedChars + line.length > maxChars) continue;
    picked.push(item);
    usedChars += line.length;
  }

  picked.sort((a, b) => a.blockIndex - b.blockIndex || a.sentenceIndex - b.sentenceIndex);
  return picked.map((item) => `${item.title} — ${item.sentence}`);
}

function compactSummaryText(value, maxLength, preserveLines = false) {
  const source = String(value ?? "");
  const text = preserveLines
    ? source.split(/\r?\n/).map((line) => line.replace(/\s+/g, " ").trim()).filter(Boolean).join("\n")
    : source.replace(/\s+/g, " ").trim();
  return text || "아직 작성되지 않았습니다.";
}

function summaryCoreQuestion(topic) {
  const raw = String(state.fields.final02 || state.fields["draft-question-hypothesis"] || "").trim();
  const labeled = raw.match(/(?:핵심 질문|연구문제)\s*[:：]?\s*([^\n]+?)(?=\n|예상|가설|$)/);
  if (labeled?.[1]) return labeled[1].trim();
  const question = raw.match(/[^.!。\n]*[?？]/)?.[0]?.trim();
  return question || cleanQuestion(topic.coreQuestion);
}

function summaryLimitText() {
  const growth = String(state.fields["self-growth"] ?? "").trim();
  if (growth) {
    return selectCoreSentences(growth, {
      maxChars: 230,
      maxSentences: 2,
      keywords: ["한계", "배운", "알게", "보완", "추가"],
    });
  }

  // 자기평가서의 '배운 점'을 아직 쓰지 않았다면 보고서의 결론·한계에서
  // 실제 한계에 해당하는 문장만 골라 사용한다. 한계 문장이 없으면 억지로
  // 결론 문장을 반복하지 않는다.
  const conclusionSentences = summarySentenceList(state.fields.final06);
  const limitSentences = conclusionSentences.filter((sentence) =>
    /한계|제한|어렵|부족|일반화|추가|보완|주의|적어|적었|한정|범위|대상|오차|자료 수/.test(sentence)
  );
  if (!limitSentences.length) return "아직 작성되지 않았습니다.";
  return selectCoreSentences(limitSentences.join("\n"), {
    maxChars: 220,
    maxSentences: 2,
    keywords: ["한계", "제한", "어렵", "부족", "일반화", "추가", "보완", "오차"],
  });
}

function buildAutoSummarySnapshot() {
  const selected = workflowSelection();
  if (!selected) return null;
  const topic = selected.topic;

  // 요약 본문은 약 1,300~1,500자 안팎을 목표로 한다.
  // 글자 수를 기계적으로 자르지 않고 각 영역에서 완전한 핵심문장을 선택한다.
  const motivation = selectCoreSentences(state.fields.final01 || state.fields["draft-motivation-purpose"], {
    maxChars: 230,
    maxSentences: 2,
    keywords: ["궁금", "목적", "알아보", "비교", "확인"],
  });
  const method = selectCoreSentences(state.fields.final04 || state.fields["draft-method"], {
    maxChars: 290,
    maxSentences: 3,
    keywords: ["자료", "비교", "분석", "기준", "방법", "측정", "실험"],
  });
  const results = analysisSummaryItems(520);
  const conclusion = selectCoreSentences(state.fields.final06, {
    maxChars: 260,
    maxSentences: 2,
    keywords: ["결론", "따라서", "종합", "가설", "예상", "판단", "확인"],
  });
  const limits = summaryLimitText();

  return {
    topic: compactSummaryText(state.fields["draft-topic"] || cleanQuestion(topic.question), 110),
    subtitle: `${selected.category.label} · ${selected.major.label}`,
    type: methodProfile(selected.method ?? selectedMethodForTopic(topic)).type,
    question: compactSummaryText(summaryCoreQuestion(topic), 145),
    sections: [
      ["1 · 탐구 동기 및 목적", motivation],
      ["2 · 탐구 방법", method],
      ["3 · 주요 결과", results],
      ["4 · 결론", conclusion],
      ["5 · 한계 및 배운 점", limits],
    ],
  };
}

const SUMMARY_DRAFT_FIELDS = [
  "summary-draft-motivation",
  "summary-draft-method",
  "summary-draft-results",
  "summary-draft-conclusion",
  "summary-draft-limits",
];

function summaryValueToText(value) {
  if (Array.isArray(value)) return value.join("\n");
  return String(value ?? "");
}

function initializeSummaryDraft(force = false) {
  const auto = buildAutoSummarySnapshot();
  if (!auto) return null;

  const hasExistingDraft = SUMMARY_DRAFT_FIELDS.some((key) =>
    Object.prototype.hasOwnProperty.call(state.fields, key)
  );

  if (!force && (state.summaryDraftInitialized || hasExistingDraft)) {
    state.summaryDraftInitialized = true;
    return auto;
  }

  auto.sections.forEach(([, value], index) => {
    state.fields[SUMMARY_DRAFT_FIELDS[index]] = summaryValueToText(value);
  });
  state.summaryDraftInitialized = true;
  scheduleSave();
  return auto;
}

function summarySnapshot() {
  const auto = buildAutoSummarySnapshot();
  if (!auto) return null;

  initializeSummaryDraft(false);

  const titles = auto.sections.map(([title]) => title);
  return {
    ...auto,
    sections: titles.map((title, index) => [
      title,
      String(state.fields[SUMMARY_DRAFT_FIELDS[index]] ?? "").trim() || "아직 작성되지 않았습니다.",
    ]),
  };
}

function selfEvaluationItems(selected) {
  const topic = selected.topic;
  const method = selected.method ?? selectedMethodForTopic(topic);
  const profile = methodProfile(method);
  const q = cleanQuestion(topic.coreQuestion).replace(/[?？]+$/g, "");
  const concepts = topic.concepts?.length ? topic.concepts : ["핵심 개념"];

function hasKoreanBatchim(value) {
  const cleaned = String(value ?? "").trim().replace(/[\s.!?,'\"”’)}\]]+$/g, "");
  const last = [...cleaned].at(-1);
  if (!last) return false;
  const code = last.charCodeAt(0);
  if (code >= 0xac00 && code <= 0xd7a3) return (code - 0xac00) % 28 !== 0;
  if (/\d/.test(last)) return new Set(["0", "1", "3", "6", "7", "8"]).has(last);
  return false;
}

function hasRieulBatchim(value) {
  const cleaned = String(value ?? "").trim().replace(/[\s.!?,'\"”’)}\]]+$/g, "");
  const last = [...cleaned].at(-1);
  if (!last) return false;
  const code = last.charCodeAt(0);
  return code >= 0xac00 && code <= 0xd7a3 && (code - 0xac00) % 28 === 8;
}

function resolveLeadingJosa(value, suffix) {
  const batchim = hasKoreanBatchim(value);
  const text = String(suffix);
  if (text.startsWith("으로") || text.startsWith("로")) {
    const particle = !batchim || hasRieulBatchim(value) ? "로" : "으로";
    return `${particle}${text.slice(text.startsWith("으로") ? 2 : 1)}`;
  }
  const pairs = [
    ["을", "를"],
    ["이", "가"],
    ["은", "는"],
    ["과", "와"],
  ];
  for (const [withBatchim, withoutBatchim] of pairs) {
    if (text.startsWith(withBatchim) || text.startsWith(withoutBatchim)) {
      return `${batchim ? withBatchim : withoutBatchim}${text.slice(1)}`;
    }
  }
  return suffix;
}

function withJosa(value, suffix) {
  return `${value}${resolveLeadingJosa(value, suffix)}`;
}

function updateGuidedJosa(id, value) {
  const suffix = document.querySelector(`[data-josa-for="${CSS.escape(id)}"]`);
  if (!suffix) return;
  suffix.textContent = resolveLeadingJosa(value, suffix.dataset.josaTemplate ?? "");
}

function guidedSelfRow(number, id, title, examples, prefix, suffix) {
  const value = state.fields[id] ?? "";
  const resolvedSuffix = resolveLeadingJosa(value, suffix);
  return `<article class="guided-self-row">
    <h4><span>${String(number)}</span>${escapeHTML(title)}</h4>
    <div class="guided-example-list">${examples.map((text,index) => `<button type="button" class="guided-example-button" data-example-target="${id}" data-example="${escapeAttr(encodeURIComponent(text))}"><b>예시 ${index + 1}</b>${escapeHTML(text)}</button>`).join("")}</div>
    <label class="guided-sentence"><span>${escapeHTML(prefix)}</span><textarea rows="2" aria-label="${escapeAttr(title)} 입력" data-field="${id}" placeholder="예시를 누르거나 짧은 말로 직접 입력">${escapeHTML(value)}</textarea><span data-josa-for="${escapeAttr(id)}" data-josa-template="${escapeAttr(suffix)}">${escapeHTML(resolvedSuffix)}</span></label>
  </article>`;
}

function composeSelfEvaluation() {
  const selected = workflowSelection();
  if (!selected) return "";

  const filled = selfEvaluationItems(selected)
    .map((item) => ({ ...item, value: String(state.fields[item.id] ?? "").trim() }))
    .filter((item) => item.value);

  return filled.map((item, index) => {
    const prefix = index > 0 ? (item.linkedPrefix ?? item.prefix ?? "") : (item.prefix ?? "");
    return `${prefix ? `${prefix} ` : ""}${item.value}${resolveLeadingJosa(item.value, item.suffix)}`;
  }).join(" ");
}

function updateSelfSyncNote() {

}

function syncSelfOutputFromParts(force = false) {
  if (state.selfOutputCustomized && !force) {
    state.selfOutputNeedsSync = true;
    updateSelfSyncNote();
    return false;
  }
  state.fields["self-output"] = composeSelfEvaluation();
  state.selfOutputCustomized = false;
  state.selfOutputNeedsSync = false;
  const output = document.querySelector('[data-field="self-output"]');
  if (output) output.value = state.fields["self-output"];
  updateSelfCount();
  updateSelfSyncNote();
  return true;
}

        <h3>5. 예상 목차</h3><ol><li>두통과 진통제 선택의 필요성</li><li>아세트아미노펜과 이부프로펜의 특징</li><li>두 성분의 작용 원리 비교</li><li>긴장형 두통 완화 효과 비교</li><li>부작용과 복용 시 주의사항 비교</li><li>개인의 상태에 따른 선택 기준</li><li>결론 및 탐구의 한계</li></ol>
        <h3>6. 예상 결과와 기대 효과</h3><blockquote>한 성분이 모든 사람에게 항상 더 적합하다는 결론보다 두통 유형, 개인 질환, 함께 복용하는 약과 부작용 위험에 따라 기준이 달라진다는 결과가 나올 것으로 예상한다.</blockquote>
      </div></details>

      <details class="sample-section" id="sample-report"><summary>04. 완성 보고서 예시</summary><div class="sample-body">
        <h3>01. 탐구 동기 및 배경</h3><blockquote>두통약은 쉽게 구할 수 있지만 같은 두통약이라도 주성분과 주의사항이 다르다. 특히 아세트아미노펜과 이부프로펜은 모두 통증 완화에 사용되지만 작용 원리와 안전성에 차이가 있다. 따라서 제품 이름이 아닌 성분과 연구 근거를 바탕으로 두 성분의 선택 기준을 알아보고자 하였다.</blockquote>
        <h3>02. 연구문제와 가설</h3><blockquote>핵심 연구문제는 두 성분이 작용 원리, 긴장형 두통 완화 효과, 안전성에서 어떤 차이를 보이는지 확인하는 것이다. 이부프로펜은 일부 조건에서 빠른 효과를 보일 수 있지만 NSAID 관련 주의사항이 많고, 아세트아미노펜은 위장 관련 부담은 상대적으로 적지만 과다·중복복용에 따른 간 손상 위험이 중요한 기준이 될 것으로 예상하였다.</blockquote>
        <h3>03. 이론적 배경</h3><p>이부프로펜은 비스테로이드성 소염진통제(NSAID)로 사이클로옥시게나제와 프로스타글란딘 생성 과정을 억제하여 진통·해열·항염 작용을 나타낸다. 아세트아미노펜도 진통과 해열에 사용되지만 항염 효과는 상대적으로 약하며 정확한 작용기전에는 아직 완전히 밝혀지지 않은 부분이 있다. 따라서 두 성분은 모두 통증을 줄이지만 약리작용과 안전성에서 차이가 나타날 수 있다.</p>
        <h3>04. 자료 수집 기준 및 탐구 방법</h3><p>성인의 급성 긴장형 두통을 대상으로 한 체계적 문헌고찰과 무작위 대조 임상시험을 우선 선정하였다. 안전성은 FDA와 NHS 등 공공기관 자료를 활용하였다. 자료마다 연구 대상, 두통 유형, 약물과 제형, 측정시간, 통증 소실률, 부작용, 연구의 한계를 같은 표에 기록하였다. 서로 다른 연구의 수치를 단순 순위로 비교하지 않고 위약 대비 추가 효과와 연구 조건을 함께 해석하였다.</p>
        <h3>05. 분석 결과 및 해석</h3>
        <h4>5-1. 두통과 진통제 선택의 필요성</h4><p>두통은 원인과 유형이 다양하며 조사 자료의 주요 대상인 긴장형 두통과 편두통도 구분해야 한다. 따라서 ‘두통’이라는 증상만으로 한 성분을 일괄 선택하는 것은 적절하지 않다. 이번 탐구에서는 비교 범위를 성인의 급성 긴장형 두통으로 좁히고, 효과뿐 아니라 복용자의 상태와 안전성까지 선택 기준에 포함하였다.</p>
        <h4>5-2. 아세트아미노펜과 이부프로펜의 특징</h4><p>두 성분 모두 진통·해열 목적으로 사용되지만 이부프로펜은 NSAID에 속해 항염 작용을 함께 나타내고, 아세트아미노펜의 항염 효과는 상대적으로 약하다. 즉 같은 ‘두통약’으로 판매되더라도 약의 분류와 주의해야 할 신체 기관이 같지 않았다. 제품명보다 주성분과 다른 복합 성분의 포함 여부를 확인해야 하는 이유가 여기에 있다.</p>
        <h4>5-3. 두 성분의 작용 원리 비교</h4><p>이부프로펜은 프로스타글란딘 생성에 관여하는 효소 경로를 억제해 통증·열·염증 반응을 줄인다. 아세트아미노펜은 중추에서 진통과 해열 효과를 나타내는 것으로 알려져 있으나 정확한 기전에는 아직 설명되지 않은 부분이 있다. 작용 원리가 다르다는 사실만으로 실제 두통 완화 효과의 우열을 확정할 수는 없으므로 임상 결과를 따로 확인하였다.</p>
        <h4>5-4. 긴장형 두통 완화 효과 비교</h4><p>아세트아미노펜에 관한 Cochrane 고찰은 23개 연구 8,079명을 포함했고, 2시간 뒤 통증이 사라진 사람은 약물군 100명 중 24명, 위약군 19명이었다. 이부프로펜 고찰은 12개 연구 3,094명을 포함했으며 약물군 23명, 위약군 16명이 2시간 뒤 통증 소실을 보였다. 따라서 위약보다 추가로 효과를 얻은 사람은 각각 약 5명과 7명 수준이었다. 그러나 두 수치는 서로 다른 연구 집단과 조건에서 산출되었기 때문에 24%와 23%만 비교하여 아세트아미노펜이 더 낫다고 말할 수 없다. 성인 154명의 직접 비교 연구에서는 특정 액상형 이부프로펜이 아세트아미노펜보다 통증 완화를 더 빨리 시작했지만, 작은 표본과 특정 제형에 한정된 결과이므로 모든 제품과 사람에게 일반화하기 어렵다.</p>
        <h4>5-5. 부작용과 복용 시 주의사항 비교</h4><p>FDA 자료에서는 아세트아미노펜을 권장량보다 많이 복용하거나 동일 성분이 포함된 여러 제품을 함께 복용할 때 심각한 간 손상이 발생할 수 있다고 안내한다. 이부프로펜과 같은 NSAID는 위장 출혈·궤양, 신장 문제, 심혈관계 위험 등을 확인해야 하며 기존 질환과 병용약에 따라 주의가 필요하다. 그러므로 ‘아세트아미노펜은 안전하고 이부프로펜은 위험하다’는 식의 단순 구분은 근거에 맞지 않았다.</p>
        <h4>5-6. 개인의 상태에 따른 선택 기준</h4><p>선택 전에는 두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약, 같은 성분의 중복 여부를 확인해야 한다. 위장·신장 관련 위험이 있는 사람과 간 손상 위험이 있는 사람에게 필요한 판단 기준은 서로 다르다. 따라서 실제 선택과 용량은 제품 설명서를 확인하고 청소년은 보호자·약사·의료전문가와 상의해야 한다.</p>
        <h4>5-7. 결론으로 이어지는 해석과 탐구의 한계</h4><p>‘이부프로펜은 일부 조건에서 더 빠를 수 있다’는 예상은 특정 직접 비교 연구에서는 지지되었다. 반면 아세트아미노펜이 항상 더 안전할 것이라는 예상은 간 손상과 중복복용 위험 때문에 수정해야 했다. 조사한 핵심 연구가 성인을 대상으로 했고 서로 다른 연구의 결과를 간접 비교했으며, 두통 유형과 제형도 제한되어 있다는 점이 최종 결론의 범위를 제한한다.</p>
        <h3>06. 결론 및 한계</h3><blockquote>두 성분 모두 성인의 급성 긴장형 두통 완화에 도움이 될 수 있지만 한 성분이 모든 사람에게 항상 더 적합하다고 결론 내리기는 어려웠다. 두통의 유형, 연령, 기존 질환, 복용 중인 약, 각 성분의 부작용 위험과 제품 설명서를 함께 고려해야 한다. 또한 주요 연구가 성인을 대상으로 했고 서로 다른 연구 조건을 간접 비교했으므로 결과를 청소년에게 그대로 적용할 수 없다는 한계가 있다.</blockquote>
        <h3>07. 후속 탐구 계획</h3><blockquote>후속 탐구에서는 긴장형 두통과 편두통을 구분하여 두 성분의 효과를 비교하고, 정제와 액상형 연질캡슐 등 제형 차이가 약효가 나타나는 시간에 미치는 영향을 조사하고자 한다. 청소년을 대상으로 한 연구가 충분한지도 추가로 확인할 필요가 있다.</blockquote>
        <h3>08. 참고자료 및 출처</h3><ol><li><a href="https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6557" target="_blank" rel="noopener">질병관리청 국가건강정보포털－편두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011889_oral-paracetamol-treatment-acute-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－아세트아미노펜과 급성 긴장형 두통</a></li><li><a href="https://www.cochrane.org/evidence/CD011474_oral-ibuprofen-acute-treatment-episodic-tension-type-headache-adults" target="_blank" rel="noopener">Cochrane－이부프로펜과 급성 긴장형 두통</a></li><li><a href="https://www.fda.gov/drugs/safe-use-over-counter-pain-relievers-and-fever-reducers/acetaminophen" target="_blank" rel="noopener">FDA－아세트아미노펜 안전정보</a></li><li><a href="https://www.nhs.uk/medicines/nsaids/" target="_blank" rel="noopener">NHS－NSAID 안전정보</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/10940094/" target="_blank" rel="noopener">PubMed－두 성분 직접 비교 임상시험</a></li></ol>
      </div></details>

      <details class="sample-section" id="sample-self"><summary>05. 자기평가서 예시</summary><div class="sample-body">
        <h3>항목별 작성</h3><p><b>탐구 계기:</b> 두통약마다 성분과 주의사항이 다른 이유가 궁금하여 탐구를 시작하였다.</p><p><b>탐구 질문:</b> 두 성분은 효과와 안전성에서 어떤 차이를 보이며 무엇을 고려해야 하는지 확인하였다.</p><p><b>탐구 과정:</b> 체계적 문헌고찰·임상시험·공공기관 자료를 찾아 연구 대상과 조건을 확인하고 같은 기준으로 비교하였다.</p><p><b>탐구 결과:</b> 두 성분 모두 도움이 될 수 있지만 효과와 위험 조건이 달라 하나를 항상 우수하다고 판단할 수 없었다.</p><p><b>성장과 성찰:</b> 수치뿐 아니라 연구 대상·측정방법·한계를 함께 해석하고 예상과 다른 근거도 검토하는 능력이 향상되었다.</p>
        <h3>완성된 자기평가서</h3><blockquote>두통약마다 성분과 주의사항이 다른 이유가 궁금하여 아세트아미노펜과 이부프로펜의 효과와 안전성을 비교하였다. 체계적 문헌고찰과 임상시험, 공공기관 자료에서 연구 대상과 조건을 확인하고 동일한 기준으로 결과를 정리하였다. 두 성분 모두 긴장형 두통 완화에 도움이 될 수 있지만 효과와 위험 조건이 달라 하나를 항상 우수하다고 판단할 수 없었다. 이 과정에서 수치뿐 아니라 연구 조건과 한계를 함께 해석하고 예상과 다른 근거도 검토하는 능력이 향상되었다.</blockquote>

function sampleResearchMaterialHTML() {

    `두통약은 일반 진통제, 비스테로이드성 소염진통제(NSAID), 복합진통제, 편두통 전용 치료제 등으로 나눌 수 있다. 흔히 비교되는 성분은 아세트아미노펜과 이부프로펜이다. 제품명보다 포장지의 유효성분을 확인해야 하며, 같은 성분도 일반정·서방정·연질캡슐·액상형에 따라 함량과 방출 특성이 다를 수 있다.`,
    `아세트아미노펜은 해열·진통제이며 통증과 발열을 줄이지만 말초 조직의 소염 작용은 크지 않다. 정확한 진통 작용기전은 완전히 밝혀지지 않았고, 뇌와 중추신경계의 통증 전달 및 체온 조절 과정에 주로 영향을 주는 것으로 설명된다. 분자식은 C₈H₉NO₂, 몰질량은 약 151.16 g/mol, pKa는 약 9.38이며 물에 대한 용해성 자료는 조건에 따라 약 1~5 mg/mL로 제시된다. 주로 간에서 대사된 뒤 소변으로 배설되고 반감기는 대체로 2~3시간이다.`,
    `이부프로펜은 NSAID로 통증·발열뿐 아니라 염증도 줄인다. COX 계열 효소를 억제해 프로스타글란딘 생성을 감소시키는 것이 핵심이다. 프로스타글란딘은 통증과 염증에 관여하지만 위 점막 보호와 신장 혈류 유지에도 관여하므로 같은 작용이 효과와 부작용을 함께 설명한다. 분자식은 C₁₃H₁₈O₂, 몰질량은 약 206.28 g/mol, pKa는 약 4.9이며 물에 대한 용해성은 약 0.1 mg/mL 미만으로 제시된다.`,
    `같은 mg이라도 몰질량이 다르면 분자 수가 다르다. 몰수는 질량을 몰질량으로 나누어 계산한다. 아세트아미노펜 500 mg은 약 3.31 mmol, 1,000 mg은 약 6.62 mmol이고 이부프로펜 200 mg은 약 0.97 mmol, 400 mg은 약 1.94 mmol이다. 그러나 분자 수가 많다고 약효가 더 강하다고 말할 수는 없다. 효소와 결합하는 능력, 흡수율, 대사, 두통 유형과 연구에서 사용한 용량이 모두 다르기 때문이다.`,
    `성인의 빈발성 긴장형 두통을 분석한 Cochrane 자료에서는 복용 2시간 뒤 통증이 완전히 사라진 비율이 이부프로펜 400 mg군 23%, 위약군 16%로 보고되었다. 아세트아미노펜 1,000 mg군은 24%, 위약군은 19%였다. 그러나 두 수치는 서로 다른 연구 집단과 위약군에서 나온 결과이므로 23%와 24%만 직접 비교해 우열을 결정하면 안 된다. 두 약을 직접 비교한 연구가 적었고 일부 4시간 결과는 이부프로펜에 유리했지만 근거 수준은 충분하지 않았다.`,

      ["비교 기준과 연구자세",["연령, 용량, 제형, 용법이 같은지 확인","평가 시간과 결과 측정 기준을 함께 확인","조건이 다르면 직접 비교하지 않기"]],
      ["해석의 주의점",["한 연구 결과를 모든 상황에 일반화하지 않기","여러 근거를 함께 보고 종합적으로 해석"]],
      ["직접 실험 시 주의",["인체 복용 실험보다 문헌·자료 분석이 안전함","응급 신호가 있는 경우에는 약 비교보다 진료가 우선"]],
    ]},
  ];
  const wrapMapLabel = (value, limit) => {
    const text = String(value);
    const rows = [];
    let current = "";
    text.split(/\s+/).forEach((word) => {
      if (!word) return;
      if (current && `${current} ${word}`.length <= limit) {
        current += ` ${word}`;
        return;
      }
      if (current) {
        rows.push(current);
        current = "";
      }
      if (word.length <= limit) {
        current = word;
        return;
      }
      let rest = word;
      while (rest.length > limit) {
        rows.push(rest.slice(0, limit));
        rest = rest.slice(limit);
      }
      current = rest;
    });
    if (current) rows.push(current);
    return rows.length ? rows : [text];
  };
  const svgText = (rows, x, centerY, className, lineHeight = 14, anchor = "start") => {
    const firstY = centerY - ((rows.length - 1) * lineHeight) / 2 + 4;
    return rows.map((row, index) => `<text class="${className}" text-anchor="${anchor}" x="${x}" y="${firstY + index * lineHeight}">${escapeHTML(row)}</text>`).join("");
  };

  let cursorY = 34;
  const branchLayouts = branches.map((branch, branchIndex) => {
    const groupLayouts = branch.groups.map(([title, items]) => {
      const leafLayouts = items.map((item) => {
        const rows = wrapMapLabel(item, 24);
        const height = Math.max(26, rows.length * 14 + 12);
        const layout = { text: item, rows, top: cursorY, height, center: cursorY + height / 2 };
        cursorY += height + 8;
        return layout;
      });
      cursorY -= 8;
      const rows = wrapMapLabel(title, 9);
      const height = Math.max(34, rows.length * 14 + 12);
      const center = (leafLayouts[0].center + leafLayouts.at(-1).center) / 2;
      const layout = { title, rows, height, center, leaves: leafLayouts };
      cursorY += 28;
      return layout;
    });
    cursorY -= 28;
    const titleRows = wrapMapLabel(branch.title, 11);
    const height = Math.max(50, titleRows.length * 16 + 18);
    const center = (groupLayouts[0].center + groupLayouts.at(-1).center) / 2;
    const layout = { ...branch, branchIndex, titleRows, height, center, groups: groupLayouts };
    cursorY += 48;
    return layout;
  });
  cursorY -= 48;

  const firstBranchY = branchLayouts[0].center;
  const lastBranchY = branchLayouts.at(-1).center;
  const rootCenterY = (firstBranchY + lastBranchY) / 2;
  const totalHeight = Math.ceil(Math.max(cursorY + 34, rootCenterY + 68));
  const connectors = [`<path class="mapr-line-teal" d="M 228 ${rootCenterY} H 248"></path>`,`<line class="mapr-trunk" x1="248" x2="248" y1="${firstBranchY}" y2="${lastBranchY}"></line>`];
  const nodes = [];

  branchLayouts.forEach((branch) => {
    const color = branch.branchIndex % 2 === 0 ? "teal" : "purple";
    const mainTop = branch.center - branch.height / 2;
    connectors.push(`<path class="mapr-line-${color}" d="M 248 ${branch.center} H 268"></path>`);
    connectors.push(`<path class="mapr-line-${color}" d="M 473 ${branch.center} H 488 V ${branch.groups[0].center} V ${branch.groups.at(-1).center}"></path>`);
    nodes.push(`<rect class="mapr-main-${color}" height="${branch.height}" rx="10" width="205" x="268" y="${mainTop}"></rect>`);
    nodes.push(`<circle cx="289" cy="${mainTop + 18}" fill="#ffffff28" r="12"></circle>`);
    nodes.push(`<text class="mapr-main-text" text-anchor="middle" x="289" y="${mainTop + 22}">${branch.no}</text>`);
    nodes.push(svgText(branch.titleRows, 310, branch.center, "mapr-main-text", 16));

    branch.groups.forEach((group) => {
      const subTop = group.center - group.height / 2;
      connectors.push(`<path class="mapr-line-${color}" d="M 488 ${group.center} H 503"></path>`);
      connectors.push(`<path class="mapr-line-${color}" d="M 643 ${group.center} H 653 V ${group.leaves[0].center} V ${group.leaves.at(-1).center}"></path>`);
      nodes.push(`<rect class="mapr-sub-${color}" height="${group.height}" rx="7" width="140" x="503" y="${subTop}"></rect>`);
      nodes.push(svgText(group.rows, 513, group.center, "mapr-sub-text"));
      group.leaves.forEach((leaf) => {
        connectors.push(`<path class="mapr-line-${color}" d="M 653 ${leaf.center} H 668"></path>`);
        nodes.push(`<rect class="mapr-leaf" height="${leaf.height}" rx="6" width="310" x="668" y="${leaf.top}"></rect>`);
        nodes.push(svgText(leaf.rows, 678, leaf.center, "mapr-leaf-text"));
      });
    });
  });

  const rootTop = rootCenterY - 49;
  const root = `<rect class="mapr-root" height="98" rx="10" width="210" x="18" y="${rootTop}"></rect>${svgText(["두통약 주요 성분","(아세트아미노펜·","이부프로펜)","비교 분석"],32,rootCenterY,"mapr-root-text",18)}`;
  const map = `<div aria-label="두통약 주요 성분 비교 분석 마인드맵" class="rebuild-map-wrap" role="region" tabindex="0"><div class="rebuild-map-board"><svg aria-label="두통약 주요 성분 비교 분석 마인드맵" role="img" viewBox="0 0 1000 ${totalHeight}" xmlns="http://www.w3.org/2000/svg"><rect fill="#fbfcfd" height="${totalHeight}" width="1000"></rect>${connectors.join("")}${root}${nodes.join("")}</svg></div></div>`;
  return `<section class="embedded-example visible-embedded-example mindmap-example"><div class="embedded-example-title">복사해 모은 자료를 구조화한 마인드맵 전체</div>${map}<div class="mindmap-principles"><span>문장이 아닌 핵심어로 작성</span><span>사실과 해석 구분</span><span>두 성분을 같은 기준으로 비교</span><span>한계도 하나의 가지로 표시</span></div></section>`;
}

      <details class="sample-section" id="sample-final"><summary>4. 보고서 완성 예시</summary><div class="sample-body">
        <p>1~4번은 보고서 초안의 내용을 보완하고, 5번은 탐구활동에서 작성한 소제목과 분석 내용을 그대로 불러와 근거·출처·문장 흐름·한계를 최종 점검하였다.</p>
        <h3>1. 탐구 동기 및 배경</h3><blockquote>두통약은 쉽게 구할 수 있지만 같은 두통약이라도 주성분과 주의사항이 다르다. 특히 아세트아미노펜과 이부프로펜은 모두 통증 완화에 사용되지만 작용 원리와 안전성에 차이가 있다. 따라서 제품 이름이 아닌 성분과 연구 근거를 바탕으로 두 성분의 선택 기준을 알아보고자 하였다.</blockquote>
        <h3>2. 연구문제와 가설</h3><blockquote>핵심 연구문제는 두 성분이 작용 원리, 긴장형 두통 완화 효과, 안전성에서 어떤 차이를 보이는지 확인하는 것이다. 이부프로펜은 일부 조건에서 빠른 효과를 보일 수 있지만 NSAID 관련 주의사항이 많고, 아세트아미노펜은 위장 부담은 상대적으로 적지만 과다·중복복용에 따른 간 손상 위험이 중요한 기준이 될 것으로 예상하였다.</blockquote>
        <h3>3. 이론적 배경</h3><p>먼저 긴장형 두통과 편두통의 차이, 진통·해열·소염의 의미, COX와 프로스타글란딘의 역할, 약물의 제형·붕해·흡수·최고혈중농도 도달 시간의 차이를 조사하였다. 이부프로펜은 NSAID로 COX 경로를 억제하여 진통·해열·항염 작용을 나타낸다. 아세트아미노펜은 진통과 해열에 사용되지만 항염 효과는 상대적으로 약하며 정확한 작용기전에는 아직 완전히 밝혀지지 않은 부분이 있다. 이러한 개념은 효과 수치뿐 아니라 성분별 부작용이 나타나는 이유를 해석하는 데 필요하다.</p>
        <h3>4. 자료 수집 기준 및 탐구 방법</h3><p>성인의 급성 긴장형 두통을 대상으로 한 체계적 문헌고찰 2개와 두 성분을 직접 비교한 임상시험 1개를 효과 자료로 선정하였다. 안전성은 FDA와 NHS 자료를 사용하였다. 각 원문에서 대상·두통 유형·용량·제형·측정시간·통증 소실률·부작용·한계를 확인하고, 보고서 초안의 소제목에 따라 핵심 근거·공통점·차이점·해석·한계를 직접 정리하였다. 서로 다른 연구의 수치는 위약 대비 추가 효과와 연구 조건을 함께 보며 해석하였다.</p>
        <h3>5. 분석 결과 및 해석</h3>
        <h4>5-1. 분석에 사용한 자료의 특징</h4><p>아세트아미노펜 고찰에는 23개 연구 8,079명, 이부프로펜 고찰에는 12개 연구 3,094명이 포함되었다. 두 자료는 모두 성인의 급성 긴장형 두통을 다뤘지만 참여자와 연구 조건이 같지 않았다. 직접 비교 연구는 성인 154명과 특정 액상형 제형을 대상으로 하여 적용 범위가 더 좁았다.</p>
        <h4>5-2. 긴장형 두통 완화 효과 비교</h4><p>2시간 통증 소실은 아세트아미노펜군 100명 중 24명과 위약군 19명, 이부프로펜군 23명과 위약군 16명이었다. 위약보다 추가로 효과를 얻은 사람은 각각 약 5명과 7명 수준이었다. 그러나 서로 다른 연구에서 나온 24%와 23%를 그대로 비교하여 한 성분의 우열을 결정할 수는 없었다.</p>
        <h4>5-3. 효과가 나타나는 시간 비교</h4><p>직접 비교 연구에서는 특정 액상형 이부프로펜이 아세트아미노펜보다 통증 완화를 더 빨리 시작한 결과가 보고되었다. 다만 표본이 작고 특정 제형에 한정되어 일반 정제와 다른 연령대까지 같은 결과로 일반화하기 어렵다. 또한 붕해가 빠른 것, 혈중농도가 빨리 높아지는 것, 통증이 빨리 사라지는 것은 같은 측정값이 아니다.</p>
        <h4>5-4. 부작용과 복용 시 주의사항 비교</h4><p>아세트아미노펜은 권장량을 초과하거나 같은 성분이 든 여러 제품을 함께 복용할 때 간 손상 위험을 확인해야 한다. 이부프로펜과 같은 NSAID는 위장 출혈·궤양, 신장 기능, 심혈관계 위험과 다른 NSAID의 중복 여부를 확인해야 한다. 한 성분은 안전하고 다른 성분은 위험하다고 단순화할 수 없었다.</p>
        <h4>5-5. 개인의 상태에 따른 선택 기준</h4><p>두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약, 동일 성분의 중복 여부를 확인해야 한다. 따라서 효과 순위보다 개인에게 더 큰 위험이 무엇인지 먼저 판단하는 것이 중요하며, 청소년의 실제 선택과 용량은 보호자·약사·의료전문가와 상의해야 한다.</p>
        <h4>5-6. 가설 판단</h4><p>이부프로펜이 일부 조건에서 효과가 더 빨리 나타날 수 있다는 예상은 특정 직접 비교 연구에서 부분적으로 지지되었다. 그러나 아세트아미노펜이 항상 더 안전하다는 예상은 간 손상과 중복복용 위험 때문에 그대로 받아들일 수 없었다.</p>
        <h4>5-7. 종합 해석</h4><p>두 성분 모두 성인의 급성 긴장형 두통 완화에 도움이 될 수 있지만 어느 하나가 모든 사람에게 항상 더 적합하다고 결론 내릴 수 없었다. 성분 선택은 두통 유형, 개인의 질환과 병용약, 제형, 성분별 위험을 함께 고려하는 조건부 판단이었다. 성인 중심 연구와 간접 비교라는 한계 때문에 청소년에게 결과를 그대로 적용해서는 안 된다.</p>
        <h3>6. 결론 및 한계</h3><blockquote>한 성분의 무조건적인 우열보다 개인의 위험 조건과 제품 성분을 함께 확인해야 한다. 주요 자료가 성인 중심이고 서로 다른 연구 조건을 간접 비교했다는 점이 한계이다.</blockquote>
        <h3>7. 후속 탐구 계획</h3><blockquote>긴장형 두통과 편두통을 구분하고, 정제·액상형 등 제형에 따른 효과 시간과 청소년 대상 연구를 추가로 조사하고자 한다.</blockquote>

      <details class="sample-section" id="sample-self-new"><summary>5. 자기평가서 작성 예시</summary><div class="sample-body">
        <div class="sample-summary-preview"><header><h3>탐구내용 요약정리</h3></header><div class="sample-summary-content"><div class="sample-summary-topic"><b>탐구 주제</b><p>두통이 있을 때 아세트아미노펜과 이부프로펜 중 어떤 성분을 선택해야 할까?</p><small>의약·보건계열 · 의약품 비교 탐구</small></div><div class="sample-summary-meta"><span><b>탐구 유형</b> 논문·자료 조사 및 비교 분석</span><span><b>핵심 질문</b> 두 성분의 선택 기준은 어떤 조건에서 달라지는가?</span></div><div class="sample-summary-vertical"><article><b>1. 탐구 동기 및 목적</b><p>두통약 포장지를 살펴보며 같은 용도의 제품도 아세트아미노펜과 이부프로펜처럼 유효성분과 주의사항이 다르다는 점에 관심을 가졌다. 제품명이나 막연한 인상이 아니라 작용 원리·두통 완화 효과·안전성에 관한 연구 근거를 비교하여, 개인의 상태에 따른 선택 기준을 알아보고자 하였다.</p></article><article><b>2. 탐구 방법</b><p>성인의 급성 긴장형 두통을 다룬 Cochrane 체계적 문헌고찰 2편과 두 성분을 직접 비교한 임상시험, FDA·NHS의 안전정보를 중심 자료로 선정하였다. 각 자료에서 연구 대상, 약물 용량과 제형, 효과 측정 시간, 통증 소실률, 부작용과 연구 한계를 추출하였다. 수집한 내용은 보고서 소제목별로 나누고 공통점·차이점·해석·한계를 직접 정리하였다.</p></article><article><b>3. 주요 결과</b><p>아세트아미노펜 1,000mg과 이부프로펜 400mg은 모두 위약보다 긴장형 두통을 완화한 사람이 많았지만, 서로 다른 연구의 24%와 23%를 그대로 비교해 우열을 판단할 수는 없었다. 일부 직접 비교 연구에서는 특정 액상형 이부프로펜의 효과가 더 빨리 나타났으나 성인 154명과 특정 제형을 대상으로 했다는 제한이 있었다. 안전성에서는 아세트아미노펜의 과다·중복 복용에 따른 간 손상 위험과 이부프로펜의 위장·신장·심혈관계 위험을 각각 확인해야 했다.</p></article><article><b>4. 결론</b><p>두 성분 중 하나가 모든 두통과 모든 사람에게 항상 더 적합하다고 결론 내릴 수 없었다. 두통 유형과 반복 빈도, 연령, 간·위장·신장·심혈관 질환, 복용 중인 약과 동일 성분의 중복 여부를 함께 확인해야 한다. 따라서 효과 순위보다 개인에게 더 큰 위험이 무엇인지 먼저 판단하는 조건부 선택이 필요하다고 정리하였다.</p></article><article><b>5. 한계 및 배운 점</b><p>주요 근거가 성인을 대상으로 한 연구였기 때문에 결과를 청소년에게 그대로 적용하기 어렵고, 서로 다른 연구의 수치를 간접 비교했다는 한계가 있었다. 또한 효과가 나타나는 시간과 2시간 후 통증 소실률은 같은 지표가 아니므로 구분해서 해석해야 했다. 이번 탐구를 통해 연구 결과는 수치만 보는 것이 아니라 대상·용량·제형·측정 시간·적용 범위를 함께 확인해야 한다는 점을 배웠다.</p></article></div></div></div>

function safeFileName(value) {
  return String(value ?? "").trim().replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, "_");
}

function wordText(value) {
  return escapeHTML(value ?? "").replace(/\r?\n/g, "<br>");
}

// Word에서 <br>을 강제 줄바꿈으로 해석하면 양쪽 맞춤 문단의 낱말 간격이
// 과도하게 벌어진다. 보고서 본문은 줄마다 일반 문단으로 변환해 자연스럽게 배치한다.
function wordParagraphs(value) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  if (!lines.some((line) => line.trim())) return "<p>&nbsp;</p>";
  return lines
    .map((line) => line.trim() ? `<p>${escapeHTML(line.trim())}</p>` : '<p class="blank-line">&nbsp;</p>')
    .join("");
}

function docxXmlText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function normalizeReportMath(value) {
  let text = String(value ?? "");

  // 자주 사용되는 LaTeX 명령을 일반 문서에서 읽을 수 있는 기호로 변환한다.
  const symbols = {
    "\\rho": "ρ", "\\theta": "θ", "\\alpha": "α", "\\beta": "β",
    "\\gamma": "γ", "\\delta": "δ", "\\Delta": "Δ", "\\lambda": "λ",
    "\\mu": "μ", "\\pi": "π", "\\sigma": "σ", "\\omega": "ω",
    "\\Omega": "Ω", "\\times": "×", "\\cdot": "·", "\\pm": "±",
    "\\leq": "≤", "\\le": "≤", "\\geq": "≥", "\\ge": "≥",
    "\\neq": "≠", "\\approx": "≈", "\\rightarrow": "→", "\\to": "→",
    "\\infty": "∞"
  };
  Object.entries(symbols).forEach(([from, to]) => { text = text.split(from).join(to); });

  // \text{drop} -> drop
  text = text.replace(/\\text\s*\{([^{}]*)\}/g, "$1");

  // 단순 분수는 L/A와 같이 읽기 쉬운 꼴로 바꾼다.
  // 중첩되지 않은 \frac{...}{...}를 여러 번 처리한다.
  for (let i = 0; i < 4; i += 1) {
    const next = text.replace(/\\frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, "$1/$2");
    if (next === text) break;
    text = next;
  }

  // 아래첨자/위첨자 중 숫자는 유니코드로 바꾸고, 문자 첨자는 붙여서 표시한다.
  const subMap = { "0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉","+":"₊","-":"₋" };
  const supMap = { "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":"⁺","-":"⁻" };
  text = text.replace(/_\{([0-9+\-]+)\}/g, (_, s) => [...s].map((ch) => subMap[ch] || ch).join(""));
  text = text.replace(/_([0-9])/g, (_, s) => subMap[s] || s);
  text = text.replace(/\^\{([0-9+\-]+)\}/g, (_, s) => [...s].map((ch) => supMap[ch] || ch).join(""));
  text = text.replace(/\^([0-9])/g, (_, s) => supMap[s] || s);
  text = text.replace(/_\{([^{}]+)\}/g, "$1");
  text = text.replace(/_([A-Za-z가-힣]+)/g, "$1");

  // 수식 구분 기호와 남은 불필요한 LaTeX 기호를 정리한다.
  text = text
    .replace(/\\left|\\right/g, "")
    .replace(/\\\[|\\\]|\$\$/g, "")
    .replace(/\$/g, "")
    .replace(/\\,/g, " ")
    .replace(/\\;/g, " ")
    .replace(/\\!/g, "")
    .replace(/\s*=\s*/g, " = ")
    .replace(/\s*([≤≥≈≠×±])\s*/g, " $1 ")
    .replace(/[ \t]{2,}/g, " ")
    .trim();

  return text;
}

function dataUrlBytes(dataUrl) {
  const match = String(dataUrl ?? "").match(/^data:([^;,]+)(;base64)?,([\s\S]*)$/i);
  if (!match) throw new Error("지원하지 않는 사진 데이터입니다.");
  const mime = match[1].toLowerCase();
  if (match[2]) {
    const binary = atob(match[3]);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
    return { mime, bytes };
  }
  return { mime, bytes: new TextEncoder().encode(decodeURIComponent(match[3])) };
}

function loadExportImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("사진 크기를 확인하지 못했습니다."));
    image.src = src;
  });
}

function fittedExportSize(width, height, maxWidth, maxHeight) {
  const safeWidth = Math.max(1, Number(width) || 1);
  const safeHeight = Math.max(1, Number(height) || 1);
  const scale = Math.min(1, maxWidth / safeWidth, maxHeight / safeHeight);
  return {
    width: Math.max(1, Math.round(safeWidth * scale)),
    height: Math.max(1, Math.round(safeHeight * scale)),
  };
}

async function prepareExportPhotoAssets() {
  const photos = researchPhotoItems();
  const assets = [];

  for (const photo of photos) {
    const image = await loadExportImage(photo.src);
    let exportSrc = photo.src;
    let parsed = dataUrlBytes(exportSrc);

    // Word와 한글에서 안정적으로 열리는 JPEG·PNG만 사용합니다.
    // 그 밖의 형식은 첫 화면을 PNG로 변환해 사진이 빠지지 않게 합니다.
    if (!["image/jpeg", "image/png"].includes(parsed.mime)) {
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, image.naturalWidth || image.width || 1);
      canvas.height = Math.max(1, image.naturalHeight || image.height || 1);
      const context = canvas.getContext("2d");
      if (!context) throw new Error("사진을 문서용 이미지로 변환하지 못했습니다.");
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      exportSrc = canvas.toDataURL("image/png");
      parsed = dataUrlBytes(exportSrc);
    }

    const assetIndex = assets.length + 1;
    const extension = parsed.mime === "image/png" ? "png" : "jpg";
    const widthPx = Math.max(1, image.naturalWidth || image.width || 1);
    const heightPx = Math.max(1, image.naturalHeight || image.height || 1);
    const docxSize = fittedExportSize(widthPx * 9525, heightPx * 9525, 5000000, 5700000);
    const hwpxSize = fittedExportSize(widthPx * 75, heightPx * 75, 40000, 52000);

    assets.push({
      ...photo,
      assetIndex,
      mime: parsed.mime,
      extension,
      bytes: parsed.bytes,
      docxRelId: `rIdImage${assetIndex}`,
      docxFileName: `image${assetIndex}.${extension}`,
      docxDocPrId: 1000 + assetIndex,
      docxWidth: docxSize.width,
      docxHeight: docxSize.height,
      hwpxId: `image${assetIndex}`,
      hwpxFileName: `image${assetIndex}.${extension}`,
      hwpxWidth: hwpxSize.width,
      hwpxHeight: hwpxSize.height,
    });
  }

  return assets;
}

function docxRun(text, options = {}) {
  const props = [];
  props.push('<w:rFonts w:ascii="Malgun Gothic" w:hAnsi="Malgun Gothic" w:eastAsia="맑은 고딕"/>');
  if (options.bold) props.push('<w:b/>');
  if (options.color) props.push(`<w:color w:val="${options.color}"/>`);
  if (options.size) props.push(`<w:sz w:val="${options.size}"/><w:szCs w:val="${options.size}"/>`);
  const sourceText = options.normalizeMath ? normalizeReportMath(text) : String(text ?? "");
  const value = docxXmlText(sourceText || " ");
  return `<w:r><w:rPr>${props.join("")}</w:rPr><w:t xml:space="preserve">${value}</w:t></w:r>`;
}

function docxParagraph(text, options = {}) {
  const pPr = [];
  if (options.align) pPr.push(`<w:jc w:val="${options.align}"/>`);
  if (options.keepNext) pPr.push('<w:keepNext/>');
  if (options.pageBreakBefore) pPr.push('<w:pageBreakBefore/>');
  if (options.spacingBefore || options.spacingAfter || options.line) {
    pPr.push(`<w:spacing w:before="${options.spacingBefore || 0}" w:after="${options.spacingAfter || 0}" w:line="${options.line || 360}" w:lineRule="auto"/>`);
  }
  if (options.leftIndent || options.hanging) {
    pPr.push(`<w:ind w:left="${options.leftIndent || options.hanging || 0}"${options.hanging ? ` w:hanging="${options.hanging}"` : ""}/>`);
  }
  if (options.borderBottom) {
    pPr.push(`<w:pBdr><w:bottom w:val="single" w:sz="${options.borderSize || 10}" w:space="5" w:color="${options.borderColor || "192238"}"/></w:pBdr>`);
  }
  return `<w:p><w:pPr>${pPr.join("")}</w:pPr>${docxRun(text, options)}</w:p>`;
}

function docxBodyParagraphs(value, options = {}) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  const paragraphOptions = {
    size: 21,
    line: 340,
    spacingAfter: 90,
    align: "both",
    normalizeMath: options.normalizeMath !== false,
    ...options
  };
  if (!lines.some((line) => line.trim())) {
    return docxParagraph(" ", paragraphOptions);
  }
  return lines.map((line) =>
    docxParagraph(line.trim() || " ", paragraphOptions)
  ).join("");
}

  const description = docxXmlText(asset.caption || `탐구 사진 ${asset.assetIndex}`);
  const fileName = docxXmlText(asset.docxFileName);
  return `<w:p>
    <w:pPr><w:jc w:val="center"/><w:spacing w:before="100" w:after="80"/></w:pPr>
    <w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">
      <wp:extent cx="${asset.docxWidth}" cy="${asset.docxHeight}"/>
      <wp:effectExtent l="0" t="0" r="0" b="0"/>
      <wp:docPr id="${asset.docxDocPrId}" name="탐구 사진 ${asset.assetIndex}" descr="${description}"/>
      <wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>
      <a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">
        <pic:pic>
          <pic:nvPicPr><pic:cNvPr id="${asset.docxDocPrId}" name="${fileName}"/><pic:cNvPicPr/></pic:nvPicPr>
          <pic:blipFill><a:blip r:embed="${asset.docxRelId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
          <pic:spPr>
            <a:xfrm><a:off x="0" y="0"/><a:ext cx="${asset.docxWidth}" cy="${asset.docxHeight}"/></a:xfrm>
            <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
          </pic:spPr>
        </pic:pic>
      </a:graphicData></a:graphic>
    </wp:inline></w:drawing></w:r>
  </w:p>`;
}

function docxPhotoBlockXml(asset, number) {
  const caption = String(asset.caption ?? "").trim();
  const source = String(asset.source ?? "").trim();
  return [
    docxImageParagraph(asset),

      align: "center", bold: true, color: "38465C", size: 19,

    }),

      align: "center", color: "687386", size: 18,
      line: 280, spacingAfter: 120, normalizeMath: false
    }) : ""
  ].join("");
}

function docxSummaryCell(text, options = {}) {
  const width = options.width || 1500;
  const span = options.span ? `<w:gridSpan w:val="${options.span}"/>` : "";
  const shade = options.shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${options.shade}"/>` : "";
  const tcPr = `<w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${span}${shade}<w:vAlign w:val="center"/></w:tcPr>`;
  const paragraph = docxParagraph(text, {
    bold: options.bold,
    color: options.color || "4E596D",
    size: options.size || 20,
    spacingAfter: 0,
    line: options.line || 320,
    normalizeMath: true
  });
  return `<w:tc>${tcPr}${paragraph}</w:tc>`;
}

function docxCrc32(bytes) {
  if (!docxCrc32.table) {
    docxCrc32.table = Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let k = 0; k < 8; k += 1) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      return c >>> 0;
    });
  }
  let crc = 0xFFFFFFFF;
  for (const byte of bytes) crc = docxCrc32.table[(crc ^ byte) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function docxLe16(value) {
  return Uint8Array.of(value & 0xFF, (value >>> 8) & 0xFF);
}

function docxLe32(value) {
  return Uint8Array.of(value & 0xFF, (value >>> 8) & 0xFF, (value >>> 16) & 0xFF, (value >>> 24) & 0xFF);
}

function docxConcat(parts) {
  const total = parts.reduce((sum, part) => sum + part.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const part of parts) { out.set(part, offset); offset += part.length; }
  return out;
}

function docxZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let localOffset = 0;
  const now = new Date();
  const year = Math.max(1980, now.getFullYear());
  const dosTime = ((now.getHours() & 31) << 11) | ((now.getMinutes() & 63) << 5) | ((Math.floor(now.getSeconds() / 2)) & 31);
  const dosDate = (((year - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);

  for (const [name, content] of Object.entries(files)) {
    const nameBytes = encoder.encode(name);
    const data = content instanceof Uint8Array
      ? content
      : content instanceof ArrayBuffer
        ? new Uint8Array(content)
        : encoder.encode(String(content));
    const crc = docxCrc32(data);
    const localHeader = docxConcat([
      docxLe32(0x04034B50), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), nameBytes,
    ]);
    localParts.push(localHeader, data);

    const centralHeader = docxConcat([
      docxLe32(0x02014B50), docxLe16(20), docxLe16(20), docxLe16(0x0800), docxLe16(0), docxLe16(dosTime), docxLe16(dosDate),
      docxLe32(crc), docxLe32(data.length), docxLe32(data.length), docxLe16(nameBytes.length), docxLe16(0), docxLe16(0),
      docxLe16(0), docxLe16(0), docxLe32(0), docxLe32(localOffset), nameBytes,
    ]);
    centralParts.push(centralHeader);
    localOffset += localHeader.length + data.length;
  }

  const central = docxConcat(centralParts);
  const local = docxConcat(localParts);
  const count = Object.keys(files).length;
  const end = docxConcat([
    docxLe32(0x06054B50), docxLe16(0), docxLe16(0), docxLe16(count), docxLe16(count),
    docxLe32(central.length), docxLe32(local.length), docxLe16(0),
  ]);
  return new Blob([local, central, end], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function hwpxXmlText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

let hwpxParagraphSequence = 1000000000;

function hwpxParagraphXml(value, options = {}) {
  const charPr = options.charPr ?? 0;
  const paraPr = options.paraPr ?? 0;
  const pageBreak = options.pageBreak ? 1 : 0;
  const normalized = options.normalizeMath === false ? String(value ?? "") : normalizeReportMath(value);
  const textValue = normalized || " ";
  const id = hwpxParagraphSequence++;
  return `<hp:p id="${id}" paraPrIDRef="${paraPr}" styleIDRef="0" pageBreak="${pageBreak}" columnBreak="0" merged="0">
    <hp:run charPrIDRef="${charPr}"><hp:t>${hwpxXmlText(textValue)}</hp:t></hp:run>
  </hp:p>`;
}

function hwpxBodyXml(value, options = {}) {
  const lines = String(value ?? "").replace(/\r\n/g, "\n").split("\n");
  if (!lines.some((line) => line.trim())) return hwpxParagraphXml(" ", options);

  const firstParaPr = options.firstParaPr;
  const baseOptions = { ...options };
  delete baseOptions.firstParaPr;

  return lines.map((line, index) =>
    hwpxParagraphXml(line.trim() || " ", {
      ...baseOptions,
      ...(index === 0 && firstParaPr !== undefined ? { paraPr: firstParaPr } : {}),
    })
  ).join("");
}
