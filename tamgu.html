<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="과학전람회와 과학발명품경진대회 작품설명서를 항목별로 작성하고 한글(HWPX) 파일로 내려받는 학생용 작성 도구">
<title>과학전람회 · 과학발명품경진대회 작품설명서</title>
<style>
/* ── 디자인 토큰: 탐구보고서 워크북(tamgu) 페이지와 동일 ───────────────── */
:root{
  --navy:#192238;
  --navy-2:#24314d;
  --paper:#f3efe7;
  --panel:#fffdf9;
  --ink:#172039;
  --muted:#697184;
  --line:#ddd6ca;
  --orange:#b95139;
  --orange-soft:#fff0ea;
  --gold:#e8c84e;
  --teal:#177c72;
  --shadow:0 18px 54px rgba(24,32,52,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--paper)}
body{
  min-height:100vh;
  margin:0;
  overflow-x:hidden;
  overflow-y:auto;
  margin:0;
  color:var(--ink);
  /* 종이 위 괘선 느낌의 배경 */
  background:linear-gradient(rgba(25,34,56,.028) 1px,transparent 1px),var(--paper);
  background-size:100% 32px;
  font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{word-break:keep-all;text-wrap:pretty}
button{font:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #78a5ff;outline-offset:3px}

/* ── 상단바 ───────────────────────────────────────────────────────────── */
.topbar{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  flex:0 0 auto;
  align-items:center;
  gap:20px;
  min-height:64px;
  padding:8px 20px;
  color:#fff;
  background:rgba(25,34,56,.98);
  box-shadow:0 10px 28px rgba(14,20,35,.18);
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-badge{
  padding:7px 10px;
  color:var(--gold);
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
  border:1px solid rgba(255,255,255,.45);
  border-radius:999px;
  white-space:nowrap;
}
.brand strong{font-size:14px;white-space:nowrap}

/* 메뉴: 번호 없이 이름만. 선택된 항목의 주황 배경은 글자 크기에 맞춰 최소 여백만 준다. */
.step-nav{display:flex;flex:1;justify-content:flex-end;gap:4px;min-width:0}
.step-button{
  display:inline-flex;
  align-items:center;
  flex:0 0 auto;
  padding:11px 13px;
  color:#cbd3e0;
  font-size:12px;
  font-weight:850;
  line-height:1;
  background:transparent;
  border:0;
  border-radius:9px;
  white-space:nowrap;
}
.step-button:hover{color:#fff;background:rgba(255,255,255,.08)}
.step-button.active{color:#fff;background:var(--orange)}

/* GPT 바로가기: 다른 메뉴와 같은 모양이고, 누르면 주황색으로 바뀐다 */
.step-link{
  display:inline-flex;
  align-items:center;
  flex:0 0 auto;
  padding:11px 13px;
  color:#cbd3e0;
  font-size:12px;
  font-weight:850;
  line-height:1;
  text-decoration:none;
  background:transparent;
  border:0;
  border-radius:9px;
  white-space:nowrap;
}
/* 다른 메뉴와 같게: 마우스를 올리면 옅은 강조, 누를 때 주황색 */
.step-link:hover{color:#fff;background:rgba(255,255,255,.08)}
.step-link:focus-visible,
.step-link:active{color:#fff;background:var(--orange)}

.save-cluster{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.save-status{
  display:inline-block;
  width:104px;
  color:#cbd3e0;
  font-size:10px;
  text-align:right;
  white-space:nowrap;
}
.code-indicator{
  max-width:180px;
  padding:5px 8px;
  overflow:hidden;
  color:#f6df9a;
  font-size:10px;
  font-weight:850;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
}
.plain-action{
  padding:8px 10px;
  color:#fff;
  font-size:11px;
  font-weight:800;
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  border-radius:8px;
}
.plain-action:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.55)}
.plain-action:disabled{opacity:.5;cursor:not-allowed}

/* ── 본문 ─────────────────────────────────────────────────────────────── */
.page-shell{
  width:min(1280px,calc(100% - 30px));
  margin:0 auto;
  padding:16px 0 40px;
}

/* 큰 제목: 일반 본문 흐름에 두어 스크롤하면 위로 사라진다 */
.hero{
  position:relative;
  overflow:hidden;
  flex:0 0 auto;
  margin-bottom:14px;
  padding:26px 40px;
  color:#fff;
  background:
    radial-gradient(circle at 90% 10%,rgba(232,200,78,.2),transparent 28%),
    radial-gradient(circle at 8% 110%,rgba(23,124,114,.28),transparent 34%),
    var(--navy);
  border-radius:28px;
  box-shadow:var(--shadow);
}
.hero::after{
  position:absolute;
  top:-300px;
  right:-130px;
  width:410px;
  height:410px;
  content:"";
  border:1px solid rgba(255,255,255,.13);
  border-radius:50%;
}
.eyebrow{position:relative;z-index:1;margin:0 0 9px;color:var(--gold);font-size:11px;font-weight:950;letter-spacing:.16em}
.hero h1{
  position:relative;
  z-index:1;
  margin:0;
  font-family:Georgia,"Noto Serif KR",serif;
  font-size:clamp(26px,3.2vw,42px);
  font-weight:600;
  line-height:1.14;
  letter-spacing:-.05em;
}
.hero h1 .highlight{color:var(--gold)}
.frame-shell{
  display:grid;
  grid-template-columns:224px minmax(0,1fr);
  align-items:start;
  gap:24px;
  width:100%;
  overflow:visible;
  background:transparent;
}
.outer-section-sidebar{
  position:sticky;
  top:84px;
  z-index:30;
  display:flex;
  flex-direction:column;
  gap:3px;
  margin:0;
  padding:14px;
  background:rgba(255,253,249,.98);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 14px 34px rgba(24,32,52,.08);
}
.outer-section-sidebar button{
  display:block;
  width:100%;
  padding:12px;
  color:#5f6879;
  font-size:13px;
  font-weight:800;
  line-height:1.5;
  text-align:left;
  background:transparent;
  border:0;
  border-radius:9px;
  word-break:keep-all;
}
.outer-section-sidebar button:hover,
.outer-section-sidebar button:focus-visible{color:var(--ink);background:#f3efe7}
.report-frame{
  display:block;
  width:100%;
  height:1200px;
  border:0;
  overflow:hidden;
  background:transparent;
}

/* 안내 메시지(토스트) */
.toast{
  position:fixed;
  bottom:26px;
  left:50%;
  z-index:999;
  padding:10px 20px;
  color:#fff;
  font-size:13px;
  background:#1c1c1c;
  border-radius:22px;
  opacity:0;
  transform:translateX(-50%) translateY(16px);
  transition:all .3s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--orange)}

/* ── 반응형 ───────────────────────────────────────────────────────────── */
@media(max-width:1080px){
  .topbar{align-items:flex-start;flex-wrap:wrap;gap:8px}
  .step-nav{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .save-cluster{margin-left:auto}
}
@media(max-width:900px){
  .frame-shell{grid-template-columns:1fr;gap:10px}
  .outer-section-sidebar{
    top:112px;
    flex-direction:row;
    overflow-x:auto;
    padding:8px;
    white-space:nowrap;
  }
  .outer-section-sidebar button{width:auto;flex:0 0 auto;padding:9px 10px;font-size:11px}
}
@media(max-width:720px){
  .page-shell{width:min(100% - 16px,1280px);padding:10px 0 0}
  .hero{margin-bottom:10px;padding:16px 20px;border-radius:18px}
  .hero h1{font-size:24px}
  .eyebrow{margin:0 0 6px;font-size:10px}
}
@media(max-width:430px){
  .topbar{padding:7px 10px}
  .brand-badge{display:none}
  .save-status{display:none}
  .code-indicator{max-width:118px;padding:4px 6px;font-size:9px}
  .plain-action{padding:7px 8px;font-size:10px}
  .hero{padding:14px 16px;border-radius:16px}
  .hero h1{font-size:21px}
  .step-button{padding:9px 10px;font-size:11px}
  .step-link{padding:9px 10px;font-size:11px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-badge">SCIENCE LAB</span>
    <strong id="brandTitle">과학전람회</strong>
  </div>

  <nav class="step-nav" id="stepNav" aria-label="작품설명서 종류 선택"></nav>

  <div class="save-cluster">
    <span class="save-status" id="saveStatus">저장 전</span>
    <span class="code-indicator" id="codeIndicator">저장코드: 미설정</span>
    <button type="button" class="plain-action" data-report-action onclick="sendReportCommand('save')">저장</button>
    <button type="button" class="plain-action" data-report-action onclick="sendReportCommand('open')">열기</button>
    <button type="button" class="plain-action" data-report-action onclick="sendReportCommand('new')">새로 시작</button>
  </div>
</header>

<main class="page-shell">
  <section class="hero" id="hero">
    <p class="eyebrow" id="heroEyebrow">SCIENCE FAIR REPORT</p>
    <h1 id="heroTitle">과학전람회</h1>
  </section>

  <div class="frame-shell">
    <nav class="outer-section-sidebar" id="outerSectionSidebar" aria-label="작품설명서 항목">
      <button type="button" data-section-target="section-basic">기본 정보</button>
      <button type="button" data-section-target="section-one">Ⅰ. 탐구(연구) 동기 및 목적</button>
      <button type="button" data-section-target="section-two">Ⅱ. 탐구(연구) 방법</button>
      <button type="button" data-section-target="section-three">Ⅲ. 탐구(연구) 결과</button>
      <button type="button" data-section-target="section-four">Ⅳ. 기대효과</button>
      <button type="button" data-section-target="section-five">Ⅴ. 유사작품 검색 및 차별성</button>
    </nav>
    <iframe class="report-frame" id="reportFrame" title="과학전람회 작품설명서" loading="eager" scrolling="no"
      sandbox="allow-scripts allow-forms allow-modals allow-downloads allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation"></iframe>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  }
];

// 주소창의 tab 값으로 첫 화면을 결정한다(없으면 과학전람회).
const requestedTab = new URLSearchParams(window.location.search).get('tab');
let currentKey = TABS.some(tab => tab.key === requestedTab) ? requestedTab : 'fair';

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
  }[char]));
}

function activeTab() {
  return TABS.find(tab => tab.key === currentKey) || TABS[0];
}

// 상단 메뉴를 그린다. 선택된 버튼에만 주황 배경이 들어간다.
function renderMenu() {
  const nav = document.getElementById('stepNav');
  nav.innerHTML = TABS.map(tab => `
    <button type="button" class="step-button ${tab.key === currentKey ? 'active' : ''}"
      data-tab="${tab.key}" aria-pressed="${tab.key === currentKey}">${escapeHtml(tab.label)}</button>
    <a class="step-link" href="${tab.gpt.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(tab.gpt.label)}</a>
  `).join('');

  nav.querySelectorAll('button[data-tab]').forEach(button => {
    button.addEventListener('click', () => selectTab(button.dataset.tab));
  });
}

// 큰 제목(남색 카드) 내용을 현재 메뉴에 맞춰 바꾼다.
function renderHero() {
  const tab = activeTab();
  document.getElementById('heroEyebrow').textContent = tab.eyebrow;
  document.getElementById('brandTitle').textContent = tab.title;
  document.getElementById('heroTitle').innerHTML = `${escapeHtml(tab.title)} <span class="highlight">작품설명서</span>`;
  document.title = `${tab.title} 작품설명서`;
  document.getElementById('reportFrame').title = `${tab.title} 작품설명서`;
}

// iframe 내부 목차를 바깥 페이지의 고정 목차와 동기화한다.
function syncOuterSectionSidebar() {
  const frame = document.getElementById('reportFrame');
  const outer = document.getElementById('outerSectionSidebar');
  const doc = frame?.contentDocument;
  if (!frame || !outer || !doc) return;

  const links = [...doc.querySelectorAll('.section-sidebar a[href^="#"]')];
  if (!links.length) return;

  outer.innerHTML = links.map(link => {
    const target = link.getAttribute('href')?.slice(1) || '';
    return `<button type="button" data-section-target="${escapeHtml(target)}">${escapeHtml(link.textContent.trim())}</button>`;
  }).join('');
}

function scrollToInnerSection(sectionId) {
  const frame = document.getElementById('reportFrame');
  const target = frame?.contentDocument?.getElementById(sectionId);
  if (!frame || !target) return;

  const topbarHeight = document.querySelector('.topbar')?.offsetHeight || 0;
  const frameTop = frame.getBoundingClientRect().top + window.scrollY;
  const targetTop = target.getBoundingClientRect().top;
  window.scrollTo({
    top: Math.max(0, frameTop + targetTop - topbarHeight - 12),
    behavior: 'smooth'
  });
}

// 작품설명서 앱을 iframe 안에 다시 심는다.
// (내장 앱이 부모 주소창의 tab 값을 읽어 종류를 판단하므로 주소를 먼저 바꾼 뒤 호출한다.)
function mountFrame() {
  const frame = document.getElementById('reportFrame');
  const bytes = Uint8Array.from(atob(REPORT_SOURCE_BASE64), character => character.charCodeAt(0));
  frame.addEventListener('load', () => {
    syncOuterSectionSidebar();
    setTimeout(syncOuterSectionSidebar, 120);
  }, { once: true });
  frame.srcdoc = new TextDecoder('utf-8').decode(bytes);
}

function selectTab(key, options = {}) {
  if (!TABS.some(tab => tab.key === key)) return;
  if (key === currentKey && !options.force) return;
  currentKey = key;

  const url = new URL(window.location.href);
  url.searchParams.set('tab', currentKey);
  window.history.replaceState(null, '', url);

  renderMenu();
  renderHero();
  mountFrame();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 상단바의 저장/열기/새로 시작 버튼을 iframe 안쪽 앱으로 전달한다.
function sendReportCommand(command) {
  const frame = document.getElementById('reportFrame');
  if (!frame?.contentWindow) {
    showToast('작품설명서를 불러오는 중입니다. 잠시 후 다시 시도하세요', true);
    return;
  }
  frame.contentWindow.postMessage({ type: 'science-work-description-command', command }, '*');
}

let toastTimer = null;
function showToast(message, isError = false) {
  const toast = document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent = String(message || '');
  toast.className = `toast show${isError ? ' error' : ''}`;
  toastTimer = setTimeout(() => { toast.className = 'toast'; }, 2800);
}

function setHeaderState({ status, code, busy } = {}) {
  if (status) document.getElementById('saveStatus').textContent = status;
  if (code) document.getElementById('codeIndicator').textContent = code;
  document.querySelectorAll('[data-report-action]').forEach(button => { button.disabled = Boolean(busy); });
}

// iframe 안쪽 앱이 보내오는 높이·저장상태·안내 메시지를 받아 처리한다.
window.addEventListener('message', event => {
  const frame = document.getElementById('reportFrame');
  if (!frame || event.source !== frame.contentWindow || !event.data) return;

  if (event.data.type === 'science-work-description-height') {
    const height = Math.max(600, Number(event.data.height) || 0);
    frame.style.height = `${height}px`;
    return;
  }
  if (event.data.type === 'science-work-description-scroll') {
    const topbarHeight = document.querySelector('.topbar')?.offsetHeight || 0;
    const frameTop = frame.getBoundingClientRect().top + window.scrollY;
    const targetTop = Math.max(0, Number(event.data.top) || 0);
    window.scrollTo({ top: Math.max(0, frameTop + targetTop - topbarHeight - 10), behavior: 'smooth' });
    return;
  }
  if (event.data.type === 'science-work-description-state') {
    setHeaderState(event.data);
    return;
  }
  if (event.data.type === 'science-work-description-toast') {
    showToast(event.data.message, event.data.isError);
    return;
  }
  if (event.data.type === 'science-work-description-type') {
    // 안쪽 앱에서 종류가 바뀐 경우 상단 메뉴와 제목을 맞춰 준다.
    const next = event.data.reportType === 'invention' ? 'invention' : 'fair';
    if (next !== currentKey) {
      currentKey = next;
      const url = new URL(window.location.href);
      url.searchParams.set('tab', currentKey);
      window.history.replaceState(null, '', url);
      renderMenu();
      renderHero();
      setTimeout(syncOuterSectionSidebar, 0);
    }
  }
});

document.getElementById('outerSectionSidebar').addEventListener('click', event => {
  const button = event.target.closest('[data-section-target]');
  if (!button) return;
  scrollToInnerSection(button.dataset.sectionTarget);
});

// 첫 실행
renderMenu();
renderHero();
selectTab(currentKey, { force: true });
</script>
</body>
</html>
