<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>탐구 활동 가이드</title>
<style>
:root{
  --panel:#ffffff;
  --ink:#13223a;
  --muted:#65758d;
  --line:#dbe3ef;
  --navy:#122b49;
  --blue:#2563eb;
  --soft:#f7faff;
  --shadow:0 18px 45px rgba(18,43,73,.10);
  --radius:20px;
  --page-max:1440px;
  --page-gap:68px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:linear-gradient(180deg,#f8fbff 0%,#eef4fb 100%);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  line-height:1.72;
}
header{
  width:min(calc(100% - var(--page-gap) * 2),var(--page-max));
  margin:18px auto 0;
  background:
    radial-gradient(circle at 92% 10%,rgba(255,255,255,.16),transparent 28%),
    linear-gradient(90deg,#1f2b49 0%,#28365f 48%,#7983c6 100%);
  color:#fff;
  min-height:118px;
  padding:0 36px;
  border-radius:26px;
  border:1px solid rgba(148,163,210,.70);
  box-shadow:0 10px 26px rgba(18,43,73,.12), inset 0 1px 0 rgba(255,255,255,.18);
  display:flex;
  align-items:center;
}
.header-inner{max-width:none;margin:0;padding:0}
h1{font-size:clamp(31px,3vw,42px);line-height:1.08;margin:0;font-weight:900;letter-spacing:-.055em;text-shadow:0 2px 8px rgba(0,0,0,.14)}
.lead{margin:0;max-width:100%;color:#edf4ff;font-size:clamp(16px,2.05vw,21px);line-height:1.55;font-weight:800;letter-spacing:-.035em}
main{width:min(calc(100% - var(--page-gap) * 2),var(--page-max));max-width:none;margin:14px auto 48px;padding:0;position:relative;z-index:2}
.tab-wrap{
  background:rgba(255,255,255,.96);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:12px;
  position:sticky;
  top:10px;
  z-index:20;
  backdrop-filter:blur(10px);
}
.tabs{display:flex;flex-wrap:wrap;gap:8px;overflow:visible;padding:2px 2px 4px;scrollbar-width:none}
.tab{
  border:1px solid var(--line);
  background:#fff;
  color:#26364d;
  border-radius:999px;
  padding:10px 15px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
  transition:.18s;
  font-size:14px;
}
.tabs::-webkit-scrollbar{display:none}
.tab:hover{transform:translateY(-1px);border-color:#a9c7eb}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab-short{display:none}
.content{margin-top:14px}
.section-head{margin:16px 0 12px}
.section-title{display:flex;gap:10px;align-items:center}
.section-badge,.guide-badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;flex:0 0 34px}
.section-head h2,.guide-title h2{font-size:24px;margin:0;font-weight:900;letter-spacing:-.035em}
.guide-hero{
  background:transparent;
  border:0;
  border-radius:0;
  box-shadow:none;
  padding:0;
}
.guide-title{display:flex;gap:10px;align-items:center;margin:0 0 14px}

.mobile-guide-report-btn{display:none;align-items:center;justify-content:center;text-decoration:none;background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:900;line-height:1.12;letter-spacing:-.045em;box-shadow:0 6px 14px rgba(18,43,73,.14);white-space:nowrap;flex:0 0 auto}
.mobile-guide-report-btn:hover{transform:translateY(-1px)}

.guide-block{border:1px solid var(--line);border-radius:22px;padding:14px;background:linear-gradient(180deg,#fff 0%,#f9fbff 100%)}
.guide-block + .guide-block{margin-top:12px}
.block-heading{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap;padding:8px 12px;border:1px solid #9fb9de;border-radius:15px;background:linear-gradient(180deg,#d6e6fb 0%,#c3d9f6 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.table-align-heading{padding-left:14px}
.block-heading .pill{display:inline-flex;align-items:center;justify-content:center;padding:6px 11px;border-radius:999px;border:1px solid #8eaed8;background:#ffffff;color:#102a43;font-weight:900;font-size:13px;box-shadow:0 2px 6px rgba(18,43,73,.08)}
.block-heading h3{margin:0;font-size:21px;font-weight:900;letter-spacing:-.03em;color:#102a43}
.title-count-circle{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:#102a43;color:#fff;font-size:16px;font-weight:900;letter-spacing:-.03em;line-height:1;margin:0 5px;vertical-align:middle;box-shadow:0 8px 18px rgba(18,43,73,.18)}
.flow-row{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;align-items:stretch}
.flow-card{position:relative;border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 9px 9px;min-height:0;height:100%;text-align:center;box-shadow:0 7px 18px rgba(18,43,73,.052);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.flow-card::after{content:"›";position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:20px;text-align:center;font-size:32px;font-weight:900;color:#102a43;z-index:3;line-height:1}
.flow-card:last-child::after{display:none}
.flow-no{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;box-shadow:0 5px 12px rgba(18,43,73,.13);margin-bottom:6px}
.flow-card h4{margin:0 0 4px;font-size:14px;line-height:1.25;font-weight:900;color:#102a43}
.flow-card p{margin:0;font-size:12.6px;line-height:1.38;color:#34445b}

.report-link-wrap{display:flex;justify-content:center;margin-top:12px}
.report-link-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:999px;padding:10px 20px;font-size:14px;font-weight:900;line-height:1.15;letter-spacing:-.03em;box-shadow:0 8px 18px rgba(18,43,73,.16);transition:.18s;white-space:nowrap}
.report-link-btn:hover{transform:translateY(-1px);box-shadow:0 11px 22px rgba(18,43,73,.20)}
.flow-heading{flex-wrap:nowrap}
.flow-heading h3{flex:1 1 auto;min-width:0}
.heading-report-btn{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:900;line-height:1.15;letter-spacing:-.03em;box-shadow:0 6px 14px rgba(18,43,73,.14);transition:.18s;white-space:nowrap;flex:0 0 auto}
.heading-report-btn:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(18,43,73,.18)}
.manual-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;align-items:stretch}
.manual-card{position:relative;text-align:center;padding:10px 8px 0}
.manual-card::after{content:"›";position:absolute;right:-14px;top:38px;font-size:44px;font-weight:900;color:#102a43;line-height:1}
.manual-card:last-child::after{display:none}
.manual-circle{width:112px;height:112px;border-radius:50%;margin:0 auto 14px;background:#fff;border:10px solid #e2f0f6;display:flex;align-items:center;justify-content:center;color:#0d2a4d;font-size:21px;line-height:1.12;font-weight:900;box-shadow:0 10px 24px rgba(18,43,73,.06)}
.manual-desc{font-size:14px;line-height:1.6;text-align:center;color:#27384f}
.manual-desc strong{display:block;font-size:16px;margin-bottom:4px;color:#102a43}
.frame-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:14px}
.frame-table th,.frame-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.frame-table tr:last-child td{border-bottom:0}
.frame-table th{background:#f0f5fc;color:#102a43;text-align:left;font-weight:900}
.frame-table td:first-child{font-weight:900;color:#102a43;width:130px}

.type-guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.type-card{border:1px solid #dbe6f5;background:#fff;border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 24px rgba(18,43,73,.06);border-left:6px solid var(--navy)}
.type-label{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 13px;margin-bottom:10px;background:var(--navy);color:#fff;font-weight:900;font-size:14px}
.type-card h4{margin:0 0 8px;font-size:19px;font-weight:900;letter-spacing:-.03em;color:#102a43}
.type-card p{margin:0 0 10px;font-size:14px;line-height:1.65;color:#33445b}
.type-note{display:inline-flex;align-items:center;border:1px solid #cddbed;background:#f4f8fd;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900;color:#26364d}
.type-summary{margin-top:14px;border:1px solid #d7e5f7;background:#f0f6ff;border-radius:16px;padding:14px 16px;font-weight:900;color:#24364f;line-height:1.7}
.type-summary span{display:inline-block;margin-right:12px}

.type-check-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:14px}
.type-check-table th,.type-check-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.type-check-table tr:last-child td{border-bottom:0}
.type-check-table th{background:#f0f5fc;color:#102a43;text-align:left;font-weight:900}
.type-check-table .type-no{width:90px;text-align:center;font-weight:900;color:#102a43;background:#f8fbff}
.type-check-table .type-title{width:210px;font-weight:900;color:#102a43}
.type-check-table .type-note-cell{width:190px;color:#26364d;font-weight:800}

.selfeval-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;font-size:14px}
.selfeval-table th,.selfeval-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.selfeval-table tr:last-child td{border-bottom:0}
.selfeval-table th{background:#f0f5fc;color:#102a43;text-align:left;font-weight:900}
.selfeval-table .num{width:58px;text-align:center;font-weight:900;color:#102a43}
.selfeval-table .fill{width:180px;font-weight:900;color:#1555a8}
.selfeval-table .template{color:#28384f;line-height:1.7}
.selfeval-table .blank{display:inline-block;min-width:110px;height:1.05em;border-bottom:2px solid #b9c8dc;margin:0 5px;vertical-align:-0.12em;transform:none}
.selfeval-note{margin-top:14px;border:1px solid #d7e5f7;background:#f0f6ff;border-radius:16px;padding:14px 16px;color:#26364d;line-height:1.7;font-size:14px}
.selfeval-note strong{color:#102a43}
.selfeval-flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.selfeval-flow span{display:inline-flex;align-items:center;justify-content:center;border:1px solid #cddbed;background:#fff;border-radius:999px;padding:6px 11px;font-weight:900;color:#26364d;font-size:13px}
.keyword-grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:7px}
.keyword-chip{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 8px;font-size:13.5px;line-height:1.3;min-height:40px;min-width:0}
.keyword-chip b{display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;height:26px;border-radius:50%;background:#eff5ff;color:#1555a8;font-size:11.5px;font-weight:900}
.keyword-chip span{min-width:0;word-break:keep-all;overflow-wrap:break-word;white-space:normal;overflow:visible}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px rgba(18,43,73,.07);overflow:hidden}
.card-head{padding:18px 18px 12px;border-bottom:1px solid #eef2f7;background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%)}
.card-title{margin:0;font-size:18px;font-weight:900;letter-spacing:-.02em;color:#102a43}
.card-source{margin-top:7px;color:#65758d;font-size:13px;font-weight:800;line-height:1.35}
.section-meta{margin:6px 0 0 44px;color:#65758d;font-size:14px;font-weight:800}
.card-body{padding:16px 18px 18px;font-size:15px;color:#253349;white-space:pre-line}
.tag{display:inline-block;border-radius:6px;padding:1px 5px;margin:0 1px 0 0;background:#eaf3ff;color:#1555a8;font-size:.92em;font-weight:900}
footer{
  width:min(calc(100% - var(--page-gap) * 2),var(--page-max));
  max-width:none;
  margin:10px auto 34px;
  padding:0;
  text-align:center;
  color:#65758d;
  font-size:13px;
  font-weight:800;
}
@media (max-width:1160px){
  .keyword-grid{grid-template-columns:repeat(4,minmax(170px,1fr))}
}
@media (max-width:980px){
  :root{--page-gap:18px}
  .flow-row{grid-template-columns:1fr;gap:8px}
  .manual-row{grid-template-columns:1fr}
  .flow-card{min-height:auto;height:auto;text-align:left;align-items:flex-start;padding:10px 12px;display:grid;grid-template-columns:30px 1fr;gap:2px 9px}
  .flow-card::after,.manual-card::after{display:none}
    .flow-no{grid-row:1 / span 2;margin:0;width:24px;height:24px;font-size:12px}
  .manual-card{display:grid;grid-template-columns:94px 1fr;gap:12px;align-items:center;text-align:left;padding:8px 0 12px;border-bottom:1px dashed #d7e1ee}
  .manual-card:last-child{border-bottom:0}
  .manual-circle{width:88px;height:88px;margin:0;font-size:18px;border-width:8px}
  .manual-desc{text-align:left}
  .keyword-grid{grid-template-columns:repeat(3,minmax(150px,1fr));gap:6px}
  .keyword-chip{padding:6px 7px;font-size:13px;gap:5px}
  .keyword-chip b{flex-basis:24px;height:24px;font-size:11px}
  .type-guide-grid{grid-template-columns:1fr}
  .selfeval-table{font-size:13px}
  .selfeval-table th,.selfeval-table td{padding:10px 9px}
    .selfeval-table .fill{width:100px}
  .selfeval-table .blank{min-width:72px}
  .type-check-table{font-size:13px}
  .type-check-table th,.type-check-table td{padding:10px 9px}
  .type-check-table .type-no{width:58px}
  .type-check-table .type-title{width:120px}
  .type-check-table .type-note-cell{width:120px}
  .cards{grid-template-columns:1fr}
}

@media (max-width:820px){
  .tab-wrap{padding:9px;overflow:hidden}
  .tabs{
    display:grid;
    grid-template-columns:minmax(0,1.05fr) repeat(5,minmax(0,.66fr)) minmax(0,.9fr) minmax(0,1.02fr);
    gap:5px;
    width:100%;
    overflow:hidden;
    padding:0;
    align-items:center;
  }
  .tab{
    width:100%;
    min-width:0;
    padding:8px 5px;
    font-size:clamp(11px,2vw,15px);
    line-height:1.08;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    letter-spacing:-.055em;
  }
  .tab-full{display:none}
  .tab-short{display:inline}
}

@media (max-width:560px){
  :root{--page-gap:12px}
  header{
    width:calc(100% - var(--page-gap) * 2);
    margin:10px auto 0;
    min-height:82px;
    padding:0 18px;
    border-radius:22px;
  }
  h1{
    font-size:clamp(18px,5.15vw,29px);
    line-height:1.05;
    margin:0;
    white-space:nowrap;
    letter-spacing:-.075em;
  }
  .lead{font-size:15px;line-height:1.55;font-weight:800}
  main{width:calc(100% - var(--page-gap) * 2);padding:0;margin-top:10px}
  .tab-wrap{position:relative;top:auto;padding:8px;overflow:hidden}
  .tabs{
    display:grid;
    grid-template-columns:minmax(0,1.02fr) repeat(5,minmax(0,.58fr)) minmax(0,.82fr) minmax(0,.96fr);
    gap:4px;
    padding:0;
    width:100%;
    overflow:hidden;
    align-items:center;
  }
  .tab{
    width:100%;
    min-width:0;
    padding:7px 2px;
    font-size:clamp(9.6px,2.55vw,12px);
    line-height:1.08;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    letter-spacing:-.07em;
  }
  .tab-full{display:none}
  .tab-short{display:inline}
  .guide-hero{padding:0}
  .guide-title{gap:8px;margin:0 0 10px}
  .guide-title h2{font-size:20px;line-height:1.15;white-space:nowrap}
  .mobile-guide-report-btn{display:inline-flex;margin-left:auto;font-size:10.5px;padding:6px 8px}
  .flow-heading .heading-report-btn{display:none}
  .flow-heading h3{overflow:visible;text-overflow:clip}
  .guide-block{padding:10px}

  .report-link-wrap{margin-top:9px}
  .report-link-btn{width:100%;padding:10px 12px;font-size:13px}
  .block-heading{padding:7px 9px;margin-bottom:8px}
  .block-heading h3{font-size:18px}
  .heading-report-btn{padding:7px 10px;font-size:12px}
  .title-count-circle{width:44px;height:44px;font-size:14px;margin:0 4px}
  .table-align-heading{padding-left:12px}
  .keyword-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    align-items:stretch;
    gap:4px;
    margin-left:0;
    margin-right:0;
  }
  .keyword-chip{
    width:100%;
    max-width:none;
    min-width:0;
    justify-content:flex-start;
    gap:2px;
    padding:3px 4px;
    min-height:26px;
    border-radius:999px;
    font-size:10px;
    line-height:1.12;
  }
  .keyword-chip b{flex:0 0 17px;height:17px;font-size:9px}
  .keyword-chip span{min-width:0;white-space:normal;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.07em;overflow:visible}
  .selfeval-table{font-size:12.5px;table-layout:auto}
  .selfeval-table th,.selfeval-table td{padding:8px 6px}
  .selfeval-table th:first-child,.selfeval-table .num{width:32px;min-width:32px;padding-left:3px;padding-right:3px}
  .selfeval-table .fill{width:82px;padding-left:5px;padding-right:5px}
  .selfeval-table .template{padding-left:7px;padding-right:7px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word}
  .selfeval-table .blank{min-width:50px;margin:0 3px}
  .card-head{padding:15px 15px 10px}
  .card-body{padding:14px 15px 16px;font-size:14px}


  /* 모바일: 유형 진단은 표보다 카드형이 더 읽기 쉬움. 유형 번호+제목을 한 줄 상단에 두고, 설명과 점검 포인트를 아래로 분리 */
  .type-check-table{
    display:block;
    width:100%;
    border:0;
    border-radius:0;
    overflow:visible;
    background:transparent;
    font-size:14px;
  }
  .type-check-table thead{display:none}
  .type-check-table tbody{display:grid;gap:10px}
  .type-check-table tr{
    display:grid;
    grid-template-columns:auto 1fr;
    gap:6px 9px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#fff;
    overflow:hidden;
    box-shadow:0 8px 18px rgba(18,43,73,.06);
  }
  .type-check-table th,
  .type-check-table td{
    display:block;
    width:auto !important;
    padding:0;
    border:0;
    line-height:1.55;
    white-space:normal;
    word-break:keep-all;
    overflow-wrap:break-word;
    vertical-align:top;
  }
  .type-check-table td::before{
    display:inline-block;
    margin:0 6px 0 0;
    color:#65758d;
    font-size:11.5px;
    line-height:1.35;
    font-weight:900;
  }
  .type-check-table .type-no{
    grid-column:1;
    align-self:start;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:5px 9px;
    border-radius:999px;
    background:#102a43;
    color:#fff;
    text-align:center;
    font-size:12px;
    line-height:1.15;
    font-weight:900;
    white-space:nowrap;
  }
  .type-check-table .type-no::before{display:none}
  .type-check-table .type-title{
    grid-column:2;
    align-self:center;
    background:transparent;
    color:#102a43;
    font-size:15px;
    line-height:1.35;
    font-weight:900;
  }
  .type-check-table .type-title::before{display:none}
  .type-check-table td:nth-child(3){
    grid-column:1 / -1;
    padding-top:7px;
    border-top:1px solid #eef2f7;
    color:#34445b;
    font-size:13px;

        <div class="summary-box"><b>핵심 역량</b><p>주제 탐색, 실험 설계, 자료 분석, 보고서 작성, 발표, 협업과 의사소통까지 실제 연구자의 과정을 경험합니다.</p></div>
        <div class="summary-box"><b>실패의 의미</b><p>예상과 다른 결과도 의미가 있습니다. 실패 원인, 한계, 개선 방향을 기록하면 다음 연구의 출발점이 됩니다.</p></div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">연구흐름</span><h3>R&amp;E 연구 진행 9단계</h3></div>
        <div class="flow-grid">
          <div class="flow-step"><b>1</b><strong>주제 탐색</strong><span>교과·생활·진로에서 궁금한 현상 찾기</span></div>
          <div class="flow-step"><b>2</b><strong>연구 문제 발견</strong><span>탐구 가능한 질문으로 좁히기</span></div>
          <div class="flow-step"><b>3</b><strong>연구 계획 수립</strong><span>가설, 변인, 방법, 일정 정리</span></div>
          <div class="flow-step"><b>4</b><strong>지식·기능 습득</strong><span>선행연구, 장비 사용법, 분석법 익히기</span></div>
          <div class="flow-step"><b>5</b><strong>실험 설계</strong><span>조작·통제·종속변인과 반복 조건 설계</span></div>
          <div class="flow-step"><b>6</b><strong>실행·결과 정리</strong><span>측정, 기록, 표·그래프 정리</span></div>
          <div class="flow-step"><b>7</b><strong>보고서 작성</strong><span>문제, 방법, 결과, 해석을 논리적으로 구성</span></div>
          <div class="flow-step"><b>8</b><strong>연구 발표</strong><span>핵심 결과를 압축해 설명하고 질문 받기</span></div>
          <div class="flow-step"><b>9</b><strong>평가·개선</strong><span>피드백을 반영해 한계와 후속 연구 정리</span></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">방법</span><h3>귀납적 연구와 가설-연역적 연구</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>구분</th><th>흐름</th><th>학생이 이해할 핵심</th><th>주의할 점</th></tr></thead>
            <tbody>
              <tr><td>귀납적 연구</td><td>현상 관찰 → 문제 인식 → 자료 수집 → 자료 해석 → 결론 도출</td><td>여러 관찰과 실험 결과에서 규칙, 경향, 패턴을 발견하는 방식입니다.</td><td>표본이 적거나 조건이 편향되면 일반화가 어렵습니다. 새 사례가 나오면 결론이 바뀔 수 있습니다.</td></tr>
              <tr><td>가설-연역적 연구</td><td>현상 관찰 → 문제 인식 → 가설 설정 → 탐구 설계 → 탐구 수행 → 자료 해석 → 결론 도출</td><td>먼저 잠정적 설명인 가설을 세운 뒤, 실험 설계로 가설을 검증합니다.</td><td>결과가 가설과 맞더라도 다른 요인 때문에 그런 결과가 나왔을 가능성을 함께 검토해야 합니다.</td></tr>
              <tr><td>실제 연구</td><td>두 방법이 섞여 사용됨</td><td>관찰 단계에서는 귀납적으로 질문을 만들고, 검증 단계에서는 가설-연역적으로 실험하는 경우가 많습니다.</td><td>연구 문제, 가설, 변인, 자료 해석이 서로 연결되어야 합니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>연구 방법을 이해하는 과학사 사례</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>보일의 법칙: 관찰 자료에서 규칙 찾기</h4><p>보일은 공기를 압축하면서 압력과 부피의 관계를 측정했고, 여러 측정값을 비교해 압력이 커질수록 부피가 작아지는 규칙을 발견했습니다. 학생 연구에서는 이처럼 여러 조건의 데이터를 모아 일정한 패턴을 찾는 방식이 귀납적 연구에 해당합니다.</p></div>
          <div class="example-card"><h4>후크의 법칙: 힘과 늘어난 길이 비교</h4><p>후크는 탄성이 있는 물체에 힘을 가하고 늘어난 길이를 측정해 두 값 사이의 비례 관계를 찾았습니다. 이 사례는 ‘조작변인: 가한 힘’, ‘종속변인: 늘어난 길이’처럼 변인을 명확히 정하면 교과 개념도 탐구 주제가 될 수 있음을 보여줍니다.</p></div>
          <div class="example-card"><h4>케쿨레의 벤젠 구조: 창의적 가설</h4><p>벤젠 구조를 고민하던 케쿨레는 고리 모양 구조라는 가설을 세우고, 이후 실험과 자료를 통해 이를 설명하려 했습니다. 가설-연역적 연구에서는 처음부터 완벽한 답을 아는 것이 아니라, 설명 가능한 가설을 세운 뒤 검증 가능한 증거를 찾습니다.</p></div>
          <div class="example-card"><h4>DNA 이중 나선: 데이터 기반 가설 검증</h4><p>DNA의 X-선 회절 자료는 구조를 추론하는 핵심 근거가 되었습니다. 중요한 점은 ‘상상’만으로 결론을 낸 것이 아니라, 가설이 맞다면 어떤 데이터 패턴이 나타나야 하는지 예측하고 실제 자료와 비교했다는 점입니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">기록</span><h3>연구 노트는 최종 보고서의 원자료</h3></div>
        <ul class="check-list">
          <li>연구 문제를 떠올린 순간부터 실험, 데이터, 분석, 회의 내용까지 기록합니다.</li>
          <li>날짜, 시작·종료 시간, 작성자, 확인자, 실험 장소, 온도·습도 같은 환경 조건을 적습니다.</li>
          <li>실패한 실험, 이상값, 실수도 지우지 않고 남겨 원인 분석에 활용합니다.</li>
          <li>수정할 때는 수정액으로 지우지 말고 두 줄을 긋고 수정 내용을 덧붙입니다.</li>
          <li>나중에 노트만 보고도 같은 실험을 반복할 수 있을 정도로 재료와 절차를 구체화합니다.</li>
          <li>사진, 그래프, 코드, 측정 파일명, 장비 설정값도 함께 기록합니다.</li>
        </ul>
        <div class="note">연구 노트는 예쁘게 꾸미는 노트가 아니라, 연구가 실제로 어떻게 진행되었는지 증명하는 문서입니다. 표절·연구윤리 문제를 설명할 때도 중요한 근거가 됩니다.</div>
      </div>
    </section>

    <section class="manual-section" id="problem">
      <div class="section-head"><span class="section-no">02</span><div><h2>연구 문제의 발견</h2><p class="section-lead">좋은 연구는 거창한 주제보다 ‘내가 실제로 검증할 수 있는 질문’을 정확히 잡는 데서 시작됩니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">주제</span><h3>좋은 연구 문제의 조건</h3></div>
        <div class="grid-3">
          <div class="card"><h4>스스로 답할 수 있는가</h4><p>검색으로 끝나는 질문이 아니라, 실험·조사·측정·분석을 통해 학생이 직접 근거를 만들 수 있어야 합니다.</p></div>
          <div class="card"><h4>아직 탐구 가치가 있는가</h4><p>이미 완전히 해결된 문제가 아닌지 선행연구를 확인하고, 기존 연구와 다른 관점이나 조건을 찾아야 합니다.</p></div>
          <div class="card"><h4>현실적으로 가능한가</h4><p>학교 장비, 시간, 예산, 안전 조건 안에서 수행 가능해야 합니다. 너무 큰 주제는 실패 가능성이 높습니다.</p></div>
          <div class="card"><h4>기간 안에 끝낼 수 있는가</h4><p>1년 또는 수행평가 기간 안에 예비 실험, 본 실험, 분석, 보고서 작성까지 가능한 범위여야 합니다.</p></div>
          <div class="card"><h4>실생활·교과와 연결되는가</h4><p>교과 개념에서 출발해 생활 속 문제로 확장하면 설득력이 높고, 학생부 탐구 기록으로도 자연스럽습니다.</p></div>
          <div class="card"><h4>활용 가능성이 있는가</h4><p>문제 해결, 개선 방안, 후속 연구, 진로 연계 등 연구 결과가 어디에 쓰일 수 있는지 설명할 수 있어야 합니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">탐색</span><h3>연구 질문을 만드는 방법</h3></div>
        <ul class="check-list">
          <li>1~2주 정도 주변 현상과 불편함을 관찰하며 궁금한 점을 계속 기록합니다.</li>
          <li>교과서 개념을 생활 속 현상으로 바꿔 봅니다. 예: 탄성력, 압력, 빛, 열, 미세먼지, 센서, 알고리즘.</li>
          <li>처음 질문은 넓게 만들고, 공통 키워드별로 묶어 최종 질문을 좁힙니다.</li>
          <li>“왜 그럴까?”에서 끝내지 말고 “무엇을 바꾸면 어떤 값이 달라질까?” 형태로 바꿉니다.</li>
          <li>관찰 가능한 변인, 측정 가능한 결과값, 비교 조건이 들어가도록 질문을 고칩니다.</li>
          <li>지도교사, 전문가, 선행연구를 통해 고등학생 수준에서 가능한 범위인지 확인합니다.</li>
        </ul>
        <div class="note">질문 예시 구조: “○○ 조건을 변화시키면 △△ 결과값은 어떻게 달라지는가?” / “□□ 방법은 기존 방법보다 ○○을 얼마나 개선하는가?”</div>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>생활 속 현상을 R&amp;E 주제로 바꾸는 예시</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>라면을 맛있게 끓이는 조건</h4><p>단순히 “라면을 맛있게 끓이는 법”을 묻는 것이 아니라, 찬물에서 시작한 면과 끓는 물에 넣은 면을 비교하고 익힌 면발이 끊어지는 길이를 측정하면 ‘가열 조건에 따른 면의 탄성 변화’라는 연구 문제가 됩니다. 생활 주제라도 측정값이 있으면 과학 탐구가 됩니다.</p></div>
          <div class="example-card"><h4>걸을 때 머그잔 커피가 쏟아지는 이유</h4><p>일상에서 흔한 현상도 연구 주제가 될 수 있습니다. 컵의 지름, 액체 높이, 걸음 속도, 손의 흔들림 주기를 바꾸어 액체가 넘치는 조건을 비교하면 유체의 진동과 공명, 운동 주기와 연결된 탐구로 확장할 수 있습니다.</p></div>
          <div class="example-card"><h4>미세먼지 질문의 정교화</h4><ul><li>미세먼지를 더 쉽게 검출할 수 있는가?</li><li>초음파 진동으로 미세먼지를 포집할 수 있는가?</li><li>거르는 방식이 아닌 제거 방식의 마스크를 만들 수 있는가?</li></ul><p>처음에는 넓은 질문이어도, ‘검출·포집·제거’처럼 목적을 나누면 실험 방법이 구체화됩니다.</p></div>
          <div class="example-card"><h4>풍선과 음향 공중부양 질문</h4><ul><li>풍선이 천장에 오래 붙어 있는 조건은 무엇인가?</li><li>풍선 팽창 중 표면의 광학 특성은 어떻게 변하는가?</li><li>음파로 연기나 미세 입자를 특정 위치에 모을 수 있는가?</li></ul><p>이런 질문은 정전기, 열역학, 파동, 정상파처럼 교과 개념과 연결되며, 학생 연구에서는 한 가지 변인부터 좁혀 실험하는 것이 좋습니다.</p></div>
        </div>
        <div class="note">원본 매뉴얼의 사례들은 공통적으로 “생활 속 궁금증 → 측정 가능한 변인 → 비교 가능한 데이터 → 과학 개념 연결”의 흐름을 가집니다. 학생들은 처음부터 거창한 주제를 찾기보다, 작은 현상을 정확히 측정하는 방향으로 시작하는 것이 좋습니다.</div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">문헌</span><h3>참고문헌 검색 경로와 활용법</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>경로</th><th>활용 목적</th><th>주의할 점</th></tr></thead>
            <tbody>
              <tr><td>YouTube</td><td>현상 관찰, 실험 장치 아이디어, 변인 설정 아이디어를 얻는 데 유용합니다.</td><td>영상은 출발점일 뿐입니다. 과학적 근거와 출처가 있는지 별도로 확인해야 합니다.</td></tr>
              <tr><td>위키피디아</td><td>낯선 분야의 개념, 용어, 전체 구조를 빠르게 파악할 때 도움이 됩니다.</td><td>최종 보고서의 핵심 근거로 쓰기보다, 더 신뢰도 높은 자료를 찾기 위한 길잡이로 활용합니다.</td></tr>
              <tr><td>전문 교재·교과서</td><td>배경 이론을 안정적으로 정리할 때 필요합니다. 논문에서 생략한 기초 개념을 보완합니다.</td><td>학생 수준에 맞게 개념을 재정리해야 합니다. 이해하지 못한 이론을 그대로 옮기면 보고서 신뢰도가 낮아집니다.</td></tr>
              <tr><td>Google Scholar</td><td>학술 논문, 초록, 무료 PDF, 인용 정보 확인에 유용합니다.</td><td>영문 논문은 초록·그림·결론부터 읽고, 필요한 부분을 선별해 정리합니다.</td></tr>
              <tr><td>RISS·KISS·DBpia</td><td>국문 논문, 학위논문, 학술지 자료 검색에 적합합니다.</td><td>처음 접하는 분야는 배경 설명이 긴 학위논문이 오히려 이해에 도움이 될 수 있습니다.</td></tr>
              <tr><td>과학전람회·발명품 자료</td><td>학생 수준의 연구 주제, 실험 방법, 보고서 표현 방식을 참고할 수 있습니다.</td><td>그대로 따라 하면 차별성이 부족합니다. 조건, 방법, 대상, 분석을 다르게 설계해야 합니다.</td></tr>
              <tr><td>전문가 연락</td><td>문헌에서 해결되지 않는 장비·분석·실험 설계 문제를 조언받을 수 있습니다.</td><td>막연히 질문하지 말고 연구계획서를 정리한 뒤 구체적인 질문으로 연락합니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">윤리</span><h3>연구 윤리: 정직과 책임감</h3></div>
        <div class="grid-2">
          <div class="card"><h4>정직</h4><p>다른 사람의 아이디어, 데이터, 그림, 문장을 사용했다면 반드시 출처를 표시합니다. 데이터는 실제 수집한 대로 기록하고, 원하는 결론에 맞춰 고치지 않습니다.</p></div>
          <div class="card"><h4>책임감</h4><p>연구가 사람, 생명체, 환경, 안전에 미칠 영향을 고려해야 합니다. 유해 화학물질, 감염 위험 대상, 생명체 실험은 특히 주의해야 합니다.</p></div>
        </div>
        <div class="warn">반드시 피해야 할 연구부정행위: 위조, 변조, 표절, 부당한 저자 표시, 부당한 중복 제출·게재입니다. 특히 한 과목에 낸 보고서를 다른 과목에 그대로 제출하려면 반드시 지도교사와 먼저 상의해야 합니다.</div>
      </div>
    </section>

    <section class="manual-section" id="design">
      <div class="section-head"><span class="section-no">03</span><div><h2>연구 설계</h2><p class="section-lead">연구 설계는 하고 싶은 실험을 나열하는 것이 아니라, 질문에 답하기 위한 논리적 구조를 만드는 단계입니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">계획서</span><h3>연구계획서에 들어가야 할 내용</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>항목</th><th>작성 방향</th><th>학생이 조심할 점</th></tr></thead>
            <tbody>
              <tr><td>연구 제목</td><td>대상, 방법, 범위, 핵심 변인이 드러나게 간결하게 씁니다.</td><td>“~에 대한 연구”처럼 막연한 제목은 피합니다.</td></tr>
              <tr><td>요약문</td><td>연구의 필요성, 목적, 방법, 기대효과를 1쪽 이내로 압축합니다.</td><td>처음부터 쓰기 어렵다면 본문을 먼저 쓰고 마지막에 요약합니다.</td></tr>
              <tr><td>필요성·목적</td><td>왜 이 문제가 중요한지, 선행연구와 무엇이 다른지 설명합니다.</td><td>단순한 관심이 아니라 해결할 가치가 있는 문제로 제시합니다.</td></tr>
              <tr><td>연구 내용·방법</td><td>무엇을 어디까지 연구하고, 어떤 절차와 장비로 데이터를 얻을지 씁니다.</td><td>주요 변인, 가설, 실험 조건, 반복 횟수를 구체화합니다.</td></tr>
              <tr><td>기대효과·활용</td><td>예상 결과, 사회적 기여, 후속 연구 가능성, 활용 방안을 정리합니다.</td><td>과장된 효과보다 연구 결과로 말할 수 있는 범위를 제시합니다.</td></tr>
              <tr><td>추진 일정</td><td>주제 선정, 선행연구, 예비 실험, 본 실험, 분석, 발표, 보고서 제출을 월별로 배치합니다.</td><td>실험 실패와 재실험 시간을 반드시 확보합니다.</td></tr>
              <tr><td>참고문헌</td><td>이미 조사한 자료와 앞으로 분석할 자료를 모두 기록합니다.</td><td>출처 누락은 연구 윤리 문제로 이어질 수 있습니다.</td></tr>
              <tr><td>역할 분담</td><td>팀원의 장점과 책임을 반영해 조사, 실험, 코딩, 분석, 발표 역할을 나눕니다.</td><td>무임승차나 역할 충돌이 생기지 않도록 세부 업무를 명확히 씁니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">평가</span><h3>좋은 연구계획서의 평가 기준</h3></div>
        <div class="grid-3">
          <div class="card"><h4>창의성·적절성</h4><p>선행연구와의 차별성, 실생활 문제와의 관련성, 융합적 접근, 학생 눈높이에 맞는 실천 가능성이 드러나야 합니다.</p></div>
          <div class="card"><h4>계획의 충실성</h4><p>문제 해결 방법이 구체적이고, 학생이 직접 설계하는 과정과 새로운 산출물 또는 아이디어가 예상되어야 합니다.</p></div>
          <div class="card"><h4>추진체계</h4><p>학생 역할, 지도교사·전문가 역할, 일정, 예산, 장비 활용 계획이 현실적으로 정리되어야 합니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">변인</span><h3>실험 설계의 핵심 용어</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>용어</th><th>뜻</th><th>작성 예시 방향</th></tr></thead>
            <tbody>
              <tr><td>조작적 정의</td><td>막연한 현상을 실제로 관찰·측정 가능한 형태로 정의하는 것입니다.</td><td>“소리가 크다” → “녹음 파일의 최대 진폭이 크다”처럼 수치화합니다.</td></tr>
              <tr><td>가설</td><td>연구 문제에 대한 잠정적 설명 또는 예측입니다.</td><td>“A가 증가하면 B는 감소할 것이다”처럼 변인 간 관계가 드러나야 합니다.</td></tr>
              <tr><td>독립변인</td><td>실험 결과에 영향을 줄 수 있는 원인 후보입니다.</td><td>재료 크기, 거리, 온도, 속도, 센서 위치 등 가능한 요인을 나열합니다.</td></tr>
              <tr><td>조작변인</td><td>독립변인 중 실제로 의도적으로 바꿔 보는 변인입니다.</td><td>이번 연구에서 바꿀 조건을 1~2개로 명확히 정합니다.</td></tr>
              <tr><td>통제변인</td><td>조작변인의 효과만 보기 위해 일정하게 유지하는 조건입니다.</td><td>재료, 장비, 측정 시간, 환경 조건 등을 같게 유지합니다.</td></tr>
              <tr><td>종속변인</td><td>조작변인의 영향을 받아 측정되는 결과값입니다.</td><td>길이, 시간, 온도, 진폭, 정확도, 오차율 등 수치로 기록합니다.</td></tr>
              <tr><td>실험군·대조군</td><td>처치를 가한 집단과 비교 기준이 되는 집단입니다.</td><td>모든 연구에 꼭 필요한 것은 아니지만, 비교 실험에서는 매우 중요합니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>매미자석 소리로 보는 실험 설계 예시</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>막연한 질문</h4><p>“매미자석을 부딪치면 왜 매미소리가 날까?”는 흥미로운 질문이지만, 그대로는 측정하기 어렵습니다. 먼저 ‘매미소리’를 시간에 따른 진동수와 진폭 변화로 바꾸어 정의해야 합니다.</p></div>
          <div class="example-card"><h4>조작적 정의</h4><p>매미소리를 “충돌 후 시간이 지날수록 진동수는 커지고 진폭은 작아지는 소리”로 정의하면 녹음 파일의 파형, 진폭, 충돌 간격 등을 분석할 수 있습니다.</p></div>
          <div class="example-card"><h4>가설 설정</h4><p>매미자석 특유의 소리는 자석끼리 반복적으로 충돌하면서 여러 번의 짧은 소리가 이어지고, 이를 사람이 하나의 독특한 소리로 인식하기 때문에 발생한다는 가설을 세울 수 있습니다.</p></div>
          <div class="example-card"><h4>변인 구분</h4><ul><li>독립변인: 자석 모양, 세기, 종류, 거리, 충돌 강도, 크기, 반발계수</li><li>조작변인: 이번 실험에서 실제로 바꾸는 자석 크기, 거리, 반발계수 등</li><li>통제변인: 자석 종류, 녹음 거리, 충돌 방법, 주변 소음</li><li>종속변인: 큰 진폭 소리의 간격, 시간에 따른 진폭 변화</li></ul></div>
        </div>
        <div class="note">이 사례의 핵심은 ‘재미있는 현상’을 바로 실험하지 않고, 측정 가능한 언어로 바꾼 뒤 가설과 변인을 세운다는 점입니다. 좋은 연구 설계는 실험 장비보다 먼저 논리 구조가 잡혀 있어야 합니다.</div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">검토</span><h3>계획 단계에서 꼭 점검할 부분</h3></div>
        <ul class="check-list">
          <li>연구 과정을 문헌조사, 장비 준비, 예비 실험, 본 실험, 분석, 보고서로 세분화했는가?</li>
          <li>연구 문제 → 가설 → 변인 → 실험 방법 → 데이터 분석 → 결론이 논리적으로 이어지는가?</li>
          <li>주장에 필요한 이론적 토대와 선행연구를 충분히 찾았는가?</li>
          <li>실험 장비, 재료, 시간, 비용, 안전, 윤리 조건을 현실적으로 확인했는가?</li>
          <li>예상 범위를 벗어나는 경계값, 이상값, 실패 가능성을 미리 고려했는가?</li>
          <li>팀원별 역할과 책임, 자료 공유 방식, 연구노트 확인 방식을 정했는가?</li>
        </ul>
      </div>
    </section>

    <section class="manual-section" id="conduct">
      <div class="section-head"><span class="section-no">04</span><div><h2>연구 수행</h2><p class="section-lead">실험 수행 단계에서는 안전, 변인 통제, 측정 신뢰도, 기록의 일관성이 연구의 품질을 결정합니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">점검</span><h3>실험 전·중·후 단계 점검</h3></div>
        <ul class="check-list">
          <li>가설을 검증하기에 적합한 실험인지 확인합니다.</li>
          <li>조작변인과 통제변인이 구분되어 있고 실제로 통제가 되는지 점검합니다.</li>
          <li>변화를 다양한 방법으로 관찰하고 있는지 확인합니다. 사진, 영상, 센서값, 표가 함께 있으면 좋습니다.</li>
          <li>결과를 연구노트와 원본 데이터 파일에 빠짐없이 기록합니다.</li>
          <li>예비 실험으로 장비 작동, 측정 범위, 반복 횟수, 소요 시간을 먼저 확인합니다.</li>
          <li>실험 후에는 실패 원인, 이상값, 다음 실험의 수정 사항을 즉시 적습니다.</li>
        </ul>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">안전</span><h3>연구 과정 안전 수칙</h3></div>
        <div class="grid-2">
          <div class="card"><h4>지도교사 입회</h4><p>지시되지 않은 실험을 하거나 학생 단독으로 위험 실험을 진행하지 않습니다. 실험 전 지도교사에게 절차와 위험요소를 확인받습니다.</p></div>
          <div class="card"><h4>보호구 착용</h4><p>실험복, 보안경, 장갑, 마스크 등 필요한 안전보호구를 착용합니다. 긴 머리는 묶고 발이 노출되는 신발은 피합니다.</p></div>
          <div class="card"><h4>실험실 위치 확인</h4><p>소화기, 비상 샤워기, 눈 세척기, 흄후드, 환풍기, 전기 차단기, 비상구 위치를 먼저 확인합니다.</p></div>
          <div class="card"><h4>정리와 폐기</h4><p>실험 후 시약, 기구, 전열기, 가스밸브, 수도꼭지를 확인하고 폐기물은 지정된 통에 분리합니다.</p></div>
        </div>
        <div class="warn">화학·생명과학 실험은 시약, 감염, 생명체 훼손 문제가 있을 수 있고, 물리·공학 실험도 충격, 전기, 열, 날카로운 부품 위험이 있습니다. 연구보다 안전이 우선입니다.</div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">측정</span><h3>관찰·측정·오차 이해</h3></div>
        <div class="grid-3">
          <div class="card"><h4>측정</h4><p>길이, 질량, 온도, 시간, 힘, 압력처럼 단위로 나타낼 수 있는 물리량을 도구로 재어 기록하는 활동입니다.</p></div>
          <div class="card"><h4>오차</h4><p>측정값과 참값의 차이입니다. 완전히 없앨 수 없으므로 반복 측정과 장비 보정으로 줄여야 합니다.</p></div>
          <div class="card"><h4>불확실도</h4><p>참값을 알 수 없을 때 측정값에 포함된 변동의 범위를 추정한 값입니다. 결과는 “대푯값 ± 불확실도” 형태로 나타냅니다.</p></div>
        </div>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>선행연구를 그대로 따라 하기 전에 확인할 점</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>계란 익힘 정도를 비파괴적으로 판단하는 연구</h4><p>예를 들어 계란이 얼마나 익었는지 외부에서 알아내는 연구를 한다면, 계란의 구조와 성분, 열전도도, 점도, 굴절률 등을 먼저 조사해야 합니다. 선행연구에서 빛의 반사 정도로 익힘 정도를 비교한 실험이 있다 해도, 계란 품종·크기·보관 온도·측정 온도 조건이 다르면 그대로 적용하기 어렵습니다.</p></div>
          <div class="example-card"><h4>선행연구의 역할</h4><p>선행연구는 ‘그대로 베끼는 자료’도 아니고 ‘무조건 비판할 대상’도 아닙니다. 내 연구 조건과 얼마나 일치하는지 확인하고, 다른 조건에서 생기는 차이를 한계 또는 새로운 연구 문제로 정리해야 합니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">장비</span><h3>컴퓨터·센서 기반 측정 활용</h3></div>
        <div class="grid-2">
          <div class="card"><h4>MBL·PASCO·센서</h4><p>온도, 습도, 힘, 압력 등 센서 입력을 컴퓨터로 받아 실시간 표와 그래프로 볼 수 있습니다. 측정 편의성이 높지만 센서의 정확도와 보정 상태를 확인해야 합니다.</p></div>
          <div class="card"><h4>Arduino·Raspberry Pi</h4><p>저렴한 센서와 보드를 활용해 직접 측정 장치를 만들 수 있습니다. 다만 센서가 어떤 원리로 값을 내는지, 코드가 어떤 방식으로 데이터를 변환하는지 이해해야 합니다.</p></div>
        </div>
        <div class="note">센서값이 숫자로 나온다고 해서 항상 정확한 데이터는 아닙니다. 장비 스펙, 측정 범위, 최소 단위, 샘플링 간격, 캘리브레이션 여부를 함께 확인해야 합니다.</div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">연구노트</span><h3>수행 단계 연구노트 필수 기록</h3></div>
        <ul class="check-list">
          <li>실험 날짜, 시간, 장소, 참여자, 확인자를 적습니다.</li>
          <li>실험 환경: 온도, 습도, 조명, 전원 상태, 주변 조건을 기록합니다.</li>
          <li>재료명, 장비명, 모델명, 센서 설정값, 코드 버전, 데이터 파일명을 남깁니다.</li>
          <li>실험 중 발생한 돌발 상황과 수정 사항을 적습니다.</li>
          <li>실패한 결과도 삭제하지 말고 원인 추정과 함께 보관합니다.</li>
          <li>사진·영상·그래프를 찍었다면 파일명과 촬영 조건을 함께 적습니다.</li>
        </ul>
      </div>
    </section>

    <section class="manual-section" id="analysis">
      <div class="section-head"><span class="section-no">05</span><div><h2>자료 해석 및 분석</h2><p class="section-lead">데이터 분석은 그래프를 예쁘게 그리는 일이 아니라, 데이터가 어떤 근거로 어떤 결론을 말하는지 판단하는 과정입니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">데이터</span><h3>데이터의 의미</h3></div>
        <div class="grid-2">
          <div class="card"><h4>데이터는 실제 세계의 일부</h4><p>관찰·측정한 숫자, 기호, 텍스트, 그림, 사진, 음성 등이 데이터입니다. 데이터는 실제 현상을 반영하지만, 현상의 모든 것을 100% 담지는 못합니다.</p></div>
          <div class="card"><h4>표현 방식이 해석을 바꾼다</h4><p>같은 데이터도 일별 평균, 월별 합계, 변화율, 비율, 분포로 나타내면 다르게 보일 수 있습니다. 어떤 표현이 연구 질문에 맞는지 선택해야 합니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">전처리</span><h3>분석 전에 해야 할 데이터 정리</h3></div>
        <ul class="check-list">
          <li>결측치가 있는지 확인하고, 삭제할지 대체할지 기준을 정합니다.</li>
          <li>단위가 서로 다르면 비교가 왜곡될 수 있으므로 단위와 스케일을 맞춥니다.</li>
          <li>이상값이 실험 오류인지 의미 있는 특이값인지 연구노트와 대조합니다.</li>
          <li>사진, 영상, 텍스트도 컴퓨터 비전·자연어 처리로 분석 가능한 데이터가 될 수 있습니다.</li>
          <li>분석에 실제로 필요한 특징값을 추출하는 과정을 피처 엔지니어링이라고 볼 수 있습니다.</li>
          <li>그래프에는 축 이름, 단위, 범례, 추세선, 측정 조건을 명확히 표시합니다.</li>
        </ul>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">통계</span><h3>자주 쓰는 통계 방법의 의미</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>방법</th><th>언제 쓰는가</th><th>핵심 의미</th><th>주의할 점</th></tr></thead>
            <tbody>
              <tr><td>기술 통계</td><td>데이터의 전체 모습을 요약할 때</td><td>평균, 중앙값, 최빈값, 분산, 표준편차로 데이터 분포를 설명합니다.</td><td>평균만 보면 이상값이나 분포의 치우침을 놓칠 수 있습니다.</td></tr>
              <tr><td>t검정</td><td>두 집단 평균 차이를 비교할 때</td><td>두 집단 사이 차이가 우연인지 의미 있는 차이인지 판단합니다.</td><td>정규분포 가정 등 기본 조건을 확인해야 합니다.</td></tr>
              <tr><td>분산분석</td><td>셋 이상 집단 또는 여러 조건을 비교할 때</td><td>집단 간 평균과 분산 차이가 유의미한지 살핍니다.</td><td>독립변인 수에 따라 일원·이원·다원 분석이 달라집니다.</td></tr>
              <tr><td>상관분석</td><td>두 변수의 선형 관계를 볼 때</td><td>X가 커질수록 Y도 커지는지 또는 작아지는지 관계의 방향과 정도를 봅니다.</td><td>상관관계가 인과관계를 뜻하지는 않습니다.</td></tr>
              <tr><td>회귀분석</td><td>변수 사이 관계식을 만들거나 예측할 때</td><td>독립변수와 종속변수의 관계를 수식으로 표현합니다.</td><td>식이 잘 맞는 것처럼 보여도 과적합이나 해석 오류를 주의해야 합니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>데이터 해석을 돕는 사례 모음</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>로봇 관절 데이터</h4><p>사람의 팔 움직임을 모두 기록하려면 근육, 피부, 관절, 회전, 힘의 변화까지 고려해야 합니다. 실제 연구에서는 관절을 하나의 강체로 단순화해 각도나 각속도만 측정할 수 있습니다. 즉 데이터는 실제 세계를 줄여 표현한 것이므로, 무엇을 생략했는지 함께 설명해야 합니다.</p></div>
          <div class="example-card"><h4>케플러와 행성 위치 데이터</h4><p>같은 행성 위치 자료라도 원형 궤도라고 해석할 수도 있고, 타원 궤도라는 새로운 모형으로 해석할 수도 있습니다. 데이터 분석은 계산만 하는 일이 아니라, 자료가 어떤 모형을 더 잘 설명하는지 판단하는 과정입니다.</p></div>
          <div class="example-card"><h4>일별 기온과 폭염일수</h4><p>일별 평균기온 그래프만 보면 변화가 약해 보일 수 있지만, 월별 폭염일수로 표현하면 더위의 증가 경향이 잘 드러날 수 있습니다. 같은 데이터도 표현 기준에 따라 결론의 초점이 달라집니다.</p></div>
          <div class="example-card"><h4>몬티 홀 문제와 조건부 확률</h4><p>새 정보가 주어지면 기존 확률 판단이 바뀔 수 있습니다. 과학 연구에서도 데이터가 추가될 때 기존 가설을 수정하거나 새로운 가설을 검토하는 태도가 필요합니다.</p></div>
          <div class="example-card"><h4>식물군 t검정 사례</h4><p>빛을 차단한 식물군과 그렇지 않은 식물군의 키 평균을 비교할 때 t검정을 쓸 수 있습니다. 단, 두 집단이 정규분포에 가깝다는 조건을 검토해야 하며, 조건을 모르고 통계 버튼만 누르면 잘못된 결론이 나올 수 있습니다.</p></div>
          <div class="example-card"><h4>회귀분석 사례</h4><p>해양 생물의 수명을 수온, 일조량, 포식자 수와 연결해 식으로 나타내는 것이 회귀분석의 예입니다. 식이 만들어졌다고 끝나는 것이 아니라, 실제 관측값과 예측값의 차이인 잔차를 확인해야 합니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">모형</span><h3>시뮬레이션·피팅·오차</h3></div>
        <div class="grid-3">
          <div class="card"><h4>시뮬레이션</h4><p>이론이나 모형으로 실제 실험 전에 경향을 예측하는 방법입니다. Python, 공개 라이브러리, 물리 시뮬레이터 등을 활용할 수 있습니다.</p></div>
          <div class="card"><h4>동영상 분석</h4><p>Tracker 같은 도구로 위치, 속도, 각속도 등을 분석할 수 있습니다. 프레임 수, 카메라 위치, 왜곡을 고려해야 합니다.</p></div>
          <div class="card"><h4>데이터 피팅</h4><p>실험값과 이론값이 얼마나 잘 맞는지 추세선과 잔차로 확인합니다. MAE, MSE, RMSE 같은 지표로 오차를 비교할 수 있습니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">오차</span><h3>정확도·정밀도와 오차 분석</h3></div>
        <div class="grid-2">
          <div class="card"><h4>정확도와 정밀도</h4><p>정확도는 관측값이 참값에 얼마나 가까운가, 정밀도는 반복 측정값들이 서로 얼마나 비슷한가를 뜻합니다. 정확하지만 흩어질 수도 있고, 정밀하지만 한쪽으로 치우칠 수도 있습니다.</p></div>
          <div class="card"><h4>우연 오차와 계통 오차</h4><p>우연 오차는 불규칙하게 발생하며 반복 측정으로 줄일 수 있습니다. 계통 오차는 장비, 환경, 측정자 습관 등 특정 원인으로 한쪽 방향으로 생기며 보정이 필요합니다.</p></div>
        </div>
        <div class="note">측정값은 유효숫자를 지켜 표현해야 합니다. 불확실도는 보통 한 자리 유효숫자로 나타내고, 대표값은 불확실도와 같은 소수점 자리까지 맞추는 것이 좋습니다.</div>
      </div>
    </section>

    <section class="manual-section" id="conclusion">
      <div class="section-head"><span class="section-no">06</span><div><h2>연구에서의 결론 도출</h2><p class="section-lead">결론은 결과의 반복 요약이 아니라, 처음의 연구 질문에 대해 근거를 바탕으로 답을 내리는 부분입니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">검증</span><h3>가설 검증과 의미 해석</h3></div>
        <div class="grid-2">
          <div class="card"><h4>예상과 달라도 연구는 의미 있다</h4><p>가설이 맞지 않아도 연구가 실패한 것은 아닙니다. 왜 다른 결과가 나왔는지, 어떤 변인이 영향을 주었는지 분석하면 새로운 연구 문제가 됩니다.</p></div>
          <div class="card"><h4>근거가 결론의 힘이다</h4><p>가설을 채택하거나 기각할 때는 데이터, 통계 결과, 오차 범위, 선행연구와의 비교를 함께 제시해야 합니다.</p></div>
        </div>
        <div class="note">통계 검정을 사용할 때는 유의수준, 오차 크기, 이전 연구와의 비교를 함께 고려합니다. 숫자가 나왔다고 자동으로 결론이 되는 것은 아닙니다.</div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">작성</span><h3>결론 작성 원칙</h3></div>
        <ul class="check-list">
          <li>가능한 한 간단명료하게 진술합니다.</li>
          <li>가설을 지지하거나 반박하는 실험 결과를 핵심만 정리합니다.</li>
          <li>수집한 결과에 근거하고 과도한 예측이나 추측은 피합니다.</li>
          <li>결과와 결론을 같은 말로 반복하지 않고, 결과에서 논리적으로 추론한 답을 제시합니다.</li>
          <li>서론과 본론에서 다루지 않은 새로운 내용을 결론에서 갑자기 말하지 않습니다.</li>
          <li>연구의 한계와 오차 원인을 솔직하게 제시합니다.</li>
        </ul>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>후속 연구를 찾는 방법</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>물병 세우기 연구의 확장</h4><p>물이 든 플라스틱 병을 회전시켜 세우는 과정을 분석했다면, 연구가 끝난 뒤 다른 병의 모양, 물의 양, 회전 속도, 병 재질을 바꾸면 어떻게 달라지는지 예측할 수 있습니다. 기존 결과를 다른 조건에 적용해 보는 것이 후속 연구의 출발점입니다.</p></div>
          <div class="example-card"><h4>연구의 가치는 ‘몇 걸음 나아갔는가’</h4><p>학생 연구 하나로 완벽한 법칙을 만드는 것은 어렵습니다. 하지만 선행연구와 비교해 더 넓은 조건을 검토했거나, 더 정확한 측정 방법을 제안했거나, 새로운 변수의 영향을 발견했다면 충분히 의미 있는 연구입니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">확장</span><h3>후속 연구와 연구의 가치</h3></div>
        <div class="grid-3">
          <div class="card"><h4>다른 조건으로 적용</h4><p>이번 실험에서 쓰지 않은 재료, 범위, 환경으로 확장하면 어떤 결과가 나올지 예측할 수 있습니다.</p></div>
          <div class="card"><h4>한계 개선</h4><p>측정 장비, 반복 횟수, 통제 조건, 분석 방법이 부족했다면 이를 개선하는 것이 다음 연구의 목적이 됩니다.</p></div>
          <div class="card"><h4>선행연구와 비교</h4><p>내 연구가 기존 연구와 얼마나 부합하는지, 어떤 점을 새롭게 보여주는지 객관적으로 설명해야 연구 가치가 드러납니다.</p></div>
        </div>
        <div class="note">좋은 결론은 “완벽한 법칙을 발견했다”가 아니라 “기존 연구보다 어떤 조건, 어떤 방법, 어떤 결과에서 한 걸음 나아갔다”를 설명하는 것입니다.</div>
      </div>
    </section>

    <section class="manual-section" id="writing">
      <div class="section-head"><span class="section-no">07</span><div><h2>글쓰기 및 발표</h2><p class="section-lead">아무리 좋은 연구라도 글과 발표로 남기지 않으면 연구의 가치가 제대로 전달되지 않습니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">보고서</span><h3>과학 연구 보고서의 기본 구성</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>구성</th><th>역할</th><th>작성 팁</th></tr></thead>
            <tbody>
              <tr><td>제목</td><td>연구의 대상, 방법, 범위, 특성을 드러냅니다.</td><td>독자가 제목만 보고도 어떤 연구인지 알 수 있게 씁니다.</td></tr>
              <tr><td>요약문</td><td>연구목적, 방법, 결과, 분석, 결론을 압축합니다.</td><td>보통 500~1000자 정도로 전체 연구가 드러나게 씁니다.</td></tr>
              <tr><td>서론</td><td>연구의 필요성, 가치, 범위, 선행연구, 차별성을 설명합니다.</td><td>넓은 배경에서 세부 연구 문제로 좁혀 들어갑니다.</td></tr>
              <tr><td>연구방법</td><td>실험 장치, 환경, 절차, 변수, 데이터 신뢰성을 설명합니다.</td><td>다른 사람이 재현할 수 있을 정도로 구체적으로 씁니다.</td></tr>
              <tr><td>결과 및 분석</td><td>실험 결과를 보여주고 경향, 상관관계, 원인을 해석합니다.</td><td>그래프 설명 → 그래프 해석 → 해석 논의 순서가 효과적입니다.</td></tr>
              <tr><td>결론</td><td>연구 질문에 대한 자신의 답과 연구의 의미를 정리합니다.</td><td>본문에서 다루지 않은 새 주장을 추가하지 않습니다.</td></tr>
              <tr><td>참고문헌</td><td>인용한 문헌과 자료를 정리합니다.</td><td>출처 표기 누락은 연구 윤리 문제입니다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">초고</span><h3>1페이지 초고로 글의 뼈대 만들기</h3></div>
        <div class="grid-2">
          <div class="card"><h4>왜 필요한가</h4><p>보고서는 길고 복잡해지기 쉽습니다. 1~2쪽 분량의 짧은 초고를 먼저 만들면 연구의 논리 흐름을 잃지 않고 작성할 수 있습니다.</p></div>
          <div class="card"><h4>무엇을 쓰는가</h4><p>연구 목적, 방법, 주요 결과, 결과 해석, 결론을 문장과 계층 구조로 정리합니다. 이후 요약문과 결론 작성에도 활용됩니다.</p></div>
        </div>
      </div>

      <div class="block">
        <div class="block-title"><span class="pill">원본 사례</span><h3>보고서와 발표를 이해하는 사례</h3></div>
        <div class="example-grid">
          <div class="example-card"><h4>야구배트 sweet spot 초록 사례</h4><p>원본 매뉴얼은 야구배트의 이론적 sweet spot과 실험으로 얻은 sweet spot을 비교한 학생 연구 초록을 예시로 듭니다. 좋은 초록은 연구 목적, 실험 범위와 방법, 주요 변수, 핵심 결과, 활용 가능성을 짧게 모두 보여줍니다.</p></div>
          <div class="example-card"><h4>AFM 탐침 제작 서론 사례</h4><p>원자현미경 탐침을 학교나 연구실에서 제작할 수 있는 방법을 개발한 사례는, 서론만 읽어도 ‘왜 필요한지’, ‘어떤 방법을 쓸 것인지’, ‘기존 방식과 무엇이 다른지’가 드러나야 한다는 점을 보여줍니다.</p></div>
          <div class="example-card"><h4>뉴턴과 후크 논쟁</h4><p>과학자의 업적은 글로 남고, 글을 통해 주장과 근거가 검토됩니다. 연구 보고서는 단순 제출물이 아니라 내 연구의 증거를 남기는 공식적인 기록입니다.</p></div>
          <div class="example-card"><h4>솔베이 회의와 질의응답</h4><p>연구 발표는 연구를 자랑하는 시간이 아니라 질문과 비판을 통해 연구를 보완하는 과정입니다. 어려운 질문을 받았을 때 방어적으로 대응하기보다, 한계와 개선 방향을 차분히 설명하는 태도가 중요합니다.</p></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">표현</span><h3>결과와 그래프를 쓰는 법</h3></div>
        <ul class="check-list">
          <li>그래프에는 x축, y축, 단위, 범례, 추세선 의미를 명확히 적습니다.</li>
          <li>그래프 설명에는 실험방법을 반복하지 말고, 그래프가 보여주는 목적과 읽는 방법을 씁니다.</li>
          <li>그래프 해석에서는 데이터가 보여주는 상관관계와 경향을 객관적으로 나열합니다.</li>
          <li>논의에서는 그 경향이 과학적으로 타당한지, 선행연구와 어떤 관련이 있는지 설명합니다.</li>
          <li>몇 개의 핵심 그래프는 서로 모순되지 않는 하나의 큰 논지로 연결되어야 합니다.</li>
          <li>실험 장치는 사진보다 개념도, 실험 조건은 표, 절차는 순서도, 데이터는 그래프가 효과적입니다.</li>
        </ul>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">발표</span><h3>과학 연구 발표 준비</h3></div>
        <div class="grid-3">
          <div class="card"><h4>시간 배분</h4><p>발표 시간은 반드시 지킵니다. 20분 발표라면 15분 발표와 5분 질의응답처럼 질문 시간을 남기는 구성이 좋습니다.</p></div>
          <div class="card"><h4>슬라이드 분량</h4><p>이공학 발표에서는 1분당 1쪽 내외가 적당합니다. 20분이면 최대 20쪽 정도를 기준으로 조정합니다.</p></div>
          <div class="card"><h4>대본 분량</h4><p>1분당 약 100단어 수준으로 대본을 준비하되, 실제 발표는 문장 암기보다 핵심 키워드 중심으로 진행합니다.</p></div>
        </div>
        <div class="table-wrap" style="margin-top:12px">
          <table>
            <thead><tr><th>슬라이드 구성</th><th>권장 분량</th><th>내용</th></tr></thead>
            <tbody>
              <tr><td>표지</td><td>1쪽</td><td>연구 제목, 발표자, 소속, 발표회 이름, 발표일</td></tr>
              <tr><td>목차</td><td>1쪽</td><td>발표 흐름을 간단히 안내</td></tr>
              <tr><td>서론</td><td>2~3쪽</td><td>연구 분야의 이슈, 핵심 문헌, 문제 상황</td></tr>
              <tr><td>동기·목적</td><td>1~2쪽</td><td>세부 연구 질문, 가설, 연구 목적</td></tr>
              <tr><td>실험 방법·이론</td><td>2~4쪽</td><td>장치, 절차, 변수, 데이터 가공, 신뢰성</td></tr>
              <tr><td>결과 및 분석</td><td>10쪽 이상</td><td>핵심 그래프, 발견한 경향, 과학적 설명</td></tr>
              <tr><td>결론</td><td>1쪽</td><td>밝혀낸 사실을 4~5문장으로 압축</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">태도</span><h3>발표 자료와 질의응답 유의사항</h3></div>
        <ul class="check-list">
          <li>표와 그림에는 출처, 범례, 축 이름, 단위를 빠뜨리지 않습니다.</li>
          <li>한 슬라이드에는 하나의 주장만 담고, 하단에 핵심 문장을 넣으면 이해가 쉬워집니다.</li>
          <li>대본을 완성한 뒤 반드시 소리 내어 읽어 시간을 확인합니다.</li>
          <li>긴장하면 말이 빨라지므로 실제 발표 시간보다 약간 여유 있게 연습합니다.</li>
          <li>대본 전체를 외우기보다 키워드 순서와 어려운 용어를 손노트로 준비합니다.</li>
          <li>질의응답에서는 방어적으로 반응하지 말고 질문 의도를 듣고 메모합니다.</li>
          <li>4:3 빔프로젝터에서는 4:3 비율 자료가 안정적이고, 최소 글자 크기는 12pt 이상을 권장합니다. 16:10 화면에서는 14pt 이상이 좋습니다.</li>
          <li>특수 폰트, 동영상, 음향 파일은 발표장 컴퓨터에서 사전에 열어 보고 확인합니다.</li>
        </ul>
      </div>
    </section>

    <section class="manual-section" id="checklist">
      <div class="section-head"><span class="section-no">✓</span><div><h2>학생용 빠른 체크리스트</h2><p class="section-lead">연구를 시작하거나 보고서를 제출하기 전, 아래 항목만 확인해도 탐구의 완성도를 크게 높일 수 있습니다.</p></div></div>
      <div class="block">
        <div class="block-title"><span class="pill">시작 전</span><h3>연구 문제 체크</h3></div>
        <ul class="check-list">
          <li>내 질문은 실험·조사·측정·분석으로 답할 수 있는가?</li>
          <li>선행연구와 비교했을 때 다른 점이 있는가?</li>
          <li>고등학생 수준, 학교 장비, 정해진 기간 안에서 가능한가?</li>
          <li>연구 결과가 실생활, 진로, 교과 개념과 연결되는가?</li>
          <li>안전·윤리 문제가 없는가?</li>
          <li>측정할 종속변인을 수치로 정했는가?</li>
        </ul>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">계획서</span><h3>연구계획서 빠른 양식</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>항목</th><th>학생이 채워야 할 문장</th></tr></thead>
            <tbody>
              <tr><td>연구 제목</td><td>본 연구는 [대상]에서 [방법/조건]에 따른 [결과값]의 변화를 분석한다.</td></tr>
              <tr><td>연구 동기</td><td>[생활/수업/진로]에서 발견한 문제 때문에 이 주제를 선택하였다.</td></tr>
              <tr><td>연구 문제</td><td>[조작변인]을 변화시키면 [종속변인]은 어떻게 달라지는가?</td></tr>
              <tr><td>가설</td><td>[조작변인]이 증가/감소하면 [종속변인]은 증가/감소할 것이다.</td></tr>
              <tr><td>연구 방법</td><td>[재료/장비]를 이용하여 [조건]을 바꾸고 [반복 횟수]만큼 측정한다.</td></tr>
              <tr><td>분석 방법</td><td>측정값을 표와 그래프로 정리하고, 평균/오차/상관관계/회귀식 등을 이용해 해석한다.</td></tr>
              <tr><td>기대효과</td><td>이 연구는 [문제 해결/개선/후속 연구/진로 연계]에 활용될 수 있다.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">수행</span><h3>실험·분석 체크</h3></div>
        <div class="grid-2">
          <div class="card"><h4>실험 체크</h4><ul><li>조작변인과 통제변인을 구분했는가?</li><li>반복 측정 횟수가 충분한가?</li><li>장비 최소 단위와 불확실도를 기록했는가?</li><li>실험 환경과 돌발 상황을 기록했는가?</li></ul></div>
          <div class="card"><h4>분석 체크</h4><ul><li>축 이름, 단위, 범례가 있는 그래프인가?</li><li>이상값과 결측치를 어떻게 처리했는가?</li><li>평균뿐 아니라 분포와 오차도 확인했는가?</li><li>결과 해석이 데이터 근거와 연결되는가?</li></ul></div>
        </div>
      </div>
      <div class="block">
        <div class="block-title"><span class="pill">제출 전</span><h3>보고서·발표 최종 점검</h3></div>
        <ul class="check-list">
          <li>제목만 보고도 연구 대상과 방법이 드러나는가?</li>
          <li>요약문에 목적, 방법, 결과, 결론이 모두 들어갔는가?</li>
          <li>서론에 선행연구와 차별성이 나타나는가?</li>
          <li>연구방법을 다른 사람이 재현할 수 있을 정도로 썼는가?</li>
          <li>결과와 결론을 반복하지 않고, 결론은 질문에 대한 답으로 썼는가?</li>
          <li>참고문헌과 그림·표 출처를 빠뜨리지 않았는가?</li>
          <li>발표 자료는 한 장에 한 주장으로 구성했는가?</li>
          <li>질의응답 예상 질문과 한계 설명을 준비했는가?</li>
        </ul>
        <div class="tag-row"><span class="tag">주제</span><span class="tag">가설</span><span class="tag">변인</span><span class="tag">통제</span><span class="tag">측정</span><span class="tag">오차</span><span class="tag">그래프</span><span class="tag">결론</span><span class="tag">출처</span><span class="tag">후속연구</span></div>
      </div>
    </section>
  </main>
</div>

<script>
class RneManualElement extends HTMLElement {
  connectedCallback() {
    if (this.shadowRoot) return;
    const root = this.attachShadow({mode:'open'});
    root.appendChild(document.getElementById('rneManualTemplate').content.cloneNode(true));
    const tabs = Array.from(root.querySelectorAll('.manual-tab'));
    const sections = Array.from(root.querySelectorAll('.manual-section'));
    const scrollActiveSection = section => {
      const mainOffset = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--main-sticky-offset')) || 10;
      const menu = root.querySelector('.menu-wrap');
      const menuHeight = menu && getComputedStyle(menu).position === 'sticky' ? menu.getBoundingClientRect().height : 0;
      const targetTop = window.scrollY + section.getBoundingClientRect().top - mainOffset - menuHeight - 10;
      window.scrollTo({top:Math.max(0, targetTop), behavior:'smooth'});
    };
    const showSection = (id, doScroll = true) => {
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.target === id));
      sections.forEach(section => section.classList.toggle('active', section.id === id));
      const activeSection = sections.find(section => section.id === id);
      if (doScroll && activeSection) requestAnimationFrame(() => scrollActiveSection(activeSection));
    };
    tabs.forEach(tab => tab.addEventListener('click', () => showSection(tab.dataset.target)));
    showSection('foundation', false);
  }
}

    let books = [];
    let activeCategory = '공학';
    const finder = root.querySelector('.finder');

    const updateStickyOffset = () => {
      const finderHeight = Math.ceil(finder?.getBoundingClientRect().height || 0);
      this.style.setProperty('--finder-sticky-height', finderHeight + 'px');
    };
    if ('ResizeObserver' in window && finder) new ResizeObserver(updateStickyOffset).observe(finder);
    window.addEventListener('resize', updateStickyOffset, {passive:true});

    const escapeBookHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const cleanText = value => value.replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
    const parseBookMarkdown = markdown => markdown.split(/\r?\n/).reduce((items, line) => {
      if (!line.trim().startsWith('|')) return items;
      const cells = line.split('|').slice(1, -1).map(cleanText);
      if (cells.length !== 5 || /^-+$/.test(cells[0])) return items;
      items.push({category:cells[0],title:cells[1],author:cells[2],publisher:cells[3],year:cells[4]});
      return items;
    }, []);

    const renderBooks = () => {
      const rows = books.filter(book => book.category === activeCategory);
      root.getElementById('resultStatus').textContent = activeCategory + ' 분야 도서 목록이 표시되었습니다.';
      if (!rows.length) {
        root.getElementById('resultArea').innerHTML = '<div class="state"><strong>표시할 도서가 없습니다.</strong>다른 분야를 선택해 보세요.</div>';

        '</tr></thead><tbody>' + rows.map(book =>           '<tr><td class="field" data-label="분야"><span class="field-tag cell-value">' + escapeBookHtml(book.category) + '</span></td>' +
          '<td class="title" data-label="도서명"><span class="cell-value" title="' + escapeBookHtml(book.title) + '">' + escapeBookHtml(book.title) + '</span></td>' +
          '<td class="author" data-label="저자"><span class="cell-value" title="' + escapeBookHtml(book.author) + '">' + escapeBookHtml(book.author) + '</span></td>' +
          '<td class="publisher" data-label="출판사"><span class="cell-value">' + escapeBookHtml(book.publisher) + '</span></td>' +
          '<td class="year" data-label="출판연도"><span class="cell-value">' + escapeBookHtml(book.year) + '</span></td></tr>'
        ).join('') + '</tbody></table></div>';
    };

    const renderCategories = () => {
      const categories = [...new Set(books.map(book => book.category))];
      root.getElementById('categoryList').innerHTML = categories.map(category =>         '<button class="category-btn ' + (category === activeCategory ? 'active' : '') + '" type="button" data-category="' + escapeBookHtml(category) + '" aria-pressed="' + (category === activeCategory) + '">' + escapeBookHtml(category) + '</button>'
      ).join('');
      root.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click', () => {
        activeCategory = button.dataset.category;
        renderCategories();
        renderBooks();
        requestAnimationFrame(() => {
          const resultPanel = root.querySelector('.result-panel');
          if (!resultPanel) return;
          const mainOffset = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--main-sticky-offset')) || 10;
          const finderHeight = finder && getComputedStyle(finder).position === 'sticky' ? finder.getBoundingClientRect().height : 0;
          const targetTop = window.scrollY + resultPanel.getBoundingClientRect().top - mainOffset - finderHeight - 10;
          window.scrollTo({top:Math.max(0, targetTop), behavior:'smooth'});
        });
      }));
      requestAnimationFrame(updateStickyOffset);
    };

    try {
      const bytes = Uint8Array.from(atob(BOOKS_MARKDOWN_BASE64), character => character.charCodeAt(0));
      books = parseBookMarkdown(new TextDecoder('utf-8').decode(bytes));
      if (!books.length) throw new Error('도서 데이터 없음');
      renderCategories();
      renderBooks();
    } catch (error) {
      root.getElementById('resultStatus').textContent = '도서 목록을 불러오지 못했습니다.';
      root.getElementById('resultArea').innerHTML = '<div class="state"><strong>도서 목록을 불러오지 못했습니다.</strong>페이지를 새로고침해 주세요.</div>';
      console.error(error);
    }
  }
}

if (!customElements.get('rne-manual')) customElements.define('rne-manual', RneManualElement);
if (!customElements.get('book-catalog')) customElements.define('book-catalog', BookCatalogElement);

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function highlightTags(text) {
  return escapeHtml(text).replace(/\[(총평|수업|호기심|탐구|심화탐구|평가)\]/g, '<span class="tag">[$1]</span>');
}

function updateMainStickyOffset() {
  const tabWrap = document.querySelector('.global-topbar') || document.querySelector('.tab-wrap');
  if (!tabWrap) return;
  const styles = getComputedStyle(tabWrap);
  const isSticky = styles.position === 'sticky';
  const top = Number.parseFloat(styles.top) || 0;
  const offset = isSticky ? Math.ceil(top + tabWrap.getBoundingClientRect().height + 10) : 10;
  document.documentElement.style.setProperty('--main-sticky-offset', offset + 'px');
}

function scrollBelowSticky(element, secondaryMenu) {
  if (!element) return;
  const mainOffset = Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--main-sticky-offset')) || 10;
  const secondaryHeight = secondaryMenu && getComputedStyle(secondaryMenu).position === 'sticky' ? secondaryMenu.getBoundingClientRect().height : 0;
  const targetTop = window.scrollY + element.getBoundingClientRect().top - mainOffset - secondaryHeight - 10;
  window.scrollTo({top:Math.max(0, targetTop), behavior:'smooth'});
}

window.addEventListener('resize', updateMainStickyOffset, {passive:true});
if ('ResizeObserver' in window) new ResizeObserver(updateMainStickyOffset).observe(document.querySelector('.global-topbar') || document.querySelector('.tab-wrap'));

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = ORDER.map(name => {
    const gptLink = COMPETITION_GPT_LINKS[name];
    return `
      <div class="tab-menu-item${gptLink ? ' has-submenu' : ''}">
        <button class="tab ${name === current ? 'active' : ''}" type="button" data-tab="${escapeHtml(name)}"
          aria-pressed="${name === current}"${gptLink ? ' aria-haspopup="true"' : ''}>
          <span class="tab-full">${escapeHtml(name)}</span><span class="tab-short">${escapeHtml(SHORT_LABELS[name] || name)}</span>${gptLink ? '<span class="tab-caret" aria-hidden="true">▼</span>' : ''}
        </button>
        ${gptLink ? `
          <div class="tab-submenu" role="menu">
            <a class="tab-submenu-link" role="menuitem" href="${gptLink.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(gptLink.label)}</a>
          </div>` : ''}
      </div>`;
  }).join('');
  tabs.querySelectorAll('button.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      current = btn.dataset.tab;
      const url = new URL(window.location.href);
      url.searchParams.set('tab', TAB_KEYS[current] || 'guide');
      window.history.replaceState(null, '', url);
      renderTabs();
      renderContent();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  });
  requestAnimationFrame(updateMainStickyOffset);
}

    <table class="type-check-table">
      <thead>
        <tr><th>유형</th><th>탐구 흐름</th><th>설명</th><th>점검 포인트</th></tr>
      </thead>
      <tbody>
        ${TYPE_GUIDE.map(item => `
          <tr>
            <td class="type-no">유형 ${item.no}</td>
            <td class="type-title">${escapeHtml(item.title)}</td>
            <td>${escapeHtml(item.text)}</td>
            <td class="type-note-cell">${escapeHtml(item.note)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div class="type-summary">
      <span>유형 1·2: 진정성 있는 탐구 성장 기록</span>
      <span>유형 3·4: 신뢰도 저하 요인이므로 기재 지양 필요</span>
    </div>`;
}

function selfEvalTable() {
  const rows = SELF_EVAL_ROWS.map(row => `
      <tr>
        <td class="num">${row.no}</td>
        <td class="fill">${escapeHtml(row.fill)}</td>
        <td class="template">${row.template}</td>
      </tr>`).join('');

  return `
    <table class="selfeval-table">
      <thead>
        <tr><th>번호</th><th>채울 내용</th><th>자연스럽게 이어 쓰는 문장 틀</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="selfeval-note">
      <strong>작성 흐름:</strong> 수업에서 배운 내용에서 출발해 관심과 궁금증을 만들고, 자료를 활용해 문제를 해결한 뒤, 마지막에는 자신의 성장과 진로 관심으로 연결한다.
      <div class="selfeval-flow">
        <span>배운 내용</span><span>관심과 질문</span><span>자료 활용</span><span>알게 된 점</span><span>성장과 진로 연결</span>
      </div>
    </div>`;
}

function renderGuide() {
  return `
    <section class="guide-hero">
      <div class="guide-title"><span class="guide-badge">✓</span><h2>탐구 활동 가이드</h2><span class="mobile-guide-action-group"><a class="mobile-guide-action-btn guide-report-btn" href="https://lhacoding.github.io/isaem-robot/tamgu" target="_blank" rel="noopener">탐구보고서 작성</a></span></div>

      <div class="guide-block">
        <div class="block-heading flow-heading"><span class="pill">탐구흐름</span><h3>탐구 주제를 확장하는 5단계 흐름</h3><span class="guide-action-group"><a class="guide-action-btn guide-report-btn" href="https://lhacoding.github.io/isaem-robot/tamgu" target="_blank" rel="noopener">탐구보고서 작성하러 가기</a></span></div>
        <div class="flow-row">
          ${GUIDE_STEPS.map(step => `
            <article class="flow-card">
              <div class="flow-no">${step.no}</div>
              <h4>${escapeHtml(step.title)}</h4>
              <p>${escapeHtml(step.text)}</p>
            </article>`).join('')}
        </div>
      </div>

      <div class="guide-block">
        <div class="block-heading table-align-heading"><span class="pill">탐구구조</span><h3>학생부를 강하게 만드는 탐구 구조</h3></div>
        <table class="frame-table">
          <thead><tr><th>단계</th><th>핵심 기능</th><th>주요 키워드</th></tr></thead>
          <tbody>${FRAME_ROWS.map(row => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td></tr>`).join('')}</tbody>
        </table>
      </div>

      <div class="guide-block">
        <div class="block-heading"><span class="pill">자기평가서</span><h3>자기평가서 내용 채우기</h3></div>
        ${selfEvalTable()}
      </div>

      <div class="guide-block">
        <div class="block-heading"><span class="pill">핵심키워드 20개</span><h3>중상위권 대학교가 선호하는 표현</h3></div>
        ${keywordGrid(CORE_KEYWORDS)}
      </div>

      <div class="guide-block">
        <div class="block-heading"><span class="pill">탐구키워드 40개</span><h3>탐구 과정에 활용하기 좋은 표현</h3></div>
        ${keywordGrid(THINKING_KEYWORDS)}
      </div>

      <div class="guide-block">
        <div class="block-heading"><span class="pill">유형 진단</span><h3>탐구 과정의 성장 흐름 점검하기</h3></div>
        ${typeGuideGrid()}
      </div>
    </section>`;
}

function renderExamples() {
  const rows = DATA.filter(item => item.category === currentSubject);
  const cards = rows.map(item => `
    <article class="card">
      <div class="card-head">
        <h3 class="card-title">${escapeHtml(item.title)}</h3>
        ${item.source ? `<div class="card-source">${escapeHtml(item.source)}</div>` : ''}
      </div>
      <div class="card-body">${highlightTags(item.text)}</div>
    </article>
  `).join('');
  return `
    <div class="section-head embedded-section-title">
      <div class="section-title"><span class="section-badge">✓</span><h2>과목별 활동 사례</h2></div>
      <p class="section-meta">대학 입학전형 가이드북과 공개 자료를 바탕으로 탐구 구조와 활동 흐름을 살펴보기 위한 참고자료입니다.</p>
    </div>
    <div class="subject-tabs" aria-label="활동 사례 과목 선택">
      ${SUBJECT_ORDER.map(subject => `<button class="subject-tab ${subject === currentSubject ? 'active' : ''}" type="button" data-subject="${escapeHtml(subject)}" aria-pressed="${subject === currentSubject}">${escapeHtml(subject)}</button>`).join('')}
    </div>
    <div class="section-head compact-subtitle" id="subjectContentTop"><div class="section-title"><span class="section-badge">✓</span><h2>${escapeHtml(currentSubject)} 활동 사례</h2></div></div>
    <div class="cards">${cards}</div>`;
}

function renderManual() {
  return `
    <div class="section-head embedded-section-title">
      <div class="section-title"><span class="section-badge">✓</span><h2>R&amp;E 매뉴얼</h2></div>
    </div>
    <rne-manual></rne-manual>`;
}

function renderBooks() {
  return `
    <div class="section-head embedded-section-title">
      <div class="section-title"><span class="section-badge">✓</span><h2>분야별 추천 도서</h2></div>
    </div>
    <book-catalog></book-catalog>`;
}

function bindSubjectTabs() {
  document.querySelectorAll('[data-subject]').forEach(button => button.addEventListener('click', () => {
    currentSubject = button.dataset.subject;
    renderContent();
    requestAnimationFrame(() => scrollBelowSticky(document.getElementById('subjectContentTop'), document.querySelector('.subject-tabs')));
  }));
}

function renderContent() {
  const content = document.getElementById('content');
  const brandTitle = document.getElementById('brandTitle');
  if (brandTitle) brandTitle.textContent = current;
  if (current === 'R&E 매뉴얼') content.innerHTML = renderManual();
  else if (current === '활동 사례') content.innerHTML = renderExamples();
  else if (current === '추천 도서') content.innerHTML = renderBooks();
  else content.innerHTML = renderGuide();
  if (current === '활동 사례') bindSubjectTabs();
}

// 탐구보고서 GPT 링크 이동 보강
// 모바일에서는 새 창 차단/앱 내 브라우저 문제를 줄이기 위해 현재 창으로 이동하고,
// 컴퓨터 화면에서는 새 창으로 열리도록 target만 조정합니다. 기본 a 링크 이동은 막지 않습니다.
const REPORT_GUIDE_URL = 'https://lhacoding.github.io/isaem-robot/tamgu';
document.addEventListener('click', function(event){
  const link = event.target.closest('.guide-report-btn, .mobile-guide-report-btn, .heading-report-btn, .report-link-btn');
  if(!link || link.classList.contains('rne-manual-page-btn')) return;
  link.href = REPORT_GUIDE_URL;
  if (window.matchMedia('(max-width: 820px)').matches) {
    link.removeAttribute('target');
    link.removeAttribute('rel');
  } else {
    link.setAttribute('target', '_blank');
    link.setAttribute('rel', 'noopener');
  }
}, true);

renderTabs();
renderContent();
</script>
</body>
</html>
