<style>
:root{--ink:#123052;--muted:#62788d;--line:#dbe5ee;--bg:#f5f8fb;--white:#fff;--blue:#2476b9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #68a9f4;outline-offset:3px}.topbar{height:70px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:flex-start;background:#fff;border-bottom:1px solid #e3eaf0;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #1230520a}.brand{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:800}.brand b{color:var(--blue)}.wheel{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;background:conic-gradient(#e5243b 0 12%,#dda63a 0 24%,#4c9f38 0 36%,#26bde2 0 48%,#fcc30b 0 60%,#dd1367 0 72%,#0a97d9 0 84%,#19486a 0);border:4px solid #fff;box-shadow:0 0 0 1px #d9e2eb}.hero{max-width:1400px;margin:auto;padding:60px clamp(20px,6vw,88px) 30px;display:grid;grid-template-columns:1.12fr .88fr;gap:44px;align-items:center}.eyebrow{margin:0 0 14px;color:#2878b9;font-size:13px;font-weight:800;letter-spacing:.13em}.hero h1{margin:0;font-size:clamp(42px,3.7vw,56px);line-height:1.2;letter-spacing:-2.4px}.hero h1 span{color:var(--blue)}.intro{margin:20px 0 24px;color:#4d657b;font-size:18px;line-height:1.65}.hero-art{height:410px;border-radius:42% 42% 20% 20%;position:relative;background:radial-gradient(circle at 50% 42%,#fff 0 28%,#ffffff4d 29% 50%,transparent 51%),linear-gradient(#fafdff,#e4f0f2);overflow:hidden;box-shadow:inset 0 -35px 45px #558c7019}.robot{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:200px;height:280px}.head{position:absolute;left:40px;top:25px;width:120px;height:96px;border-radius:48% 48% 42% 42%;background:linear-gradient(145deg,#fff,#cbd8e2);border:2px solid #b8c8d3;box-shadow:0 14px 28px #16324f29}.face{position:absolute;inset:15px;background:#102c3e;border-radius:29px;display:flex;justify-content:center;align-items:center;gap:25px;color:#76d66c;font-size:30px}.face:before,.face:after{content:"";width:10px;height:17px;border-radius:10px;background:#76d66c;box-shadow:0 0 12px #58d767}.body{position:absolute;left:42px;top:132px;width:116px;height:103px;border-radius:31px;background:linear-gradient(145deg,#fff,#cbd8e2);border:2px solid #b8c8d3;display:grid;place-items:center;font-size:36px}.base{position:absolute;left:30px;bottom:7px;width:140px;height:48px;border-radius:50%;background:linear-gradient(#eef3f6,#aabcc9);box-shadow:0 14px 13px #16324f24}.orbit{position:absolute;width:290px;height:290px;border:1px dashed #bdd2df;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.art-label{position:absolute;bottom:24px;left:0;right:0;text-align:center;color:#58758c;font-size:13px;font-weight:700}.goal-area{max-width:1340px;margin:0 auto;background:#fff;border:1px solid #e1e8ee;border-radius:25px;padding:25px 30px;box-shadow:0 9px 28px #193d5e12}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:17px}.section-title span{font-size:11px;letter-spacing:.1em;font-weight:800;color:#2f78b4;background:#eaf4fc;padding:6px 8px;border-radius:6px}.section-title h2{font-size:22px;margin:0}.tabs{display:flex;overflow-x:auto;gap:10px;padding:4px 3px 12px;scrollbar-color:#bdd0df transparent}.tabs button{flex:0 0 126px;height:72px;border:1px solid #e0e7ed;border-radius:13px;background:#fff;display:grid;grid-template-columns:34px 24px 1fr;align-items:center;padding:10px;box-shadow:0 3px 9px #1230520a}.tabs button:hover{border-color:var(--goal)}.tabs button.on{border:2px solid var(--goal);background:color-mix(in srgb,var(--goal) 7%,white);box-shadow:0 6px 16px color-mix(in srgb,var(--goal) 18%,transparent)}.tabs .icon{width:34px;height:34px;display:grid;place-items:center;background:var(--goal);border-radius:7px}.tabs b{font-size:20px;color:var(--goal)}.ta @media(max-width:700px){.topbar{padding-inline:14px}.brand{font-size:15px;gap:8px}.wheel{width:34px;height:34px}.hero{padding:34px 16px 22px}.eyebrow{font-size:11px}.hero h1{font-size:35px;line-height:1.24}.intro{font-size:15px;margin:16px 0 19px}.hero-art{height:250px;margin-top:22px}.robot{transform:translate(-50%,-50%) scale(.8)}.orbit{width:230px;height:230px}.art-label{bottom:13px;font-size:11px}.goal-area{margin-inline:12px;padding:18px 12px;border-radius:19px}.section-title{align-items:flex-start}.section-title h2{font-size:17px;line-height:1.4}.tabs button{flex-basis:112px;height:68px}.ideas{margin-inline:14px;padding:32px 0 45px}.ideas-head>button{display:none}.goal-title>.badge{width:48px;height:48px}.goal-title h2{font-size:21px}.summary{margin-bottom:20px}.grid{gap:14px}.card{padding:18px;border-radius:17px}.card h3{font-size:20px}.more-wrap{padding-top:20px}.more{width:100%;min-height:48px}}@media(max-width:390px){.brand span:last-child{max-width:225px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero h1{font-size:32px}.goal-title h2{font-size:19px}}

<header class="topbar"><div class="brand"><span class="wheel">17</span><span><b>송도이샘로봇</b> SDGs 창작 아이디어 랩</span></div></header>
<main>
<section class="hero"><div><p class="eyebrow">SDGs 분야별 로봇 창작 아이디어 추천</p><h1>지속가능한 미래를 움직이는<br><span>로봇 창작 아이디어</span>를 찾아보세요</h1><p class="intro">관심 있는 지속가능발전목표를 선택하고, 센서와 모터를 활용해 해결할 수 있는 로봇 창작 주제를 탐색해 보세요.</p></div></section>
<section class="goal-area"><div class="section-title"><span>STEP 1</span><h2>해결할 SDGs 목표를 선택하세요</h2></div><div class="tabs" id="tabs"></div></section>
<section class="ideas"><div class="ideas-head"><div class="goal-title" id="goalTitle"></div></div><p class="summary" id="summary"></p><div class="grid" id="grid"></div><div class="more-wrap" id="moreWrap"><button class="more" id="moreButton">더보기 ↓</button></div></section>
</main>
<script>
const goals=[{"id":1,"title":"빈곤 종식","short":"빈곤","color":"#E5243B","icon":"🏠","summary":"취약계층의 생활 불편과 정보 격차를 줄이고 필요한 지원을 더 빠르게 연결합니다.","ideas":[{"title":"나눔 물품 분류 로봇","parts":"색상 센서·서보모터·LED·컨베이어 모터·서보 집게","impact":"기부 물품 정리 시간을 줄여 필요한 사람에게 더 빠르게 전달합니다.","description":"기부 물품에는 의류·생활용품·학용품을 구분하는 빨강·파랑·초록 스티커가 붙어 있습니다. 컨베이어 벨트로 물품을 옮기면 색상 센서가 스티커를 읽고, 로봇 집게가 물품을 잡아 해당 수거함에 담아 자동으로 분류합니다."},{"title":"무료급식 잔여량 알림 카트","parts":"무게 센서·바퀴 모터·부저","impact":"급식 부족과 낭비를 함께 줄여 안정적인 식사 지원을 돕습니다.","description":"무게 센서가 내용물의 무게를 계속 측정해 남은 양과 사용량을 계산합니다. 양쪽 구동 모터가 경로를 따라 전진하고, 장애물이 가까워지면 정지한 뒤 한쪽 바퀴만 돌려 피합니다. 부저는 주의일 때 짧게 한 번, 즉시 조치가 필요할 때 반복해서 울립니다."},{"title":"취약가정 난방 지킴이","parts":"온도 센서·LED·서보모터","impact":"추위에 취약한 가정의 안전과 에너지 비용 절감을 돕습니다.","description":"실내 온도 센서가 방 온도를 읽고 18℃ 아래 상태가 1분 이상 이어지는지 확인합니다. 작동 조건이 되면 서보모터가 연결된 문·판·팔을 목표 각도로 움직이고, 센서가 완료를 확인하면 처음 위치로 되돌립니다. LED는 정상은 초록, 확인 필요는 노랑, 즉시 조치는 빨강으로 표시합니다."},{"title":"생필품 공유함 관리 로봇","parts":"카메라·거리 센서·도어 서보·표시 LED","impact":"공유 물품의 품절을 줄이고 공정한 이용을 돕습니다.","description":"카메라가 선반의 물품 종류와 개수를 확인하고 거리 센서가 선반 앞의 남은 공간을 재고 입고·대여·반납 상태를 계산합니다. 사람이 가까이 있고 물품이 남아 있을 때 도어 서보가 문을 열며, 거리 센서에 손이 더 이상 감지되지 않으면 문을 닫습니다."},{"title":"이동형 디지털 안내 로봇","parts":"버튼·스피커·바퀴 모터","impact":"정보 부족 때문에 지원을 놓치는 문제를 줄입니다.","description":"사용자가 버튼·태그·마이크로 항목을 선택하면 제어기가 해당 번호와 준비된 안내 내용을 불러옵니다. 양쪽 구동 모터가 경로를 따라 전진하고, 장애물이 가까워지면 정지한 뒤 한쪽 바퀴만 돌려 피합니다. 목표 지점에서는 정확히 멈춰 운반·안내·측정 작업을 실행합니다. 작업 장소까지 바닥선을 따라 이동하고 초음파 센서에 장애물이 20cm 안으로 잡히면 멈춰 우회한 뒤 작업을 계속합니다."},{"title":"재난 구호품 운반 로봇","parts":"초음파 센서·라인 센서·DC모터","impact":"재난 때 취약계층에 구호품을 신속하게 전달합니다.","description":"앞쪽 거리 센서가 사람과 장애물까지의 거리를 재고 바닥 라인 센서가 이동 경로를 읽고 안전하게 이동할 조건을 정합니다. 양쪽 구동 모터가 경로를 따라 전진하고, 장애물이 가까워지면 정지한 뒤 한쪽 바퀴만 돌려 피합니다. 목표 지점에서는 정확히 멈춰 운반·안내·측정 작업을 실행합니다."},{"title":"공공 충전 나눔 스테이션","parts":"전류 센서·태양광 패널·표시창","impact":"통신기기 충전 접근성을 높여 디지털 소외를 줄입니다.","description":"전류·전압·조도·회전 센서가 생산되거나 사용되는 전력과 장치의 작동 여부를 측정합니다. 화면은 현재 측정값과 판단 결과, 사용자가 해야 할 다음 행동을 보여 줍니다."},{"title":"의류 기부 크기 분류기","parts":"버튼·컬러 센서·서보 게 function pageSize(){return window.innerWidth>1080?9:10}
state.visible=pageSize();
function activeGoal(){return goals.find(g=>g.id===state.goalId)||null}
function allRows(){const g=activeGoal();return g.ideas.map((idea,index)=>({g,idea,index}))}
function renderTabs(){$("#tabs").innerHTML=goals.map(g=>'<button class="'+(g.id===state.goalId?"on":"")+'" style="--goal:'+g.color+'" data-goal="'+g.id+'"><span class="icon">'+icon(g)+'</span><b>'+g.id+'</b><small>'+esc(g.short)+'</small></button>').join("")}
function card({g,idea,index}){return '<article class="card" style="--goal:'+g.color+'"><div class="card-top"><span class="num">'+String(index+1).padStart(2,"0")+'</span><span class="chip">SDG '+g.id+' · '+esc(g.short)+'</span></div><div class="card-title-row"><h3>'+esc(idea.title)+'</h3></div><p class="impact"><b>목표</b>'+esc(idea.impact)+'</p><div class="parts"><span>핵심 부품</span>'+esc(idea.parts)+'</div><div class="level project-detail"><b>작품 설명</b><p>'+esc(idea.description)+'</p></div></article>'}
function render(){const g=activeGoal(),rows=allRows(),shown=rows.slice(0,state.visible);renderTabs();$("#goalTitle").style.setProperty("--goal",g.color);$("#goalTitle").innerHTML='<span class="badge">'+icon(g)+'</span><div><p>SDG '+g.id+'</p><h2>'+esc(g.title)+' 로봇 아이디어</h2></div>';$("#summary").textContent=g.summary;$("#grid").innerHTML=shown.map(card).join("");$("#moreWrap").style.display=rows.length>state.visible?"block":"none"}
document.addEventListener("click",e=>{const goal=e.target.closest("[data-goal]");if(goal){state.goalId=Number(goal.dataset.goal);state.visible=pageSize();render()}});
$("#moreButton").addEventListener("click",()=>{state.visible+=pageSize();render()});render();
let layoutPageSize=pageSize();window.addEventListener("resize",()=>{const next=pageSize();if(next!==layoutPageSize){layoutPageSize=next;state.visible=next;render()}});
</script>
